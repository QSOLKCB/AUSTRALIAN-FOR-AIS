name: PR4 current-review guarded repair

on:
  push:
    branches:
      - research-corpus-governed-expansion
    paths:
      - .github/workflows/pr4-current-review-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Apply current review repairs
        run: python .github/scripts/pr4-current-review-repair.py
      - name: Preserve policing HTML visibility state before section slicing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_policing_context_roadmap.py")
          text = path.read_text(encoding="utf-8")

          anchor = '''def _mask_non_newline(text: str) -> str:
          '''
          addition = '''HTML_VOID_TAGS = {
              "area", "base", "br", "col", "embed", "hr", "img", "input",
              "link", "meta", "param", "source", "track", "wbr",
          }


          class _HiddenHTMLRegionParser(HTMLParser):
              """Locate browser-hidden HTML regions while preserving source offsets."""

              def __init__(self, text: str) -> None:
                  super().__init__(convert_charrefs=True)
                  self.text = text
                  self.stack: list[tuple[str, bool, int | None]] = []
                  self.spans: list[tuple[int, int]] = []
                  self.line_offsets = [0]
                  for line in text.splitlines(keepends=True):
                      self.line_offsets.append(self.line_offsets[-1] + len(line))

              def _offset(self) -> int:
                  line, column = self.getpos()
                  line_index = min(max(line - 1, 0), len(self.line_offsets) - 1)
                  return min(self.line_offsets[line_index] + column, len(self.text))

              def _tag_end(self, start: int) -> int:
                  close = self.text.find(">", start)
                  return len(self.text) if close < 0 else close + 1

              def handle_starttag(
                  self, tag: str, attrs: list[tuple[str, str | None]]
              ) -> None:
                  tag = tag.lower()
                  parent_hidden = self.stack[-1][1] if self.stack else False
                  own_hidden = _VisibleHTMLTextParser._is_hidden(tag, attrs)
                  hidden = parent_hidden or own_hidden
                  start = self._offset()

                  if tag in HTML_VOID_TAGS:
                      if own_hidden and not parent_hidden:
                          self.spans.append((start, self._tag_end(start)))
                      return

                  root_start = start if hidden and not parent_hidden else None
                  self.stack.append((tag, hidden, root_start))

              def handle_startendtag(
                  self, tag: str, attrs: list[tuple[str, str | None]]
              ) -> None:
                  parent_hidden = self.stack[-1][1] if self.stack else False
                  if _VisibleHTMLTextParser._is_hidden(tag, attrs) and not parent_hidden:
                      start = self._offset()
                      self.spans.append((start, self._tag_end(start)))

              def handle_endtag(self, tag: str) -> None:
                  tag = tag.lower()
                  for index in range(len(self.stack) - 1, -1, -1):
                      if self.stack[index][0] != tag:
                          continue
                      end = self._tag_end(self._offset())
                      popped = self.stack[index:]
                      del self.stack[index:]
                      for _, _, root_start in popped:
                          if root_start is not None:
                              self.spans.append((root_start, end))
                      return

              def finish(self) -> None:
                  for _, _, root_start in self.stack:
                      if root_start is not None:
                          self.spans.append((root_start, len(self.text)))
                  self.stack.clear()


          def _mask_hidden_html_regions(text: str) -> str:
              """Mask hidden containers globally so visibility state survives slicing."""
              parser = _HiddenHTMLRegionParser(text)
              try:
                  parser.feed(text)
                  parser.close()
                  parser.finish()
              except Exception:
                  return _mask_non_newline(text)

              characters = list(text)
              for start, end in parser.spans:
                  for index in range(start, end):
                      if characters[index] not in "\\r\\n":
                          characters[index] = " "
              return "".join(characters)


          '''
          if text.count(anchor) != 1:
              raise SystemExit(f"expected one hidden-mask insertion anchor, found {text.count(anchor)}")
          text = text.replace(anchor, addition + anchor, 1)

          old = '''def _rendered_policing_workstream(roadmap: str) -> str:
              structure = _rendered_structure(roadmap)
              assert WORKSTREAM_HEADING in structure, "rendered policing workstream is missing"
              start = structure.index(WORKSTREAM_HEADING)
              end = structure.index(WORKSTREAM_END, start)
              return structure[start:end]
          '''
          new = '''def _rendered_policing_workstream(roadmap: str) -> str:
              structure = _rendered_structure(roadmap)
              assert WORKSTREAM_HEADING in structure, "rendered policing workstream is missing"
              start = structure.index(WORKSTREAM_HEADING)
              end = structure.index(WORKSTREAM_END, start)
              visible_structure = _mask_hidden_html_regions(structure)
              return visible_structure[start:end]
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected one policing slice anchor, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Run focused regressions
        run: pytest -q tests/test_research_reference_registry.py tests/test_workstream_h_methodology.py tests/test_policing_context_roadmap.py tests/test_policing_contract_receipt.py
      - name: Run full suite
        run: pytest -q --disable-warnings --maxfail=1
      - name: Commit verified repairs and remove temporary runner
        run: |
          rm .github/scripts/pr4-current-review-repair.py
          rm .github/workflows/pr4-current-review-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "Close current PR4 review gaps"
          git push origin HEAD:research-corpus-governed-expansion
