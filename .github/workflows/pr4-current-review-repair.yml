name: PR4 current review repair

on:
  push:
    branches:
      - research-corpus-governed-expansion
    paths:
      - .github/workflows/pr4-current-review-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply audited patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git apply --check .github/pr4-current-review.patch
          git apply .github/pr4-current-review.patch
          git diff --check

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify exact review regressions
        shell: bash
        run: |
          set -euo pipefail
          pytest -q tests/test_pr4_current_review_regressions.py --disable-warnings --maxfail=1

      - name: Verify full repository
        shell: bash
        run: |
          set -euo pipefail
          pytest -q --disable-warnings --maxfail=1
          python -m australian_for_ais.cli validate data/starter/examples.jsonl
          python -m australian_for_ais.cli validate-pilot data/pilot/items.jsonl
          git diff --check

      - name: Commit verified repair and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm .github/pr4-current-review.patch
          rm .github/workflows/pr4-current-review-repair.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden current PR4 review invariants"
          git push origin HEAD:research-corpus-governed-expansion
