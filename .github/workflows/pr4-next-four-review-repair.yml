name: PR4 next-four-review guarded repair

on:
  push:
    branches:
      - research-corpus-governed-expansion
    paths:
      - .github/scripts/pr4-next-four-review-repair.py
      - .github/workflows/pr4-next-four-review-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply next four review repairs
        run: python .github/scripts/pr4-next-four-review-repair.py

      - name: Run focused regressions
        run: |
          pytest -q \
            tests/test_research_reference_registry.py \
            tests/test_policing_context_roadmap.py \
            tests/test_workstream_h_methodology.py

      - name: Run full suite
        run: pytest -q --disable-warnings --maxfail=1

      - name: Commit verified repairs and remove temporary runner
        run: |
          rm .github/scripts/pr4-next-four-review-repair.py
          rm .github/workflows/pr4-next-four-review-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "Close next four PR4 review gaps"
          git push origin HEAD:research-corpus-governed-expansion
