name: Temporary Workstream H hierarchy repair

on:
  push:
    branches:
      - research-corpus-governed-expansion
    paths:
      - .github/workstream-h-hierarchy-trigger.txt

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply exact Workstream H hierarchy repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_workstream_h_methodology.py')
          text = path.read_text(encoding='utf-8')

          function_start = text.index('def _assert_workstream_h_integrity(text: str) -> str:\n')
          function_end = text.index('def _trans_tasman_raw(text: str) -> str:\n', function_start)
          block = text[function_start:function_end]

          old = '''    section = _visible_markdown_text(raw_section)\n    value = " ".join(section.split())\n    actual_hash = hashlib.sha256(value.encode("utf-8")).hexdigest()\n'''
          new = '''    section = _visible_markdown_text(raw_section)\n    policing = runpy.run_path(str(POLICING_TEST))\n    visible_records = policing["_normalised_visible_workstream_records"](raw_section)\n    unsupported_containers = [\n        (signature, line)\n        for signature, line in visible_records\n        if signature not in {"root", "list:2"}\n    ]\n    assert not unsupported_containers, (\n        "browser-visible Workstream H list/container hierarchy changed: "\n        f"{unsupported_containers!r}"\n    )\n    value = " ".join(section.split())\n    actual_hash = hashlib.sha256(value.encode("utf-8")).hexdigest()\n'''
          if block.count(old) != 1:
              raise SystemExit(f'expected exactly one Workstream H integrity anchor in function, found {block.count(old)}')
          block = block.replace(old, new, 1)
          text = text[:function_start] + block + text[function_end:]

          test_anchor = '''def _trans_tasman_raw(text: str) -> str:\n'''
          regression = '''def test_workstream_h_list_hierarchy_is_pinned():\n    roadmap = ROADMAP.read_text(encoding="utf-8")\n    _assert_workstream_h_integrity(roadmap)\n    bullet = (\n        "keep any military claims limited to what official or archival evidence "\n        "actually demonstrates."\n    )\n    canonical = f"- {bullet}"\n    assert canonical in roadmap\n    mutated = roadmap.replace(canonical, f"  - {bullet}", 1)\n    with pytest.raises(AssertionError, match="list/container hierarchy changed"):\n        _assert_workstream_h_integrity(mutated)\n\n\n'''
          if text.count(test_anchor) != 1:
              raise SystemExit(f'expected one Trans-Tasman anchor, found {text.count(test_anchor)}')
          text = text.replace(test_anchor, regression + test_anchor, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify exact regression and focused governance
        shell: bash
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_workstream_h_methodology.py tests/test_policing_context_roadmap.py

      - name: Verify full suite
        shell: bash
        run: python -m pytest -q

      - name: Verify whitespace
        shell: bash
        run: git diff --check

      - name: Commit verified repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_workstream_h_methodology.py
          if git diff --cached --quiet; then
            echo "No repair diff to commit"
            exit 1
          fi
          git commit -m "Preserve Workstream H list hierarchy"
          git push origin HEAD:research-corpus-governed-expansion
