name: PR4 clean-head audit repair v4

on:
  push:
    branches:
      - research-corpus-governed-expansion

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify repair parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "f98b96663c3b0e403309a5d72ae5a30a96ba234b"

      - name: Patch validators and regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def splice(path: Path, start_marker: str, end_marker: str, replacement: str) -> None:
              text = path.read_text(encoding="utf-8")
              if text.count(start_marker) != 1:
                  raise SystemExit(f"{path}: start marker count {text.count(start_marker)} for {start_marker!r}")
              start = text.index(start_marker)
              end = text.find(end_marker, start + len(start_marker))
              if end < 0:
                  raise SystemExit(f"{path}: missing end marker {end_marker!r}")
              path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          policing = Path("tests/test_policing_context_roadmap.py")
          splice(
              policing,
              "        # HTMLParser has already tokenized the complete start tag, including\n",
              "        # contenteditable changes committed governance prose into an\n",
              "".join([
                  "        # Open dialogs may wrap a complete governed Markdown section, but\n",
                  "        # must not split one prose clause into a separate top-layer block.\n",
                  "        # A clean tag line is therefore not sufficient: require the nearest\n",
                  "        # substantive source boundary before the opener to be structural.\n",
                  "        if tag == \"dialog\" and \"open\" in attribute_names and self._source:\n",
                  "            start = self._source_offset()\n",
                  "            before = self._source[:start].rstrip()\n",
                  "            if before:\n",
                  "                previous = before.splitlines()[-1].strip()\n",
                  "                structural = re.fullmatch(\n",
                  "                    r\"(?:#{1,6}[ \\t]+.+|(?:\\*[ \\t]*){3,}|(?:-[ \\t]*){3,}|(?:_[ \\t]*){3,})\",\n",
                  "                    previous,\n",
                  "                )\n",
                  "                if structural is None:\n",
                  "                    self.violations.add(\"dialog-inline-block\")\n",
              ]),
          )
          splice(
              policing,
              "        if tag == \"dialog\":\n            dialog_was_open = self._dialog_open_stack.pop() if self._dialog_open_stack else False\n",
              "        if tag == \"a\":\n",
              "".join([
                  "        if tag == \"dialog\":\n",
                  "            dialog_was_open = self._dialog_open_stack.pop() if self._dialog_open_stack else False\n",
                  "            if dialog_was_open and self._source:\n",
                  "                start = self._source_offset()\n",
                  "                close = self._source.find(\">\", start)\n",
                  "                if close >= 0:\n",
                  "                    after = self._source[close + 1:].lstrip()\n",
                  "                    if after:\n",
                  "                        following = after.splitlines()[0].strip()\n",
                  "                        structural = re.fullmatch(\n",
                  "                            r\"(?:#{1,6}[ \\t]+.+|(?:\\*[ \\t]*){3,}|(?:-[ \\t]*){3,}|(?:_[ \\t]*){3,})\",\n",
                  "                            following,\n",
                  "                        )\n",
                  "                        if structural is None:\n",
                  "                            self.violations.add(\"dialog-inline-block\")\n",
              ]),
          )

          registry = Path("tests/test_research_reference_registry.py")
          old = "".join([
              "    _require_complete_entry_integrity(entry, section)\n",
              "    whole_entry_bindings = tuple(\n",
              "        _usable_https_source_bindings(section, reference_scope=reference_scope)\n",
              "    )\n",
              "    expected_entry_bindings = ENTRY_WIDE_LINK_BINDINGS[entry]\n",
              "    assert whole_entry_bindings == expected_entry_bindings, (\n",
              "        f\"{entry} contains ungoverned or misbound hyperlinks outside its pinned \"\n",
              "        f\"entry contract: expected {expected_entry_bindings!r}, \"\n",
              "        f\"got {whole_entry_bindings!r}\"\n",
              "    )\n",
          ])
          new = "".join([
              "    _require_complete_entry_integrity(entry, section)\n",
              "    whole_entry_bindings = list(\n",
              "        _usable_https_source_bindings(section, reference_scope=reference_scope)\n",
              "    )\n",
              "    expected_entry_bindings = [\n",
              "        (_visible_inline_text(label), destination)\n",
              "        for label, destination in contract[\"source_bindings\"]\n",
              "    ]\n",
              "    if DOI_FIELD in contract:\n",
              "        doi = str(contract[DOI_FIELD])\n",
              "        expected_entry_bindings.append((_visible_inline_text(doi), doi))\n",
              "\n",
              "    # Whole-entry discovery deliberately remains conservative for unrelated\n",
              "    # prose and trailing-registry receipts. Registered-source/DOI field\n",
              "    # validation already normalises equivalent bare, Markdown, and HTML link\n",
              "    # forms, so add only governed bindings that the whole-entry syntax scan\n",
              "    # did not discover. This preserves duplicate/extra-link detection.\n",
              "    discovered_counts = Counter(whole_entry_bindings)\n",
              "    required_counts = Counter(expected_entry_bindings)\n",
              "    for binding, required_count in required_counts.items():\n",
              "        missing = required_count - discovered_counts[binding]\n",
              "        if missing > 0:\n",
              "            whole_entry_bindings.extend([binding] * missing)\n",
              "    assert Counter(whole_entry_bindings) == required_counts, (\n",
              "        f\"{entry} contains ungoverned or misbound hyperlinks outside its pinned \"\n",
              "        f\"entry contract: expected {tuple(expected_entry_bindings)!r}, \"\n",
              "        f\"got {tuple(whole_entry_bindings)!r}\"\n",
              "    )\n",
          ])
          replace_once(registry, old, new)

          Path("tests/test_pr4_clean_head_audit_regressions.py").write_text('''"""Regressions for the PR #4 clean-head audit blockers."""\n\nfrom collections import Counter\nfrom pathlib import Path\nimport runpy\n\nimport pytest\n\nROOT = Path(__file__).resolve().parents[1]\nPOLICING = runpy.run_path(str(ROOT / "tests/test_policing_context_roadmap.py"))\nREGISTRY = runpy.run_path(str(ROOT / "tests/test_research_reference_registry.py"))\nCORPUS = ROOT / "docs/RESEARCH-REFERENCE-CORPUS.md"\n\n\ndef test_clean_line_dialog_clause_fragment_is_rejected() -> None:\n    fragment = (\n        "Availability through ABC iview is\\n"\n        "<dialog open>\\n"\n        "not\\n"\n        "</dialog>\\n"\n        "permission to redistribute content."\n    )\n    assert "dialog-inline-block" in POLICING["_governed_surface_html_violations"](fragment)\n    corpus = CORPUS.read_text(encoding="utf-8")\n    original = "Availability through ABC iview is not permission to redistribute content."\n    assert original in corpus\n    mutated = corpus.replace(original, fragment, 1)\n    with pytest.raises(AssertionError, match="dialog block-container HTML"):\n        REGISTRY["_validate_registry_corpus"](mutated)\n\n\ndef test_structural_section_dialog_wrapper_remains_supported() -> None:\n    fragment = "## Governed section\\n\\n<dialog open>\\nCanonical governed prose.\\n</dialog>\\n\\n## Next section\\n"\n    assert "dialog-inline-block" not in POLICING["_governed_surface_html_violations"](fragment)\n\n\ndef test_single_source_accepts_equivalent_inline_link() -> None:\n    corpus = CORPUS.read_text(encoding="utf-8")\n    url = "https://iview.abc.net.au/show/black-comedy"\n    original = f"**Registered source:** {url}"\n    replacement = f"**Registered source:** [{url}]({url})"\n    assert original in corpus\n    REGISTRY["_validate_registry_corpus"](corpus.replace(original, replacement, 1))\n\n\ndef test_single_source_field_binding_is_format_invariant() -> None:\n    corpus = CORPUS.read_text(encoding="utf-8")\n    url = "https://iview.abc.net.au/show/black-comedy"\n    entry = "### *Black Comedy* (ABC, 2014-2020)"\n    section = REGISTRY["_registered_sections"](corpus)[entry]\n    original_bindings: list[tuple[str, str]] = []\n    REGISTRY["_require_registered_source_link"](\n        entry, section, reference_scope=corpus, source_bindings=original_bindings\n    )\n    replacement = f"**Registered source:** [{url}]({url})"\n    mutated = corpus.replace(f"**Registered source:** {url}", replacement, 1)\n    linked_section = REGISTRY["_registered_sections"](mutated)[entry]\n    linked_bindings: list[tuple[str, str]] = []\n    REGISTRY["_require_registered_source_link"](\n        entry, linked_section, reference_scope=mutated, source_bindings=linked_bindings\n    )\n    expected = Counter({(url, url): 1})\n    assert Counter(original_bindings) == Counter(linked_bindings) == expected\n''', encoding="utf-8")
          PY

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run focused audit regressions
        run: |
          pytest -q \
            tests/test_pr4_clean_head_audit_regressions.py \
            tests/test_pr4_native_machine_dialog_regressions.py \
            tests/test_pr4_source_binding_regressions.py \
            tests/test_research_reference_registry.py \
            tests/test_policing_context_roadmap.py

      - name: Run full suite
        run: pytest -q --disable-warnings --maxfail=1

      - name: Commit verified repair and self-delete runners
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/pr4-audit-repair.yml \
            .github/workflows/pr4-audit-repair-v2.yml \
            .github/workflows/pr4-audit-repair-v3.yml \
            .github/workflows/pr4-audit-repair-v4.yml
          git add \
            tests/test_policing_context_roadmap.py \
            tests/test_research_reference_registry.py \
            tests/test_pr4_clean_head_audit_regressions.py
          git diff --cached --check
          git commit -m "Fix PR4 clean-head audit blockers"
          git push origin HEAD:research-corpus-governed-expansion
