name: PR4 latest review repair

on:
  push:
    branches: [research-corpus-governed-expansion]
    paths:
      - .github/workflows/pr4-autolink-implied-type6-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Apply exact review repairs and regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          policing_path = Path('tests/test_policing_context_roadmap.py')
          registry_path = Path('tests/test_research_reference_registry.py')
          regression_path = Path('tests/test_pr4_current_review_regressions.py')

          policing = policing_path.read_text(encoding='utf-8')
          registry = registry_path.read_text(encoding='utf-8')
          regressions = regression_path.read_text(encoding='utf-8')

          old = 'AUTOLINK_PATTERN = re.compile(r"<(?P<url>https?://[^>\\s]+)>")'
          new = '''AUTOLINK_PATTERN = re.compile(
              r"<(?P<url>[A-Za-z][A-Za-z0-9+.-]{1,31}:[^<>\\x00-\\x20]*)>"
          )'''
          assert old in policing
          policing = policing.replace(old, new, 1)

          old = 'HTML_HEADING_TAGS = frozenset({"h1", "h2", "h3", "h4", "h5", "h6"})\n'
          new = '''HTML_HEADING_TAGS = frozenset({"h1", "h2", "h3", "h4", "h5", "h6"})
          HTML_IMPLIED_SIBLING_END_TAGS = {
              "li": frozenset({"li"}),
              "dt": frozenset({"dt", "dd"}),
              "dd": frozenset({"dt", "dd"}),
          }
          '''
          assert old in policing
          policing = policing.replace(old, new, 1)

          anchor = '        inherited = self.stack[-1][1] if self.stack else False\n'
          insertion = '''        implied_siblings = HTML_IMPLIED_SIBLING_END_TAGS.get(tag)
              if implied_siblings:
                  for index in range(len(self.stack) - 1, -1, -1):
                      if self.stack[index][0] in implied_siblings:
                          del self.stack[index:]
                          break
          '''
          assert policing.count(anchor) == 1
          policing = policing.replace(anchor, insertion + anchor, 1)

          anchor = '        parent_hidden = self.stack[-1][1] if self.stack else False\n'
          insertion = '''        implied_siblings = HTML_IMPLIED_SIBLING_END_TAGS.get(tag)
              if implied_siblings:
                  for index in range(len(self.stack) - 1, -1, -1):
                      if self.stack[index][0] not in implied_siblings:
                          continue
                      popped = self.stack[index:]
                      del self.stack[index:]
                      for _, _, root_start in popped:
                          if root_start is not None:
                              self.spans.append((root_start, start))
                      break
          '''
          assert policing.count(anchor) == 1
          policing = policing.replace(anchor, insertion + anchor, 1)

          anchor = '''        parser.violations.add("executable-url")
              if _contains_live_markdown_image_syntax(markdown_source):
          '''
          insertion = '''        parser.violations.add("executable-url")
              if any(
                  _has_executable_url_scheme(
                      _decode_markdown_destination_for_scheme(match.group("url"))
                  )
                  for match in AUTOLINK_PATTERN.finditer(markdown_source)
              ):
                  parser.violations.add("executable-url")
              if _contains_live_markdown_image_syntax(markdown_source):
          '''
          assert anchor in policing
          policing = policing.replace(anchor, insertion, 1)

          anchor = '''            if re.match(r"#{2,3}(?:[ \\t]+|$)", candidate):
                  return True
              continue
          '''
          insertion = '''            if re.match(r"#{2,3}(?:[ \\t]+|$)", candidate):
                  return True
              if re.search(
                  r"(?:\\*\\*|__)[^\\r\\n]*?:(?:\\*\\*|__)",
                  candidate,
              ):
                  return True
              if re.search(
                  r"(?<!!)\\[[^]\\r\\n]+\\](?:\\([^\\r\\n)]*\\)|\\[[^]\\r\\n]*\\])",
                  candidate,
              ):
                  return True
              if re.search(
                  r"<[A-Za-z][A-Za-z0-9+.-]{1,31}:[^<>\\s]*>",
                  candidate,
              ):
                  return True
              continue
          '''
          assert anchor in registry
          registry = registry.replace(anchor, insertion, 1)

          old_doc = '''    """Detect Markdown headings made inert by a CommonMark type-6 raw HTML block.

              The registry intentionally supports visible raw HTML headings and containers, so
              we do not globally mask type-6 HTML. Instead, fail closed when such a block
              contains Markdown heading syntax before its terminating blank line. This is the
              ambiguity that can fabricate registry boundaries during heading discovery.
              """'''
          new_doc = '''    """Detect governed Markdown made inert by a CommonMark type-6 raw HTML block.

              The registry supports visible raw HTML containers, but Markdown syntax inside a
              type-6 block is literal until the next blank line. Fail closed when such a block
              contains headings, governed strong-metadata labels, or navigable Markdown link
              syntax that later registry passes could otherwise misinterpret as rendered nodes.
              """'''
          assert old_doc in registry
          registry = registry.replace(old_doc, new_doc, 1)

          marker = '\n\n# Human receipt: the guarded repair run verified this regression set before self-cleanup.\n'
          assert marker in regressions
          additions = r'''

          def test_executable_uri_autolink_is_rejected_on_shared_and_registry_surfaces() -> None:
              roadmap = (ROOT / "ROADMAP.md").read_text(encoding="utf-8")
              payload = "\n<javascript:alert(1)>\n"
              mutated_roadmap = roadmap.replace(
                  POLICING["WORKSTREAM_END"], payload + POLICING["WORKSTREAM_END"], 1
              )
              with pytest.raises(AssertionError):
                  POLICING["_validate_policing_workstream"](mutated_roadmap)

              corpus = (ROOT / "docs" / "RESEARCH-REFERENCE-CORPUS.md").read_text(encoding="utf-8")
              entry = "### *Black Comedy* (ABC, 2014-2020)"
              section = REGISTRY["_registered_sections"](corpus)[entry]
              mutated_section = section + "\n<javascript:alert(1)>\n"
              mutated_corpus = corpus.replace(section, mutated_section, 1)
              with pytest.raises(AssertionError):
                  REGISTRY["_validate_registry_corpus"](mutated_corpus)

              assert POLICING["_visible_text"]("<https://example.com/path>") == "https://example.com/path"


          @pytest.mark.parametrize(
              "payload",
              (
                  "<ul><li hidden>masked<li>Current sources may be skipped.</ul>",
                  "<dl><dt hidden>masked<dd>Current sources may be skipped.</dl>",
                  "<dl><dd hidden>masked<dt>Current sources may be skipped.</dl>",
              ),
          )
          def test_implied_list_and_definition_item_ends_expose_shared_contradictions(
              payload: str,
          ) -> None:
              roadmap = (ROOT / "ROADMAP.md").read_text(encoding="utf-8")
              mutated = roadmap.replace(
                  POLICING["WORKSTREAM_END"],
                  "\n" + payload + "\n" + POLICING["WORKSTREAM_END"],
                  1,
              )
              with pytest.raises(AssertionError):
                  POLICING["_validate_policing_workstream"](mutated)


          def test_type6_raw_html_cannot_supply_registry_metadata_or_link() -> None:
              corpus = (ROOT / "docs" / "RESEARCH-REFERENCE-CORPUS.md").read_text(encoding="utf-8")
              url = "https://iview.abc.net.au/show/black-comedy"
              live = f"**Registered source:** {url}"
              inert = f"<div>\n**Registered source:** [{url}]({url})\n</div>"
              assert live in corpus
              mutated = corpus.replace(live, inert, 1)
              assert REGISTRY["_contains_markdown_structure_in_type6_raw_html"](mutated)
              with pytest.raises(AssertionError, match="type-6"):
                  REGISTRY["_validate_registry_corpus"](mutated)
          '''
          regressions = regressions.replace(marker, additions + marker, 1)

          policing_path.write_text(policing, encoding='utf-8')
          registry_path.write_text(registry, encoding='utf-8')
          regression_path.write_text(regressions, encoding='utf-8')
          PY

      - name: Exact current-review regressions
        run: python -m pytest -q tests/test_pr4_current_review_regressions.py

      - name: Full test suite
        run: python -m pytest -q

      - name: Whitespace check
        run: git diff --check

      - name: Commit repaired tree and self-clean
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr4-autolink-implied-type6-repair.yml
          git add tests/test_policing_context_roadmap.py tests/test_research_reference_registry.py tests/test_pr4_current_review_regressions.py
          git commit -m 'Harden autolinks implied ends and raw HTML metadata'
          git push origin HEAD:research-corpus-governed-expansion
