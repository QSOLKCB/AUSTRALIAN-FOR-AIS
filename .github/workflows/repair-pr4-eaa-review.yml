name: Guarded PR4 eaa review repair

on:
  push:
    branches:
      - research-corpus-governed-expansion

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch latest Codex findings
        run: python .github/repair_pr4_eaa_review.py

      - name: Install test dependencies
        run: python -m pip install -e . pytest

      - name: Focused governance verification
        run: >-
          python -m pytest -q
          tests/test_policing_context_roadmap.py
          tests/test_workstream_h_methodology.py
          tests/test_policing_contract_receipt.py
          tests/test_phase2_review_followup.py
          tests/test_research_reference_registry.py

      - name: Full suite
        run: python -m pytest -q

      - name: Whitespace check
        run: git diff --check

      - name: Commit verified repair and remove temporary runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/repair-pr4-eaa-review.yml .github/repair_pr4_eaa_review.py
          git add tests/test_research_reference_registry.py .github/workflows/repair-pr4-eaa-review.yml .github/repair_pr4_eaa_review.py
          git commit -m "Harden raw HTML punctuation and popover visibility"
          git push origin HEAD:research-corpus-governed-expansion
