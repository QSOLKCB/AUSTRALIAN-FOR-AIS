name: PR4 browser-semantics guarded repair

on:
  push:
    branches:
      - research-corpus-governed-expansion
    paths:
      - .github/workflows/pr4-browser-semantics-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Normalize policing repair anchor
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_policing_context_roadmap.py")
          text = path.read_text(encoding="utf-8")
          old = '''    def handle_startendtag(
                  self, tag: str, attrs: list[tuple[str, str | None]]
              ) -> None:
                  parent_hidden = self.stack[-1][1] if self.stack else False
          '''
          new = '''    def handle_startendtag(self, tag: str, attrs: list[tuple[str, str | None]]) -> None:
                  parent_hidden = self.stack[-1][1] if self.stack else False
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected one policing hidden-parser signature, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Apply browser-semantics repairs
        run: python .github/scripts/pr4-browser-semantics-repair.py
      - name: Run focused regressions
        run: pytest -q tests/test_research_reference_registry.py tests/test_policing_context_roadmap.py tests/test_policing_contract_receipt.py
      - name: Run full suite
        run: pytest -q --disable-warnings --maxfail=1
      - name: Commit verified repairs and remove temporary runner
        run: |
          rm .github/scripts/pr4-browser-semantics-repair.py
          rm .github/workflows/pr4-browser-semantics-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "Close latest PR4 browser semantics gaps"
          git push origin HEAD:research-corpus-governed-expansion
