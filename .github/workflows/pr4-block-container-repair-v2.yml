name: PR4 block-container ownership repair v2

on:
  push:
    branches:
      - research-corpus-governed-expansion

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact repair parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "1455d09ce8274c61ea8932a462ff96ba631ecc2b"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply corrected repair script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/pr4-block-container-repair.yml").read_text(
              encoding="utf-8"
          )
          start_marker = "          from pathlib import Path\n"
          end_marker = "          PY\n"
          start = workflow.index(start_marker)
          end = workflow.index(end_marker, start)
          yaml_block = workflow[start:end]

          source_lines: list[str] = []
          for line in yaml_block.splitlines():
              if not line:
                  source_lines.append("")
                  continue
              if not line.startswith("          "):
                  raise SystemExit(f"unexpected repair-script indentation: {line!r}")
              source_lines.append(line[10:])

          # V1 accidentally stripped ten spaces from every deeply nested line
          # inside two generated raw strings. Remove only those two normalizer
          # statements; the YAML block de-indentation above already preserves
          # the intended Python indentation exactly.
          source_lines = [
              line
              for line in source_lines
              if not line.startswith('helpers = "\\n".join(line[10:]')
              and not line.startswith('new_tests = "\\n".join(line[10:]')
          ]
          source = "\n".join(source_lines) + "\n"
          exec(compile(source, "<pr4-block-container-repair>", "exec"), {"__name__": "__main__"})
          PY

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run focused block-container regressions
        run: |
          pytest -q \
            tests/test_pr4_clean_head_audit_regressions.py \
            tests/test_policing_context_roadmap.py \
            tests/test_research_reference_registry.py

      - name: Run full suite
        run: pytest -q --disable-warnings --maxfail=1

      - name: Commit verified repair and self-delete runners
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr4-block-container-repair.yml \
                 .github/workflows/pr4-block-container-repair-v2.yml
          git add tests/test_policing_context_roadmap.py \
                  tests/test_pr4_clean_head_audit_regressions.py
          git diff --cached --check
          git commit -m "Fix PR4 block-container ownership gaps"
          git push origin HEAD:research-corpus-governed-expansion
