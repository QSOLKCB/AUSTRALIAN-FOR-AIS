name: PR4 marker aria hr repair

on:
  push:
    branches:
      - research-corpus-governed-expansion

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0

      - name: Guard reviewed base and exact trigger head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD~4)" = "e89df4ba00b11c2c609989c4a1e24ee240f76f6e"
          test "$(git rev-parse HEAD~3)" = "606c2be7e3c5d47ea4928f9268bb65abbe09fe53"
          test "$(git rev-parse HEAD~2)" = "f1409f5cf0eb77198053284c69e22c8c53bc9888"
          test "$(git rev-parse HEAD~1)" = "3f2313297ec0a03c0a80bccd844fb072880f1ea9"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply guarded repair
        run: python .github/repair-pr4-marker-aria-hr.py

      - name: Verify exact review regressions
        run: pytest -q tests/test_pr4_current_review_regressions.py

      - name: Verify focused governance surface
        run: >-
          pytest -q
          tests/test_policing_context_roadmap.py
          tests/test_research_reference_registry.py
          tests/test_workstream_h_methodology.py
          tests/test_policing_contract_receipt.py
          tests/test_pr4_current_review_regressions.py

      - name: Validate starter dataset
        run: python -m australian_for_ais.cli validate data/starter/examples.jsonl

      - name: Validate Phase 2 pilot pack
        run: python -m australian_for_ais.cli validate-pilot data/pilot/items.jsonl

      - name: Verify full repository suite
        run: pytest -q --disable-warnings --maxfail=1

      - name: Verify whitespace
        run: git diff --check

      - name: Self-clean and commit tested repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/repair-pr4-marker-aria-hr.py
          rm .github/workflows/pr4-marker-aria-hr-repair.yml
          git add tests/test_policing_context_roadmap.py \
                  tests/test_research_reference_registry.py \
                  tests/test_pr4_current_review_regressions.py \
                  .github/repair-pr4-marker-aria-hr.py \
                  .github/workflows/pr4-marker-aria-hr-repair.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix governed marker accessibility and break semantics"
          git push origin HEAD:research-corpus-governed-expansion
