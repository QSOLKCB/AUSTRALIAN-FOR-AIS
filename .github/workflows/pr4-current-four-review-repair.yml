name: PR4 current four review repair

on:
  push:
    branches:
      - research-corpus-governed-expansion
    paths:
      - .github/scripts/pr4-current-four-review-repair.py
      - .github/workflows/pr4-current-four-review-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply exact review repair
        run: python .github/scripts/pr4-current-four-review-repair.py

      - name: Guard intended patch and whitespace
        run: |
          git diff --check
          python - <<'PY'
          import subprocess
          expected = {
              "tests/test_research_reference_registry.py",
              "tests/test_phase2_review_followup.py",
          }
          changed = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          if changed != expected:
              raise SystemExit(f"unexpected substantive patch set: {sorted(changed)!r}")
          print("intended substantive patch set:", sorted(changed))
          PY

      - name: Run focused governance suite
        run: |
          pytest -q \
            tests/test_research_reference_registry.py \
            tests/test_workstream_h_methodology.py \
            tests/test_policing_context_roadmap.py \
            tests/test_policing_contract_receipt.py \
            tests/test_phase2_review_followup.py

      - name: Validate starter dataset
        run: python -m australian_for_ais.cli validate data/starter/examples.jsonl

      - name: Validate Phase 2 pilot pack
        run: python -m australian_for_ais.cli validate-pilot data/pilot/items.jsonl

      - name: Run full repository suite
        run: pytest -q --disable-warnings --maxfail=1

      - name: Self-clean temporary repair machinery
        run: |
          rm -f .github/scripts/pr4-current-four-review-repair.py
          rm -f .github/workflows/pr4-current-four-review-repair.yml
          git diff --check
          python - <<'PY'
          import subprocess
          expected = {
              ".github/scripts/pr4-current-four-review-repair.py",
              ".github/workflows/pr4-current-four-review-repair.yml",
              "tests/test_research_reference_registry.py",
              "tests/test_phase2_review_followup.py",
          }
          changed = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          if changed != expected:
              raise SystemExit(f"unexpected post-clean patch set: {sorted(changed)!r}")
          print("post-clean patch set:", sorted(changed))
          PY

      - name: Commit verified repair
        env:
          BRANCH: research-corpus-governed-expansion
        run: |
          git config user.name "Trent Slade"
          git config user.email "73952179+EmergentMonk@users.noreply.github.com"
          git add -A
          git commit -m "Close latest four PR4 review gaps"
          git push origin "HEAD:${BRANCH}"
