name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: write

jobs:
  repair-inline-rendering:
    name: Repair rendered inline-code handling
    if: github.event_name == 'push' && github.ref == 'refs/heads/research-corpus-governed-expansion'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0

      - name: Apply focused parser repair
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_research_reference_registry.py")
          text = path.read_text(encoding="utf-8")

          visible_start = text.index("def _visible_inline_text(text: str) -> str:")
          visible_end = text.index("\ndef _normalise_https_destination", visible_start)
          visible_replacement = '''def _render_inline_code_spans(text: str) -> str:
              """Replace same-line code spans with the text they visibly render."""
              parts: list[str] = []
              position = 0
              while position < len(text):
                  if text[position] != "`":
                      parts.append(text[position])
                      position += 1
                      continue
                  run_end = position
                  while run_end < len(text) and text[run_end] == "`":
                      run_end += 1
                  marker = text[position:run_end]
                  close = text.find(marker, run_end)
                  if close < 0:
                      parts.append(marker)
                      position = run_end
                      continue
                  parts.append(text[run_end:close].strip(" "))
                  position = close + len(marker)
              return "".join(parts)


          def _visible_inline_text(text: str) -> str:
              """Reduce Markdown/HTML metadata to its rendered visible text."""
              rendered = _rendered_registry_text(text)
              visible = _render_inline_code_spans(rendered)
              visible = MARKDOWN_LINK_PATTERN.sub(lambda match: match.group("label"), visible)
              visible = AUTOLINK_PATTERN.sub(lambda match: match.group("url"), visible)
              visible = HTML_TAG_PATTERN.sub(" ", visible)
              visible = html.unescape(visible)
              visible = visible.replace("**", "").replace("__", "")
              visible = visible.replace("*", "").replace("_", "")
              return " ".join(visible.split())
          '''
          text = text[:visible_start] + visible_replacement + text[visible_end + 1:]

          scalar_start = text.index("def _scalar_value(entry: str, section: str, field: str) -> str:")
          scalar_end = text.index("\ndef _require_scalar_value", scalar_start)
          scalar_replacement = '''def _scalar_value(entry: str, section: str, field: str) -> str:
              rendered, structure = _markdown_views(section)
              prefix = rf"(?m)^ {{0,3}}{re.escape(field)}"
              occurrences = list(re.finditer(prefix, structure))
              assert len(occurrences) == 1, (
                  f"{entry} must contain exactly one mandatory field {field}"
              )
              match = re.search(
                  rf"{prefix}[ \\t]*([^\\r\\n]*\\S[^\\r\\n]*)[ \\t]*$",
                  structure,
              )
              assert match, f"{entry} has an empty mandatory field {field}"
              raw_value = rendered[match.start(1):match.end(1)]
              value = _visible_inline_text(raw_value)
              assert value, f"{entry} has an empty mandatory field {field}"
              return value
          '''
          text = text[:scalar_start] + scalar_replacement + text[scalar_end + 1:]

          old_inline_expectation = '''    with pytest.raises(AssertionError, match="empty registered-source field"):
              _require_registered_source_link("### Example", inline)
          '''
          new_inline_expectation = '''    with pytest.raises(AssertionError, match="no usable HTTPS destination"):
              _require_registered_source_link("### Example", inline)
          '''
          if old_inline_expectation not in text:
              raise SystemExit("expected inline-source assertion not found")
          text = text.replace(old_inline_expectation, new_inline_expectation, 1)

          old_scalar_value = '"**Rights and provenance boundary:** `hidden value`\\n",'
          new_scalar_value = '"**Rights and provenance boundary:** <!-- hidden value -->\\n",'
          if old_scalar_value not in text:
              raise SystemExit("expected inline scalar fixture not found")
          text = text.replace(old_scalar_value, new_scalar_value, 1)

          old_governance_value = '"**Community-specific governance:** not-required: `hidden`\\n"'
          new_governance_value = '"**Community-specific governance:** not-required: <!-- hidden -->\\n"'
          if old_governance_value not in text:
              raise SystemExit("expected inline governance fixture not found")
          text = text.replace(old_governance_value, new_governance_value, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Check syntax
        run: python -m py_compile tests/test_research_reference_registry.py

      - name: Commit focused repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_research_reference_registry.py
          git commit -m "Render inline code correctly in registry fields"
          git push origin HEAD:research-corpus-governed-expansion

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate starter dataset
        run: python -m australian_for_ais.cli validate data/starter/examples.jsonl

      - name: Validate Phase 2 pilot pack
        run: python -m australian_for_ais.cli validate-pilot data/pilot/items.jsonl

      - name: Run tests
        run: pytest -q --disable-warnings --maxfail=1

  wheel-smoke:
    name: Wheel install smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build --wheel

      - name: Install wheel in clean environment
        run: |
          python -m venv /tmp/afa-wheel-venv
          /tmp/afa-wheel-venv/bin/pip install dist/*.whl

      - name: Verify packaged schema resources
        run: |
          /tmp/afa-wheel-venv/bin/python -c "from australian_for_ais.validation import _get_example_schema, _get_evaluation_schema, _get_pilot_item_schema, _get_annotation_schema; assert _get_example_schema()['x-project-schema-version'] == '0.1.0'; assert _get_evaluation_schema()['x-project-schema-version'] == '0.1.0'; assert _get_pilot_item_schema()['x-project-schema-version'] == '0.1.0'; assert _get_annotation_schema()['x-project-schema-version'] == '0.1.0'"
