          def _mask_non_newline(text: str) -> str:
              return "".join(character if character in "\\r\\n" else " " for character in text)


          def _mask_comments(raw_line: str, in_comment: bool) -> tuple[str, bool]:
              characters = list(raw_line)
              position = 0
              while position < len(raw_line):
                  if in_comment:
                      closes = [
                          index
                          for index in (
                              raw_line.find("-->", position),
                              raw_line.find("--!>", position),
                          )
                          if index >= 0
                      ]
                      if not closes:
                          return _mask_non_newline(raw_line), True
                      close = min(closes)
                      length = 4 if raw_line.startswith("--!>", close) else 3
                      for index in range(position, close + length):
                          if characters[index] not in "\\r\\n":
                              characters[index] = " "
                      position = close + length
                      in_comment = False
                      continue
                  opener = raw_line.find("<!--", position)
                  if opener < 0:
                      break
                  in_comment = True
                  position = opener
              return "".join(characters), in_comment


          def _rendered_structure(text: str) -> str:
              parts: list[str] = []
              in_comment = False
              fence_character: str | None = None
              fence_length = 0
              for raw_line in text.splitlines(keepends=True):
                  line = raw_line.rstrip("\\r\\n")
                  stripped = line.lstrip(" ")
                  indentation = len(line) - len(stripped)
                  if fence_character is not None:
                      parts.append(_mask_non_newline(raw_line))
                      if indentation <= 3 and re.fullmatch(
                          rf"{re.escape(fence_character)}{{{fence_length},}}[ \\t]*",
                          stripped,
                      ):
                          fence_character = None
                          fence_length = 0
                      continue
                  if in_comment:
                      rendered, in_comment = _mask_comments(raw_line, True)
                      parts.append(rendered)
                      continue
                  opener = None
                  if indentation <= 3:
                      opener = re.fullmatch(r"(?P<fence>`{3,}|~{3,}).*", stripped)
                  if opener is not None:
                      marker = opener.group("fence")
                      fence_character = marker[0]
                      fence_length = len(marker)
                      parts.append(_mask_non_newline(raw_line))
                      continue
                  rendered, in_comment = _mask_comments(raw_line, False)
                  parts.append(rendered)
              return "".join(parts)


          def _rendered_section(text: str, heading: str, next_heading: str) -> str:
              structure = _rendered_structure(text)
              assert heading in structure, f"rendered section is missing: {heading}"
              start = structure.index(heading)
              end = structure.find(next_heading, start + len(heading))
              assert end >= 0, f"rendered section has no closing boundary: {heading}"
              return structure[start:end]


          def _validate_policing_contract(roadmap: str, methodology: str) -> None:
