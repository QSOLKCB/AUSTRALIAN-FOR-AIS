name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: write

jobs:
  repair-latest-codex-registry-findings:
    name: Finish latest Codex registry findings
    if: github.event_name == 'push' && github.ref == 'refs/heads/research-corpus-governed-expansion'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0

      - name: Wire paragraph and reference-definition semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_research_reference_registry.py")
          text = path.read_text(encoding="utf-8")

          old = '''        if fence is not None:
              rendered_parts.append(raw_line)
              structural_parts.append(_mask_non_newline(raw_line))
              if _is_fence_closer(line, fence):
                  fence = None
              continue
          '''
          new = '''        if fence is not None:
              rendered_parts.append(raw_line)
              structural_parts.append(_mask_non_newline(raw_line))
              paragraph_open = False
              if _is_fence_closer(line, fence):
                  fence = None
              continue
          '''
          if old not in text:
              raise SystemExit("active-fence block not found")
          text = text.replace(old, new, 1)

          old = '''        if in_comment:
              rendered_line, in_comment = _mask_html_comments_on_line(
                  raw_line,
                  in_comment=True,
              )
              rendered_parts.append(rendered_line)
              structural_parts.append(_mask_inline_code_spans(rendered_line))
              continue
          '''
          new = '''        if in_comment:
              rendered_line, in_comment = _mask_html_comments_on_line(
                  raw_line,
                  in_comment=True,
              )
              rendered_parts.append(rendered_line)
              structural_parts.append(_mask_inline_code_spans(rendered_line))
              if not in_comment:
                  paragraph_open = _line_opens_paragraph(
                      rendered_line.rstrip("\\r\\n")
                  )
              continue
          '''
          if old not in text:
              raise SystemExit("comment block not found")
          text = text.replace(old, new, 1)

          old = '''        context = _line_context(line)
              if context.indented_code:
                  rendered_parts.append(raw_line)
                  structural_parts.append(_mask_non_newline(raw_line))
                  continue

              opener = _fence_opener(line)
          '''
          new = '''        context = _line_context(line)
              if context.indented_code and not paragraph_open:
                  rendered_parts.append(raw_line)
                  structural_parts.append(_mask_non_newline(raw_line))
                  continue
              if context.indented_code and paragraph_open:
                  rendered_line, in_comment = _mask_html_comments_on_line(
                      raw_line,
                      in_comment=False,
                  )
                  rendered_parts.append(rendered_line)
                  structural_parts.append(_mask_inline_code_spans(rendered_line))
                  paragraph_open = True
                  continue

              opener = _fence_opener(line)
          '''
          if old not in text:
              raise SystemExit("indented-code block not found")
          text = text.replace(old, new, 1)

          old = '''        if opener is not None:
              fence = opener
              rendered_parts.append(raw_line)
              structural_parts.append(_mask_non_newline(raw_line))
              continue
          '''
          new = '''        if opener is not None:
              fence = opener
              rendered_parts.append(raw_line)
              structural_parts.append(_mask_non_newline(raw_line))
              paragraph_open = False
              continue
          '''
          if old not in text:
              raise SystemExit("fence-opener block not found")
          text = text.replace(old, new, 1)

          old = '''        rendered_parts.append(rendered_line)
              structural_parts.append(_mask_inline_code_spans(rendered_line))

              return "".join(rendered_parts), "".join(structural_parts)
          '''
          new = '''        rendered_parts.append(rendered_line)
              structural_parts.append(_mask_inline_code_spans(rendered_line))
              paragraph_open = _line_opens_paragraph(rendered_line.rstrip("\\r\\n"))

              return "".join(rendered_parts), "".join(structural_parts)
          '''
          if old not in text:
              raise SystemExit("normal rendered-line block not found")
          text = text.replace(old, new, 1)

          old = '''        if re.fullmatch(r"\\*\\*[^*]+:\\*\\*(?:[ \\t].*)?", line):
              continue
          if _visible_inline_text(line):
              return True
          '''
          new = '''        if re.fullmatch(r"\\*\\*[^*]+:\\*\\*(?:[ \\t].*)?", line):
              continue
          if LINK_REFERENCE_DEFINITION_PATTERN.fullmatch(line):
              continue
          if _visible_inline_text(line):
              return True
          '''
          if old not in text:
              raise SystemExit("mapping visible-content block not found")
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Check repaired test syntax
        run: python -m py_compile tests/test_research_reference_registry.py

      - name: Commit parser repair
        run: |
          if git diff --quiet -- tests/test_research_reference_registry.py; then
            echo "Final parser repair already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_research_reference_registry.py
          git commit -m "Finish CommonMark registry semantics"
          git push origin HEAD:research-corpus-governed-expansion

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate starter dataset
        run: python -m australian_for_ais.cli validate data/starter/examples.jsonl

      - name: Validate Phase 2 pilot pack
        run: python -m australian_for_ais.cli validate-pilot data/pilot/items.jsonl

      - name: Run tests
        run: pytest -q --disable-warnings --maxfail=1

  wheel-smoke:
    name: Wheel install smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build --wheel

      - name: Install wheel in clean environment
        run: |
          python -m venv /tmp/afa-wheel-venv
          /tmp/afa-wheel-venv/bin/pip install dist/*.whl

      - name: Verify packaged schema resources
        run: |
          /tmp/afa-wheel-venv/bin/python -c "from australian_for_ais.validation import _get_example_schema, _get_evaluation_schema, _get_pilot_item_schema, _get_annotation_schema; assert _get_example_schema()['x-project-schema-version'] == '0.1.0'; assert _get_evaluation_schema()['x-project-schema-version'] == '0.1.0'; assert _get_pilot_item_schema()['x-project-schema-version'] == '0.1.0'; assert _get_annotation_schema()['x-project-schema-version'] == '0.1.0'"
