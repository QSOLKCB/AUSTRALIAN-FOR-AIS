name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: write

jobs:
  repair-latest-codex-registry-findings:
    name: Complete robust latest Codex repair
    if: github.event_name == 'push' && github.ref == 'refs/heads/research-corpus-governed-expansion'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0

      - name: Apply complete rendered Markdown repair
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_research_reference_registry.py")
          text = path.read_text(encoding="utf-8")

          def ensure_entry_doi(entry_fragment: str, source_fragment: str, doi: str) -> None:
              global text
              entry_start = text.index(entry_fragment)
              next_entry = text.find("\n    ", entry_start + len(entry_fragment))
              if next_entry < 0:
                  next_entry = len(text)
              window = text[entry_start:next_entry]
              doi_line = f'        doi="{doi}",\n'
              if doi_line in window:
                  return
              source_start = text.index(source_fragment, entry_start)
              if source_fragment.endswith("),\n"):
                  insert_at = source_start + len(source_fragment)
              else:
                  insert_at = text.index("        ),\n", source_start) + len("        ),\n")
              text = text[:insert_at] + doi_line + text[insert_at:]

          ensure_entry_doi(
              '"### Chey (2021), *Overcoming awkwardness: some interpretations of "',
              '        sources=("https://europeanjournalofhumour.org/ejhr/article/view/560",),\n',
              "https://doi.org/10.7592/EJHR2021.9.4.560",
          )
          ensure_entry_doi(
              '"### Hurley (2025), *Laughter with purpose: how First Nations Australian "',
              '            "https://www.tandfonline.com/doi/full/10.1080/2040610X.2025.2538977",\n',
              "https://doi.org/10.1080/2040610X.2025.2538977",
          )

          start = text.index("def _markdown_views(text: str) -> tuple[str, str]:")
          end = text.index("\ndef _rendered_registry_text", start)
          replacement = '''def _markdown_views(text: str) -> tuple[str, str]:
              """Return rendered and structural views with exact offsets preserved."""
              rendered_parts: list[str] = []
              structural_parts: list[str] = []
              in_comment = False
              fence: FenceState | None = None
              paragraph_open = False

              for raw_line in text.splitlines(keepends=True):
                  line = raw_line.rstrip("\\r\\n")
                  if not line.strip():
                      paragraph_open = False

                  while fence is not None and not _fence_container_continues(line, fence):
                      fence = None

                  if fence is not None:
                      rendered_parts.append(raw_line)
                      structural_parts.append(_mask_non_newline(raw_line))
                      paragraph_open = False
                      if _is_fence_closer(line, fence):
                          fence = None
                      continue

                  if in_comment:
                      rendered_line, in_comment = _mask_html_comments_on_line(
                          raw_line,
                          in_comment=True,
                      )
                      rendered_parts.append(rendered_line)
                      structural_parts.append(_mask_inline_code_spans(rendered_line))
                      if not in_comment:
                          paragraph_open = _line_opens_paragraph(
                              rendered_line.rstrip("\\r\\n")
                          )
                      continue

                  context = _line_context(line)
                  if context.indented_code and not paragraph_open:
                      rendered_parts.append(raw_line)
                      structural_parts.append(_mask_non_newline(raw_line))
                      continue

                  if context.indented_code and paragraph_open:
                      rendered_line, in_comment = _mask_html_comments_on_line(
                          raw_line,
                          in_comment=False,
                      )
                      rendered_parts.append(rendered_line)
                      structural_parts.append(_mask_inline_code_spans(rendered_line))
                      paragraph_open = True
                      continue

                  opener = _fence_opener(line)
                  if opener is not None:
                      fence = opener
                      rendered_parts.append(raw_line)
                      structural_parts.append(_mask_non_newline(raw_line))
                      paragraph_open = False
                      continue

                  rendered_line, in_comment = _mask_html_comments_on_line(
                      raw_line,
                      in_comment=False,
                  )
                  rendered_parts.append(rendered_line)
                  structural_parts.append(_mask_inline_code_spans(rendered_line))
                  paragraph_open = _line_opens_paragraph(
                      rendered_line.rstrip("\\r\\n")
                  )

              return "".join(rendered_parts), "".join(structural_parts)
          '''
          text = text[:start] + replacement + text[end:]

          start = text.index("def _has_non_heading_content(block: str) -> bool:")
          end = text.index("\ndef _require_mapping_block", start)
          replacement = '''def _has_non_heading_content(block: str) -> bool:
              rendered = _rendered_registry_text(block)
              fence: FenceState | None = None

              for raw_line in rendered.splitlines():
                  while fence is not None and not _fence_container_continues(raw_line, fence):
                      fence = None

                  if fence is not None:
                      if _is_fence_closer(raw_line, fence):
                          fence = None
                          continue
                      if _fence_logical_line(raw_line, fence).strip():
                          return True
                      continue

                  opener = _fence_opener(raw_line)
                  if opener is not None:
                      fence = opener
                      continue

                  context = _line_context(raw_line)
                  if THEMATIC_BREAK_PATTERN.fullmatch(context.after_quotes.strip()):
                      continue
                  line = context.logical.strip()
                  if not line:
                      continue
                  if re.fullmatch(r"(?:Candidate research mappings:|Research mappings:)", line):
                      continue
                  if line == "Relevant project mappings:":
                      continue
                  if re.fullmatch(r"#{1,6}[ \\t]+.+", line):
                      continue
                  if THEMATIC_BREAK_PATTERN.fullmatch(line):
                      continue
                  if re.fullmatch(r"(?:[-+*]|\\d{1,9}[.)])", line):
                      continue
                  if re.fullmatch(r"\\*\\*[^*]+:\\*\\*(?:[ \\t].*)?", line):
                      continue
                  if LINK_REFERENCE_DEFINITION_PATTERN.fullmatch(line):
                      continue
                  if _visible_inline_text(line):
                      return True

              return False
          '''
          text = text[:start] + replacement + text[end:]

          path.write_text(text, encoding="utf-8")
          PY

      - name: Check repaired test syntax
        run: python -m py_compile tests/test_research_reference_registry.py

      - name: Run focused registry regressions
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q tests/test_research_reference_registry.py --disable-warnings --maxfail=1

      - name: Commit parser repair
        run: |
          if git diff --quiet -- tests/test_research_reference_registry.py; then
            echo "Complete repair already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_research_reference_registry.py
          git commit -m "Complete latest registry hardening"
          git push origin HEAD:research-corpus-governed-expansion

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate starter dataset
        run: python -m australian_for_ais.cli validate data/starter/examples.jsonl

      - name: Validate Phase 2 pilot pack
        run: python -m australian_for_ais.cli validate-pilot data/pilot/items.jsonl

      - name: Run tests
        run: pytest -q --disable-warnings --maxfail=1

  wheel-smoke:
    name: Wheel install smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build --wheel

      - name: Install wheel in clean environment
        run: |
          python -m venv /tmp/afa-wheel-venv
          /tmp/afa-wheel-venv/bin/pip install dist/*.whl

      - name: Verify packaged schema resources
        run: |
          /tmp/afa-wheel-venv/bin/python -c "from australian_for_ais.validation import _get_example_schema, _get_evaluation_schema, _get_pilot_item_schema, _get_annotation_schema; assert _get_example_schema()['x-project-schema-version'] == '0.1.0'; assert _get_evaluation_schema()['x-project-schema-version'] == '0.1.0'; assert _get_pilot_item_schema()['x-project-schema-version'] == '0.1.0'; assert _get_annotation_schema()['x-project-schema-version'] == '0.1.0'"
