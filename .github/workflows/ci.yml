name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: write

jobs:
  synchronize-review-documentation:
    name: Synchronize review documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/research-corpus-governed-expansion'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0

      - name: Synchronize roadmap and changelog
        run: |
          python - <<'PY'
          from pathlib import Path

          roadmap_path = Path("ROADMAP.md")
          roadmap = roadmap_path.read_text(encoding="utf-8")
          old = (
              "- add a canonical methodology section defining jurisdiction/date metadata, "
              "encounter categories, matched controls, source hierarchy, and legal-review "
              "requirements;"
          )
          new = (
              "- maintain and extend the canonical policing-context methodology section in "
              "`docs/METHODOLOGY.md` as jurisdictional sources and experiment families are "
              "adopted;"
          )
          if old not in roadmap:
              raise SystemExit("stale Workstream I methodology follow-up not found")
          roadmap = roadmap.replace(old, new, 1)
          roadmap_path.write_text(roadmap, encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          anchor = (
              "- Added source-gated Workstream I for Australian and United States policing-context "
              "transfer, requiring jurisdiction/date/source metadata, independently authored "
              "examples, explicit legal-review boundaries, and separation of institutional-script "
              "comparison from national moral ranking\n"
          )
          addition = (
              "- Centralized Workstream I policing-context methodology with jurisdiction/date "
              "metadata, source hierarchy, matched construction controls, observable-variable "
              "treatment of the proposed Australian `lighter touch` hypothesis, and legal-review "
              "gates; hardened rendered roadmap and registry validation for paragraph "
              "continuations, link-reference-only mappings, pinned DOI metadata, and image-only "
              "source links\n"
          )
          if addition not in changelog:
              if anchor not in changelog:
                  raise SystemExit("Workstream I changelog anchor not found")
              changelog = changelog.replace(anchor, anchor + addition, 1)
          changelog_path.write_text(changelog, encoding="utf-8")
          PY

      - name: Commit documentation synchronization
        run: |
          if git diff --quiet -- ROADMAP.md CHANGELOG.md; then
            echo "Documentation already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md CHANGELOG.md
          git commit -m "Synchronize policing methodology roadmap state"
          git push origin HEAD:research-corpus-governed-expansion

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate starter dataset
        run: python -m australian_for_ais.cli validate data/starter/examples.jsonl

      - name: Validate Phase 2 pilot pack
        run: python -m australian_for_ais.cli validate-pilot data/pilot/items.jsonl

      - name: Run tests
        run: pytest -q --disable-warnings --maxfail=1

  wheel-smoke:
    name: Wheel install smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build --wheel

      - name: Install wheel in clean environment
        run: |
          python -m venv /tmp/afa-wheel-venv
          /tmp/afa-wheel-venv/bin/pip install dist/*.whl

      - name: Verify packaged schema resources
        run: |
          /tmp/afa-wheel-venv/bin/python -c "from australian_for_ais.validation import _get_example_schema, _get_evaluation_schema, _get_pilot_item_schema, _get_annotation_schema; assert _get_example_schema()['x-project-schema-version'] == '0.1.0'; assert _get_evaluation_schema()['x-project-schema-version'] == '0.1.0'; assert _get_pilot_item_schema()['x-project-schema-version'] == '0.1.0'; assert _get_annotation_schema()['x-project-schema-version'] == '0.1.0'"
