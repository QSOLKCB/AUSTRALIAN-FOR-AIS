          policing = '''"""Regression checks for the proposed policing-context research workstream."""

          from pathlib import Path
          import re

          import pytest


          ROADMAP = Path(__file__).parent.parent / "ROADMAP.md"
          METHODOLOGY = Path(__file__).parent.parent / "docs" / "METHODOLOGY.md"
          WORKSTREAM_HEADING = "### I. Australian and United States policing-context transfer"
