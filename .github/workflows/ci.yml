name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install build

      - name: Validate starter dataset
        run: |
          python -m australian_for_ais.cli validate data/starter/examples.jsonl

      - name: Run tests
        run: |
          pytest

      - name: Build wheel
        run: |
          python -m build --wheel

      - name: Smoke-test non-editable wheel schema resources
        run: |
          python -m venv /tmp/afa-wheel-venv
          /tmp/afa-wheel-venv/bin/pip install dist/*.whl
          /tmp/afa-wheel-venv/bin/python -c "from australian_for_ais.validation import _get_example_schema, _get_evaluation_schema; assert _get_example_schema()['x-project-schema-version'] == '0.1.0'; assert _get_evaluation_schema()['x-project-schema-version'] == '0.1.0'"
