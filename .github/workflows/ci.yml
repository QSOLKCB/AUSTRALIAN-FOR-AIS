name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: write

jobs:
  repair-rendered-value-slices:
    name: Repair rendered value slices
    if: github.event_name == 'push' && github.ref == 'refs/heads/research-corpus-governed-expansion'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0

      - name: Apply focused field-slicing repair
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_research_reference_registry.py")
          text = path.read_text(encoding="utf-8")

          old_governance_pattern = '''GOVERNANCE_PATTERN = re.compile(
              r"(?m)^ {0,3}\\*\\*Community-specific governance:\\*\\*[ \\t]*"
              r"(required|not-required):[ \\t]*([^\\r\\n]*\\S[^\\r\\n]*)[ \\t]*$"
          )
          '''
          new_governance_pattern = '''GOVERNANCE_PATTERN = re.compile(
              r"(?m)^ {0,3}\\*\\*Community-specific governance:\\*\\*[ \\t]*"
              r"(required|not-required):(?P<rationale>[^\\r\\n]*)$"
          )
          '''
          if old_governance_pattern not in text:
              raise SystemExit("governance pattern not found")
          text = text.replace(old_governance_pattern, new_governance_pattern, 1)

          scalar_start = text.index(
              "def _scalar_value(entry: str, section: str, field: str) -> str:"
          )
          scalar_end = text.index("\ndef _require_scalar_value", scalar_start)
          scalar_replacement = '''def _scalar_value(entry: str, section: str, field: str) -> str:
              rendered, structure = _markdown_views(section)
              prefix = rf"(?m)^ {{0,3}}{re.escape(field)}"
              occurrences = list(re.finditer(prefix, structure))
              assert len(occurrences) == 1, (
                  f"{entry} must contain exactly one mandatory field {field}"
              )
              match = re.search(
                  rf"{prefix}(?P<value>[^\\r\\n]*)$",
                  structure,
              )
              assert match, f"{entry} has an empty mandatory field {field}"
              raw_value = rendered[match.start("value"):match.end("value")]
              value = _visible_inline_text(raw_value)
              assert value, f"{entry} has an empty mandatory field {field}"
              return value
          '''
          text = text[:scalar_start] + scalar_replacement + text[scalar_end + 1:]

          source_start = text.index(
              "def _require_registered_source_link(entry: str, section: str) -> tuple[str, ...]:"
          )
          source_end = text.index("\ndef _require_community_governance", source_start)
          source_replacement = '''def _require_registered_source_link(entry: str, section: str) -> tuple[str, ...]:
              rendered, structure = _markdown_views(section)
              source_fields = list(REGISTERED_SOURCE_FIELD_PATTERN.finditer(structure))
              assert len(source_fields) == 1, (
                  f"{entry} must contain exactly one registered-source field"
              )
              source_block = re.search(
                  r"(?ms)^ {0,3}\\*\\*Registered sources?:\\*\\*(.*?)"
                  r"(?=^ {0,3}\\*\\*[^*\\n]+:\\*\\*|\\Z)",
                  structure,
              )
              assert source_block, f"{entry} has an empty registered-source field"
              source_value = rendered[source_block.start(1):source_block.end(1)]
              assert _visible_inline_text(source_value), (
                  f"{entry} has an empty registered-source field"
              )

              destinations = _usable_https_destinations(source_value)
              assert destinations, (
                  f"{entry} has no usable HTTPS destination in its registered-source field"
              )
              assert len(destinations) == len(set(destinations)), (
                  f"{entry} contains duplicate registered-source destinations"
              )
              return destinations
          '''
          text = text[:source_start] + source_replacement + text[source_end + 1:]

          governance_start = text.index(
              "def _require_community_governance(entry: str, section: str) -> str:"
          )
          governance_end = text.index("\ndef _require_pinned_entry_contract", governance_start)
          governance_replacement = '''def _require_community_governance(entry: str, section: str) -> str:
              rendered, structure = _markdown_views(section)
              fields = list(GOVERNANCE_FIELD_PATTERN.finditer(structure))
              assert len(fields) == 1, (
                  f"{entry} must contain exactly one community-specific governance field"
              )
              classification = GOVERNANCE_PATTERN.search(structure)
              assert classification, (
                  f"{entry} has an invalid community-specific governance classification or rationale"
              )
              raw_rationale = rendered[
                  classification.start("rationale"):classification.end("rationale")
              ]
              rationale = _visible_inline_text(raw_rationale)
              assert rationale, (
                  f"{entry} has an invalid community-specific governance classification or rationale"
              )
              value = classification.group(1)
              if value == "required":
                  safe_use = _scalar_value(entry, section, SAFE_FIELD)
                  assert CONSULTATION_BOUNDARY in safe_use, (
                      f"{entry} is missing its community-specific consultation boundary "
                      "from the safe benchmark abstraction field"
                  )
              return value
          '''
          text = text[:governance_start] + governance_replacement + text[governance_end + 1:]

          path.write_text(text, encoding="utf-8")
          PY

      - name: Check repaired test syntax
        run: python -m py_compile tests/test_research_reference_registry.py

      - name: Commit parser repair
        run: |
          if git diff --quiet -- tests/test_research_reference_registry.py; then
            echo "Field-slicing repair already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_research_reference_registry.py
          git commit -m "Preserve rendered metadata value slices"
          git push origin HEAD:research-corpus-governed-expansion

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate starter dataset
        run: python -m australian_for_ais.cli validate data/starter/examples.jsonl

      - name: Validate Phase 2 pilot pack
        run: python -m australian_for_ais.cli validate-pilot data/pilot/items.jsonl

      - name: Run tests
        run: pytest -q --disable-warnings --maxfail=1

  wheel-smoke:
    name: Wheel install smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build --wheel

      - name: Install wheel in clean environment
        run: |
          python -m venv /tmp/afa-wheel-venv
          /tmp/afa-wheel-venv/bin/pip install dist/*.whl

      - name: Verify packaged schema resources
        run: |
          /tmp/afa-wheel-venv/bin/python -c "from australian_for_ais.validation import _get_example_schema, _get_evaluation_schema, _get_pilot_item_schema, _get_annotation_schema; assert _get_example_schema()['x-project-schema-version'] == '0.1.0'; assert _get_evaluation_schema()['x-project-schema-version'] == '0.1.0'; assert _get_pilot_item_schema()['x-project-schema-version'] == '0.1.0'; assert _get_annotation_schema()['x-project-schema-version'] == '0.1.0'"
