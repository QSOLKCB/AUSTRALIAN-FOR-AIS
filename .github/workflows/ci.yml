                  section = '''## Australian and United States Policing-Context Experiment Design

          Workstream I studies whether AI systems transfer policing language, legal scripts, agency assumptions, emergency conventions, or screen-fiction tropes across Australian and United States jurisdictions. It is a source-gated linguistic-pragmatic design, not legal advice, a use-of-force evaluation, or a ranking of which country polices better.

          Every implemented item must record the relevant **country, jurisdiction, institutional role, encounter type, and source date**. Where needed, it must also record the agency or service, legal topic, supplied authority status, and whether the scene concerns ordinary service, traffic, welfare, public order, emergency response, questioning, interview, detention, search, consent, caution, or explicit compulsion. Australian federal, state, and territory systems must remain distinct, as must United States federal, state, county, municipal, sheriff, highway-patrol, and special-jurisdiction systems.

          The source hierarchy is jurisdiction- and date-specific. Current official legislation, court material, police-service or government guidance, and other authoritative primary material take priority for legal or procedural propositions. Archival records may support historical questions, and media may be used only to identify a trope being tested. A source from one jurisdiction, agency, date, or encounter category cannot silently establish another. Claims must be revised or retired when their governing source becomes stale or is superseded.

          Preferred construction controls include:

          - same-utterance jurisdiction swaps that hold wording and non-jurisdictional context constant while changing country, state or territory, agency, role, or supplied rule;
          - matched request, direction, warning, caution, consent-inquiry, voluntary-cooperation, uncertainty, and compulsory-instruction conditions;
          - role-title and emergency-routing pairs whose correct interpretation depends on the supplied institution rather than a globally assumed script;
          - ordinary, calm, humorous, understated, or casually addressed encounters crossed with explicit authority and coercion controls, so tone is not treated as a legal-status label;
          - fictional-trope controls that distinguish a familiar screen phrase from the official rule or practice supplied in the item; and
          - unresolved conditions where the evidence does not establish whether an utterance is voluntary, compulsory, legally operative, merely polite, or institutionally appropriate.

          A claim such as “Australian police use a lighter conversational touch” is eligible only as a source-gated and encounter-specific hypothesis about register, discretion, or interactional style. It must not become a national moral ranking, a universal description of officers, or evidence that calm language removes coercive authority.

          Linguistic-pragmatic scoring must remain separate from legal correctness, policy evaluation, use-of-force analysis, institutional legitimacy, and moral comparison. High-stakes legal conclusions require appropriate legal review and relevant Australian and United States policing, civil-liberties, and community expertise. Dataset items must be independently authored and must not copy body-camera audio, police interviews, television dialogue, viral clips, or identifiable real-person encounters.

          The following boundaries are mandatory:

          - **US POLICE SCRIPT != AUSTRALIAN LEGAL PROCEDURE**
          - **POLICE TERMINOLOGY != CROSS-JURISDICTION EQUIVALENCE**
          - **CASUAL ADDRESS != FRIENDSHIP OR CONSENT**
          - **CALM TONE != ABSENCE OF COERCIVE AUTHORITY**
          - **POLITE WORDING != VOLUNTARY CHOICE**
          - **FICTIONAL POLICE TROPE != OPERATIONAL POLICY**
          - **ONE AGENCY != A NATIONAL POLICING SYSTEM**
          - **ONE ENCOUNTER != SYSTEM-WIDE GROUND TRUTH**
          - **JURISDICTIONAL DIFFERENCE != NATIONAL MORAL CHARACTER**
          - **LEGAL INFORMATION != LEGAL ADVICE**

          ---

          '''
                  methodology = replace_once(
                      methodology,
                      "## Scoring Philosophy",
                      section + "## Scoring Philosophy",
                      "canonical policing methodology",
                  )
          methodology_path.write_text(methodology, encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          new_change = (
              "- Centralized Workstream I policing-context methodology and hardened its rendered-roadmap regression; "
              "preserved visible paragraph continuations, rejected invisible link-reference mappings and image-only source destinations, "
              "and pinned Chey/Hurley DOI metadata against alteration or duplication\n"
          )
          if new_change not in changelog:
              anchor = (
                  "- Added source-gated Workstream I for Australian and United States policing-context transfer, requiring jurisdiction/date/source metadata, independently authored examples, explicit legal-review boundaries, and separation of institutional-script comparison from national moral ranking\n"
              )
              changelog = replace_once(
                  changelog,
                  anchor,
                  anchor + new_change,
                  "changelog repair note",
              )
          changelog_path.write_text(changelog, encoding="utf-8")
          PY

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify repair
        run: |
          python -m py_compile tests/test_research_reference_registry.py tests/test_policing_context_roadmap.py
          git diff --check
          pytest -q --disable-warnings --maxfail=1

      - name: Commit repaired files
        run: |
          if git diff --quiet -- \
            tests/test_research_reference_registry.py \
            tests/test_policing_context_roadmap.py \
            ROADMAP.md \
            docs/METHODOLOGY.md \
            CHANGELOG.md; then
            echo "Latest review repairs are already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/test_research_reference_registry.py \
            tests/test_policing_context_roadmap.py \
            ROADMAP.md \
            docs/METHODOLOGY.md \
            CHANGELOG.md
          git commit -m "Fix latest governed-registry review findings"
          git push origin HEAD:research-corpus-governed-expansion
