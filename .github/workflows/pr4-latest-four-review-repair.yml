name: PR4 latest four review repair

on:
  push:
    branches:
      - research-corpus-governed-expansion
    paths:
      - .github/workflows/pr4-latest-four-review-repair.yml

permissions:
  contents: write

jobs:
  guarded-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact staging head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply fail-closed review repair
        run: python .github/scripts/pr4-latest-four-review-repair.py

      - name: Verify only intended substantive files changed
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            tests/test_research_reference_registry.py
            tests/test_workstream_h_methodology.py
          )
          printf 'Changed files after repair:\n'
          printf '  %s\n' "${changed[@]}"
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            echo "Unexpected substantive repair file set" >&2
            exit 1
          fi

      - name: Verify patch whitespace
        run: git diff --check

      - name: Run focused governance suite
        run: |
          pytest -q \
            tests/test_research_reference_registry.py \
            tests/test_workstream_h_methodology.py \
            tests/test_policing_context_roadmap.py \
            tests/test_policing_contract_receipt.py \
            tests/test_phase2_review_followup.py

      - name: Validate starter dataset
        run: python -m australian_for_ais.cli validate data/starter/examples.jsonl

      - name: Validate Phase 2 pilot pack
        run: python -m australian_for_ais.cli validate-pilot data/pilot/items.jsonl

      - name: Run full repository suite
        run: pytest -q --disable-warnings --maxfail=1

      - name: Self-clean temporary repair machinery
        run: |
          rm -f .github/scripts/pr4-latest-four-review-repair.py
          rm -f .github/workflows/pr4-latest-four-review-repair.yml
          git diff --check

      - name: Commit and push only after every gate passes
        shell: bash
        run: |
          git config user.name "Trent Slade"
          git config user.email "73952179+EmergentMonk@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "Close four fresh PR4 review gaps"
          git push origin HEAD:research-corpus-governed-expansion
