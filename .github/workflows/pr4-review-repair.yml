      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify exact review regressions
        run: pytest -q tests/test_pr4_block_and_receipt_regressions.py

      - name: Verify focused governance suites
        run: |
          pytest -q \
            tests/test_policing_context_roadmap.py \
            tests/test_policing_contract_receipt.py \
            tests/test_research_reference_registry.py \
            tests/test_workstream_h_methodology.py \
            tests/test_ascft_methodology_integrity.py \
            tests/test_pr4_block_and_receipt_regressions.py

      - name: Verify datasets and full suite
        run: |
          python -m australian_for_ais.cli validate data/starter/examples.jsonl
          python -m australian_for_ais.cli validate-pilot data/pilot/items.jsonl
          pytest -q --disable-warnings --maxfail=1
          git diff --check

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr4-review-repair.yml
          git add tests/test_policing_context_roadmap.py \
                  tests/test_research_reference_registry.py \
                  tests/test_policing_contract_receipt.py \
                  tests/test_pr4_block_and_receipt_regressions.py
          git commit -m "Harden governed block and receipt structure"
          git push origin HEAD:research-corpus-governed-expansion
