name: PR4 current review repair

on:
  push:
    branches:
      - research-corpus-governed-expansion
    paths:
      - .github/workflows/pr4-review-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply fail-closed review repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          policing_path = Path("tests/test_policing_context_roadmap.py")
          policing = policing_path.read_text(encoding="utf-8")
          policing = replace_once(
              policing,
              '''        if tag == "table":
                      self.violations.add("raw-table")
          ''',
              '''        if tag == "table":
                      self.violations.add("raw-table")
                  # Raw list containers can terminate surrounding paragraphs in the
                  # browser while flattened text still matches a sealed prose receipt.
                  if tag in {"ol", "ul"}:
                      self.violations.add("raw-list")
          ''',
              "raw-list scanner hardening",
          )
          policing = replace_once(
              policing,
              '''        # Hyperlink auditing can send an additional network request that is not
                  # represented by the sealed href binding. Per-anchor targets likewise
                  # change framed navigation behavior without changing that binding.
                  if tag == "a" and {"ping", "target"}.intersection(attribute_names):
          ''',
              '''        # Hyperlink auditing can send an additional network request that is not
                  # represented by the sealed href binding. Targets change framing, while
                  # download changes activation without changing the sealed label/href binding.
                  if tag == "a" and {"download", "ping", "target"}.intersection(attribute_names):
          ''',
              "anchor activation hardening",
          )
          policing_path.write_text(policing, encoding="utf-8")

          registry_path = Path("tests/test_research_reference_registry.py")
          registry = registry_path.read_text(encoding="utf-8")
          registry = replace_once(
              registry,
              '''    "raw-table",
              "named-details",
          ''',
              '''    "raw-table",
              "raw-list",
              "named-details",
          ''',
              "active raw-list kind",
          )
          registry = replace_once(
              registry,
              '''def _normalised_source_use_rules_value(corpus: str) -> str:
          ''',
              '''def _status_link_bindings(corpus: str) -> tuple[tuple[str, str], ...]:
              """Return every live HTTPS link binding inside the Status section."""
              rendered, structure = _markdown_views(corpus)
              start, _ = _visible_markdown_heading_span(structure, STATUS_HEADING)
              end, _ = _visible_markdown_heading_span(structure, SOURCE_USE_HEADING)
              assert start < end, "rendered Status/source-use boundaries are out of order"
              return tuple(
                  _usable_https_source_bindings(
                      rendered[start:end],
                      reference_scope=corpus,
                  )
              )


          def _normalised_source_use_rules_value(corpus: str) -> str:
          ''',
              "Status link receipt helper",
          )
          registry = replace_once(
              registry,
              '''    assert actual_status_hash == STATUS_SECTION_HASH, (
                  "browser-visible Status section changed or was weakened: "
                  f"expected hash {STATUS_SECTION_HASH!r}, got {actual_status_hash!r}"
              )

              visible_source_use = _normalised_source_use_rules_value(corpus)
          ''',
              '''    assert actual_status_hash == STATUS_SECTION_HASH, (
                  "browser-visible Status section changed or was weakened: "
                  f"expected hash {STATUS_SECTION_HASH!r}, got {actual_status_hash!r}"
              )
              status_links = _status_link_bindings(corpus)
              assert not status_links, (
                  "Status section must not contain hyperlinks unless an explicit link contract is added; "
                  f"got {status_links!r}"
              )

              visible_source_use = _normalised_source_use_rules_value(corpus)
          ''',
              "Status link enforcement",
          )
          registry = replace_once(
              registry,
              '''    assert "raw-table" not in found, (
                  "raw table HTML, including visually hidden raw HTML table semantics, is not allowed in governed documents"
              )
              assert "named-details" not in found, (
          ''',
              '''    assert "raw-table" not in found, (
                  "raw table HTML, including visually hidden raw HTML table semantics, is not allowed in governed documents"
              )
              assert "raw-list" not in found, (
                  "raw list HTML is not allowed in governed documents because list containers can "
                  "detach sealed scalar prose during browser tree construction"
              )
              assert "named-details" not in found, (
          ''',
              "raw-list enforcement",
          )
          registry = replace_once(
              registry,
              '''    assert "executable-url" not in found, (
                  "executable URL HTML is not allowed in governed documents"
              )
          ''',
              '''    assert "executable-url" not in found, (
                  "executable URL or activation-changing anchor HTML is not allowed in governed documents"
              )
          ''',
              "activation diagnostic",
          )
          registry = replace_once(
              registry,
              '''    assert _normalised_source_use_rules_value(mutated) == _normalised_source_use_rules_value(corpus)
              assert _source_use_rules_record_receipt(mutated) == _source_use_rules_record_receipt(corpus)
              with pytest.raises(AssertionError, match="no usable HTTPS destination"):
                  _source_use_rules_link_bindings(mutated)
          ''',
              '''    assert _normalised_source_use_rules_value(mutated) == _normalised_source_use_rules_value(corpus)
              with pytest.raises(AssertionError, match="executable URL"):
                  _source_use_rules_record_receipt(mutated)
              with pytest.raises(AssertionError, match="no usable HTTPS destination"):
                  _source_use_rules_link_bindings(mutated)
          ''',
              "legacy empty-href download regression",
          )
          registry_path.write_text(registry, encoding="utf-8")

          regression_path = Path("tests/test_pr4_review_20260909_regressions.py")
          regression_path.write_text(
              '''from pathlib import Path
          import runpy

          import pytest


          ROOT = Path(__file__).parent.parent
          REGISTRY = runpy.run_path(str(Path(__file__).with_name("test_research_reference_registry.py")))


          def test_registered_source_anchor_rejects_download_activation() -> None:
              corpus = (ROOT / "docs" / "RESEARCH-REFERENCE-CORPUS.md").read_text(encoding="utf-8")
              url = "https://iview.abc.net.au/show/black-comedy"
              live = f"**Registered source:** {url}"
              downloaded = f'**Registered source:** <a href="{url}" download>{url}</a>'
              assert live in corpus
              mutated = corpus.replace(live, downloaded, 1)
              with pytest.raises(AssertionError, match="executable URL"):
                  REGISTRY["_validate_registry_corpus"](mutated)


          def test_status_receipt_rejects_unregistered_link_binding() -> None:
              corpus = (ROOT / "docs" / "RESEARCH-REFERENCE-CORPUS.md").read_text(encoding="utf-8")
              live = "**research reference registry**"
              linked = "**[research reference registry](https://creativecommons.org/publicdomain/zero/1.0/)**"
              assert live in corpus
              mutated = corpus.replace(live, linked, 1)
              assert REGISTRY["_normalised_status_value"](mutated) == REGISTRY["_normalised_status_value"](corpus)
              with pytest.raises(AssertionError, match="Status section must not contain hyperlinks"):
                  REGISTRY["_validate_registry_corpus"](mutated)


          def test_raw_html_list_cannot_detach_complete_entry_boundary() -> None:
              corpus = (ROOT / "docs" / "RESEARCH-REFERENCE-CORPUS.md").read_text(encoding="utf-8")
              heading = "### *Black Comedy* (ABC, 2014-2020)"
              section = REGISTRY["_registered_sections"](corpus)[heading]
              live = "is not permission to"
              split = "is <ul><li>not</li></ul> permission to"
              assert live in section
              mutated_section = section.replace(live, split, 1)
              assert REGISTRY["_normalise_complete_entry_integrity"](mutated_section) == REGISTRY["_normalise_complete_entry_integrity"](section)
              mutated = corpus.replace(section, mutated_section, 1)
              with pytest.raises(AssertionError, match="raw list HTML"):
                  REGISTRY["_validate_registry_corpus"](mutated)
          ''',
              encoding="utf-8",
          )
          PY

      - name: Verify focused regressions
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q tests/test_pr4_review_20260909_regressions.py --disable-warnings --maxfail=1

      - name: Verify full suite and whitespace
        run: |
          git diff --check
          pytest -q --disable-warnings --maxfail=1
          git diff --check

      - name: Commit verified repair and self-delete runner
        shell: bash
        run: |
          rm .github/workflows/pr4-review-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden governed registry browser semantics"
          git push origin HEAD:research-corpus-governed-expansion
