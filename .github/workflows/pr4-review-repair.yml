name: PR4 exact-head review repair

on:
  push:
    branches:
      - research-corpus-governed-expansion

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Apply review repairs
        run: python scripts/_repair_pr4_codex.py
      - name: Run focused tests
        run: python -m pytest -q tests/test_research_reference_registry.py tests/test_policing_context_roadmap.py
      - name: Commit repaired head
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No repair changes to commit.'
            exit 0
          fi
          git commit -m 'Harden registry and policing review invariants'
          git push origin HEAD:research-corpus-governed-expansion
