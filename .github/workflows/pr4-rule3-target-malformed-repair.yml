name: Repair PR4 rule3 target malformed tags

on:
  push:
    branches:
      - research-corpus-governed-expansion

permissions:
  contents: write

concurrency:
  group: repair-pr4-rule3-target-malformed
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify repair-only branch movement
        shell: bash
        run: |
          set -euo pipefail
          base='df6185a6e467d5fb2a91b701576f5e8506119cc2'
          unexpected="$(git diff --name-only "$base" HEAD | grep -v -E '^\.github/(repair-pr4-rule3-target-malformed\.py|workflows/pr4-rule3-target-malformed-repair\.yml)$' || true)"
          test -z "$unexpected" || {
            echo "Refusing repair because substantive files moved since the reviewed head:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          }

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply guarded validator repair
        shell: bash
        run: |
          set -euo pipefail
          python .github/repair-pr4-rule3-target-malformed.py
          git diff --check

      - name: Run exact review regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_pr4_current_review_regressions.py

      - name: Run focused governance suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_policing_context_roadmap.py \
            tests/test_research_reference_registry.py \
            tests/test_pr4_current_review_regressions.py

      - name: Validate datasets
        shell: bash
        run: |
          set -euo pipefail
          python -m australian_for_ais.cli validate data/starter/examples.jsonl
          python -m australian_for_ais.cli validate-pilot data/pilot/items.jsonl

      - name: Run full suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q

      - name: Commit verified repair and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          rm \
            .github/workflows/pr4-rule3-target-malformed-repair.yml \
            .github/repair-pr4-rule3-target-malformed.py
          git add \
            tests/test_policing_context_roadmap.py \
            tests/test_pr4_current_review_regressions.py \
            .github/workflows/pr4-rule3-target-malformed-repair.yml \
            .github/repair-pr4-rule3-target-malformed.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix CommonMark and governed-link parser bypasses"
          git push origin HEAD:research-corpus-governed-expansion
