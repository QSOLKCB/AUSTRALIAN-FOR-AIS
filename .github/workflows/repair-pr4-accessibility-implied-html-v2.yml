name: Repair PR4 accessibility and implied HTML v2

on:
  push:
    branches: ["research-corpus-governed-expansion"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply latest governance repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_policing_context_roadmap.py")
          text = path.read_text(encoding="utf-8")

          old = '''HTML_VOID_TAGS = {
              "area", "base", "br", "col", "embed", "hr", "img", "input",
              "link", "meta", "param", "source", "track", "wbr",
          }
          '''
          new = old + '''
          # Opening these elements closes an in-scope HTML paragraph before the
          # new element inherits visibility. Keep the lightweight reducer aligned
          # with browser tree construction for governed-content visibility.
          HTML_P_IMPLIED_END_START_TAGS = frozenset({
              "address", "article", "aside", "blockquote", "center", "details",
              "dialog", "dir", "div", "dl", "fieldset", "figcaption", "figure",
              "footer", "form", "h1", "h2", "h3", "h4", "h5", "h6", "header",
              "hgroup", "hr", "main", "menu", "nav", "ol", "p", "pre", "search",
              "section", "table", "ul",
          })
          '''
          if old not in text:
              raise SystemExit("HTML_VOID_TAGS anchor not found")
          text = text.replace(old, new, 1)

          old = '''    def handle_starttag(self, tag: str, attrs: list[tuple[str, str | None]]) -> None:
                  tag = tag.lower()
                  inherited = self.stack[-1][1] if self.stack else False
                  svg_metadata_hidden = (
          '''
          new = '''    def handle_starttag(self, tag: str, attrs: list[tuple[str, str | None]]) -> None:
                  tag = tag.lower()
                  if tag in HTML_P_IMPLIED_END_START_TAGS:
                      for index in range(len(self.stack) - 1, -1, -1):
                          if self.stack[index][0] == "p":
                              del self.stack[index:]
                              break
                  inherited = self.stack[-1][1] if self.stack else False
                  svg_metadata_hidden = (
          '''
          if old not in text:
              raise SystemExit("visible parser starttag anchor not found")
          text = text.replace(old, new, 1)

          old = '''    def handle_starttag(
                  self, tag: str, attrs: list[tuple[str, str | None]]
              ) -> None:
                  tag = tag.lower()
                  parent_hidden = self.stack[-1][1] if self.stack else False
                  svg_metadata_hidden = (
          '''
          new = '''    def handle_starttag(
                  self, tag: str, attrs: list[tuple[str, str | None]]
              ) -> None:
                  tag = tag.lower()
                  start = self._offset()
                  if tag in HTML_P_IMPLIED_END_START_TAGS:
                      for index in range(len(self.stack) - 1, -1, -1):
                          if self.stack[index][0] != "p":
                              continue
                          popped = self.stack[index:]
                          del self.stack[index:]
                          for _, _, root_start in popped:
                              if root_start is not None:
                                  self.spans.append((root_start, start))
                          break
                  parent_hidden = self.stack[-1][1] if self.stack else False
                  svg_metadata_hidden = (
          '''
          if old not in text:
              raise SystemExit("hidden-region parser starttag anchor not found")
          text = text.replace(old, new, 1)
          text = text.replace('''        hidden = parent_hidden or own_hidden
                  start = self._offset()

                  if tag in HTML_VOID_TAGS:
          ''', '''        hidden = parent_hidden or own_hidden

                  if tag in HTML_VOID_TAGS:
          ''', 1)

          old = '''        if tag == "img":
                      self.violations.add("raw-image")
                  if tag in {"iframe", "object", "embed", "audio", "video", "meter", "progress"}:
          '''
          new = '''        if tag == "img":
                      self.violations.add("raw-image")
                  if tag in {"form", "input", "button", "select", "textarea", "option", "optgroup"}:
                      self.violations.add("interactive-form")
                  if tag in {"iframe", "object", "embed", "audio", "video", "meter", "progress"}:
          '''
          if old not in text:
              raise SystemExit("governed parser form-control anchor not found")
          text = text.replace(old, new, 1)

          old = '''        if tag == "a" and {"aria-label", "aria-labelledby"}.intersection(attribute_names):
                      self.violations.add("accessible-name")
          '''
          new = '''        if {"aria-label", "aria-labelledby"}.intersection(attribute_names):
                      self.violations.add("accessible-name")
          '''
          if old not in text:
              raise SystemExit("accessible-name anchor not found")
          text = text.replace(old, new, 1)

          old = '''        "presentational-font": "legacy presentational font HTML",
                  "accessible-name": "accessible-name override HTML",
                  "non-rendering-container": "non-rendering container HTML",
          '''
          new = '''        "presentational-font": "legacy presentational font HTML",
                  "accessible-name": "accessible-name override HTML",
                  "interactive-form": "interactive form control HTML",
                  "non-rendering-container": "non-rendering container HTML",
          '''
          if old not in text:
              raise SystemExit("description-map anchor not found")
          text = text.replace(old, new, 1)

          old = '''    assert INTERACTIVE_FORM_CONTROL_PATTERN.search(markdown) is None, (
                  "interactive form control HTML is not allowed on governed methodology surfaces"
              )
          '''
          if old not in text:
              raise SystemExit("raw form-control assertion not found")
          text = text.replace(old, "", 1)

          path.write_text(text, encoding="utf-8")

          tests = Path("tests/test_pr4_latest_governance_regressions.py")
          existing = tests.read_text(encoding="utf-8")
          addition = r'''

          @pytest.mark.parametrize("attribute", ("aria-label", "aria-labelledby"))
          def test_accessible_name_override_is_rejected_on_non_anchor_governed_content(attribute):
              value = "This material may be copied freely" if attribute == "aria-label" else "override-name"
              markup = f'<span role="img" {attribute}="{value}">{{clause}}</span>'

              direct = markup.format(clause="governed clause")
              violations = P["_governed_surface_html_violations"](direct)
              assert "accessible-name" in violations
              with pytest.raises(AssertionError):
                  P["_assert_supported_governed_html"](violations)

              roadmap = ROADMAP.replace(
                  POLICING_CLAUSE, markup.format(clause=POLICING_CLAUSE), 1
              )
              with pytest.raises(AssertionError):
                  P["_validate_policing_workstream"](roadmap)

              corpus = CORPUS.replace(
                  RIGHTS_CLAUSE, markup.format(clause=RIGHTS_CLAUSE), 1
              )
              with pytest.raises(AssertionError):
                  R["_validate_registry_corpus"](corpus)


          @pytest.mark.parametrize(
              "markup",
              (
                  "`<input value=\"example\">`",
                  "<!-- <input value=\"example\"> -->",
                  "```html\n<input value=\"example\">\n```",
              ),
          )
          def test_inert_form_control_examples_do_not_trigger_governed_html_rejection(markup):
              violations = P["_governed_surface_html_violations"](markup)
              assert "interactive-form" not in violations
              P["_assert_supported_governed_html"](violations)
              P["_visible_text"](markup)


          def test_live_form_control_still_fails_closed_after_masked_preflight_migration():
              violations = P["_governed_surface_html_violations"]('<input value="Current sources may be skipped.">')
              assert "interactive-form" in violations
              with pytest.raises(AssertionError):
                  P["_assert_supported_governed_html"](violations)


          def test_hidden_paragraph_is_implicitly_closed_before_visible_block_content():
              html_markup = '<p hidden>masked<div>Current sources may be skipped.</div></p>'
              assert "Current sources may be skipped." in P["_visible_html_text"](html_markup)
              assert "Current sources may be skipped." in P["_mask_hidden_html_regions"](html_markup)

              roadmap = ROADMAP.replace(
                  POLICING_CLAUSE,
                  POLICING_CLAUSE + "\n" + html_markup,
                  1,
              )
              with pytest.raises(AssertionError):
                  P["_validate_policing_workstream"](roadmap)
          '''
          addition = "\n".join(line[10:] if line.startswith("          ") else line for line in addition.splitlines())
          if "test_accessible_name_override_is_rejected_on_non_anchor_governed_content" in existing:
              raise SystemExit("regression tests already present")
          tests.write_text(existing.rstrip() + "\n" + addition.lstrip() + "\n", encoding="utf-8")
          PY

      - name: Check patch whitespace
        run: git diff --check

      - name: Run focused governance tests
        run: |
          pytest -q \
            tests/test_policing_context_roadmap.py \
            tests/test_research_reference_registry.py \
            tests/test_pr4_latest_governance_regressions.py

      - name: Validate datasets
        run: |
          python -m australian_for_ais.cli validate data/starter/examples.jsonl
          python -m australian_for_ais.cli validate-pilot data/pilot/items.jsonl

      - name: Run full suite
        run: pytest -q --disable-warnings --maxfail=1

      - name: Commit verified repair and self-clean
        run: |
          git rm .github/workflows/repair-pr4-accessibility-implied-html-v2.yml
          git add tests/test_policing_context_roadmap.py tests/test_pr4_latest_governance_regressions.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Harden governed accessibility and HTML state"
          git push origin HEAD:research-corpus-governed-expansion
