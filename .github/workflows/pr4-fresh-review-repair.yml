name: PR4 Fresh Review Repair

on:
  push:
    branches:
      - research-corpus-governed-expansion

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply guarded fresh-review repair
        run: python .github/pr4_fresh_review_repair.py

      - name: Check patch whitespace
        run: git diff --check

      - name: Validate starter dataset
        run: python -m australian_for_ais.cli validate data/starter/examples.jsonl

      - name: Validate Phase 2 pilot pack
        run: python -m australian_for_ais.cli validate-pilot data/pilot/items.jsonl

      - name: Run focused governance suite
        run: >-
          pytest -q
          tests/test_research_reference_registry.py
          tests/test_policing_context_roadmap.py
          tests/test_workstream_h_methodology.py
          tests/test_policing_contract_receipt.py
          --disable-warnings --maxfail=1

      - name: Run full suite
        run: pytest -q --disable-warnings --maxfail=1

      - name: Commit verified repair and remove temporary runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_policing_context_roadmap.py tests/test_workstream_h_methodology.py
          git rm .github/pr4_fresh_review_repair.py .github/workflows/pr4-fresh-review-repair.yml
          git diff --cached --check
          git diff --cached --quiet && { echo "No repair diff produced"; exit 1; } || true
          git commit -m "Fix fresh PR 4 governance review findings"
          git push
