name: Temporary three governance repair

on:
  push:
    branches:
      - research-corpus-governed-expansion
    paths:
      - .github/three-governance-repair-trigger.txt

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Apply governance receipt repairs
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import runpy

          registry_path = Path('tests/test_research_reference_registry.py')
          text = registry_path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one registry anchor, found {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              'SOURCE_USE_SECTION_HASH = "ffd50e6c62ec28f45dc18e372c0feb4d04f044671e1fc8cfb30293175935f1bb"\n',
              'SOURCE_USE_SECTION_HASH = "ffd50e6c62ec28f45dc18e372c0feb4d04f044671e1fc8cfb30293175935f1bb"\n'
              'SOURCE_USE_RECORDS_SHA256 = "__SOURCE_USE_RECORDS_SHA256__"\n',
          )

          replace_once(
              '''def _normalised_registry_trailing_value(corpus: str) -> str:\n    """Return browser-visible registry content from the post-batch boundary to EOF."""\n''',
              '''def _source_use_rules_record_receipt(corpus: str) -> str:\n    """Seal browser-visible source-use rule records with their container hierarchy."""\n    _, structure = _markdown_views(corpus)\n    start, _ = _visible_markdown_heading_span(structure, SOURCE_USE_HEADING)\n    end, _ = _visible_markdown_heading_span(structure, CONTRACT_HEADING)\n    assert start < end, "rendered source-use/registration-contract boundaries are out of order"\n    records = _SHARED_POLICING["_normalised_visible_workstream_records"](corpus[start:end])\n    return "\\n".join(\n        f"{signature}\\x1f{line}" for signature, line in records\n    )\n\n\ndef _normalised_registry_trailing_value(corpus: str) -> str:\n    """Return browser-visible registry content from the post-batch boundary to EOF."""\n''',
          )

          replace_once(
              '''def _validate_registry_corpus(corpus: str) -> None:\n''',
              '''def _registry_trailing_link_titles(corpus: str) -> tuple[str, ...]:\n    """Return rendered inline-link tooltip titles in the trailing registry region."""\n    rendered, structure = _markdown_views(corpus)\n    start, _ = _visible_markdown_heading_span(structure, BATCH_END)\n    trailing = rendered[start:]\n    title_structure = _mask_raw_html_tags_for_markdown_link_discovery(\n        _mask_hidden_html_regions(_structural_registry_text(trailing))\n    )\n    return tuple(\n        link.title\n        for link in _markdown_inline_links(title_structure)\n        if not link.image and link.title is not None\n    )\n\n\ndef _validate_registry_corpus(corpus: str) -> None:\n''',
          )

          replace_once(
              '''    actual_source_use_hash = hashlib.sha256(visible_source_use.encode("utf-8")).hexdigest()\n    assert actual_source_use_hash == SOURCE_USE_SECTION_HASH, (\n        "browser-visible source-use rules changed or were weakened: "\n        f"expected hash {SOURCE_USE_SECTION_HASH!r}, got {actual_source_use_hash!r}"\n    )\n\n    sections = _registered_sections(corpus)\n''',
              '''    actual_source_use_hash = hashlib.sha256(visible_source_use.encode("utf-8")).hexdigest()\n    assert actual_source_use_hash == SOURCE_USE_SECTION_HASH, (\n        "browser-visible source-use rules changed or were weakened: "\n        f"expected hash {SOURCE_USE_SECTION_HASH!r}, got {actual_source_use_hash!r}"\n    )\n    source_use_records = _source_use_rules_record_receipt(corpus)\n    actual_source_use_records_hash = hashlib.sha256(\n        source_use_records.encode("utf-8")\n    ).hexdigest()\n    assert actual_source_use_records_hash == SOURCE_USE_RECORDS_SHA256, (\n        "source-use rule record hierarchy changed: "\n        f"expected hash {SOURCE_USE_RECORDS_SHA256!r}, "\n        f"got {actual_source_use_records_hash!r}"\n    )\n\n    sections = _registered_sections(corpus)\n''',
          )

          replace_once(
              '''    assert actual_trailing_binding_hash == REGISTRY_TRAILING_LINK_BINDINGS_SHA256, (\n        "trailing registry link bindings changed outside the governed receipts: "\n        f"expected hash {REGISTRY_TRAILING_LINK_BINDINGS_SHA256!r}, "\n        f"got {actual_trailing_binding_hash!r}"\n    )\n\n\ndef test_trailing_registry_visible_corpus_is_pinned():\n''',
              '''    assert actual_trailing_binding_hash == REGISTRY_TRAILING_LINK_BINDINGS_SHA256, (\n        "trailing registry link bindings changed outside the governed receipts: "\n        f"expected hash {REGISTRY_TRAILING_LINK_BINDINGS_SHA256!r}, "\n        f"got {actual_trailing_binding_hash!r}"\n    )\n    trailing_titles = _registry_trailing_link_titles(corpus)\n    assert not trailing_titles, (\n        "trailing registry Markdown link titles are not allowed; "\n        f"tooltip provenance must remain inside the sealed registry contract: {trailing_titles!r}"\n    )\n\n\ndef test_trailing_registry_visible_corpus_is_pinned():\n''',
          )

          replace_once(
              '''def test_post_phase2_registry_batch_preserves_governance_contract():\n    _validate_registry_corpus(CORPUS.read_text(encoding="utf-8"))\n\n\ndef test_source_use_rules_are_complete_and_pinned():\n''',
              '''def test_trailing_registry_link_titles_are_rejected():\n    corpus = CORPUS.read_text(encoding="utf-8")\n    source = "- https://en.wikipedia.org/wiki/The_Chaser"\n    titled = (\n        '- [https://en.wikipedia.org/wiki/The_Chaser]'\n        '(https://en.wikipedia.org/wiki/The_Chaser "All content is CC0")'\n    )\n    mutated = corpus.replace(source, titled, 1)\n    assert mutated != corpus\n    assert _normalised_registry_trailing_value(mutated) == _normalised_registry_trailing_value(corpus)\n    assert _registry_trailing_link_binding_receipt(mutated) == _registry_trailing_link_binding_receipt(corpus)\n    with pytest.raises(AssertionError, match="trailing registry Markdown link titles"):\n        _validate_registry_corpus(mutated)\n\n\ndef test_post_phase2_registry_batch_preserves_governance_contract():\n    _validate_registry_corpus(CORPUS.read_text(encoding="utf-8"))\n\n\ndef test_source_use_rules_are_complete_and_pinned():\n''',
          )

          replace_once(
              '''def test_stylesheet_driven_hiding_is_rejected_fail_closed():\n''',
              '''def test_source_use_rules_preserve_list_hierarchy():\n    corpus = CORPUS.read_text(encoding="utf-8")\n    rule = (\n        "3. Record provenance and licence for every benchmark example independently "\n        "of the reference that motivated it."\n    )\n    assert rule in corpus\n    mutated = corpus.replace(rule, f"  {rule}", 1)\n    assert _normalised_source_use_rules_value(mutated) == _normalised_source_use_rules_value(corpus)\n    with pytest.raises(AssertionError, match="source-use rule record hierarchy changed"):\n        _validate_registry_corpus(mutated)\n\n\ndef test_stylesheet_driven_hiding_is_rejected_fail_closed():\n''',
          )

          registry_path.write_text(text, encoding='utf-8')

          ascft_path = Path('tests/test_ascft_methodology_integrity.py')
          ascft_path.write_text('''"""Section-scoped integrity checks for ASCFT-derived methodology."""\n\nfrom pathlib import Path\nimport hashlib\nimport runpy\n\nimport pytest\n\n\nROOT = Path(__file__).parent.parent\nMETHODOLOGY = ROOT / "docs" / "METHODOLOGY.md"\nPOLICING_TEST = Path(__file__).parent / "test_policing_context_roadmap.py"\nASCFT_HEADING = "## ASCFT-Derived Experiment Design"\nNEXT_HEADING = "## Trans-Tasman and Slang/Operational Experiment Design"\nASCFT_VISIBLE_SHA256 = "__ASCFT_VISIBLE_SHA256__"\nASCFT_RECORDS_SHA256 = "__ASCFT_RECORDS_SHA256__"\nMANDATORY_EPISTEMIC_BOUNDARIES = (\n    "FORMAL ANALOGY != PHYSICAL ONTOLOGY",\n    "MATHEMATICAL MODEL != EMPIRICALLY VALIDATED MECHANISM",\n)\n\n\ndef _namespace() -> dict[str, object]:\n    return runpy.run_path(str(POLICING_TEST))\n\n\ndef _raw_ascft_section(text: str) -> str:\n    namespace = _namespace()\n    namespace["_assert_supported_governed_html"](\n        namespace["_governed_surface_html_violations"](text)\n    )\n    structure = namespace["_rendered_structure"](text)\n    start, _ = namespace["_visible_markdown_heading_span"](structure, ASCFT_HEADING)\n    end, _ = namespace["_visible_markdown_heading_span"](structure, NEXT_HEADING)\n    assert start < end, "rendered ASCFT methodology boundary is invalid"\n    return text[start:end]\n\n\ndef _normalised_ascft_visible_value(text: str) -> str:\n    namespace = _namespace()\n    return " ".join(namespace["_visible_text"](_raw_ascft_section(text)).split())\n\n\ndef _ascft_record_receipt(text: str) -> str:\n    namespace = _namespace()\n    records = namespace["_normalised_visible_workstream_records"](_raw_ascft_section(text))\n    return "\\n".join(\n        f"{signature}\\x1f{line}" for signature, line in records\n    )\n\n\ndef _assert_ascft_integrity(text: str) -> str:\n    value = _normalised_ascft_visible_value(text)\n    actual_visible_hash = hashlib.sha256(value.encode("utf-8")).hexdigest()\n    assert actual_visible_hash == ASCFT_VISIBLE_SHA256, (\n        "browser-visible ASCFT methodology changed or was weakened: "\n        f"expected {ASCFT_VISIBLE_SHA256!r}, got {actual_visible_hash!r}"\n    )\n    records = _ascft_record_receipt(text)\n    actual_records_hash = hashlib.sha256(records.encode("utf-8")).hexdigest()\n    assert actual_records_hash == ASCFT_RECORDS_SHA256, (\n        "ASCFT methodology record hierarchy changed: "\n        f"expected {ASCFT_RECORDS_SHA256!r}, got {actual_records_hash!r}"\n    )\n    for boundary in MANDATORY_EPISTEMIC_BOUNDARIES:\n        assert boundary in value, f"mandatory ASCFT epistemic boundary missing: {boundary}"\n    return value\n\n\ndef test_ascft_methodology_section_is_pinned():\n    _assert_ascft_integrity(METHODOLOGY.read_text(encoding="utf-8"))\n\n\n@pytest.mark.parametrize("boundary", MANDATORY_EPISTEMIC_BOUNDARIES)\ndef test_ascft_mandatory_epistemic_boundaries_cannot_be_removed_or_reversed(boundary: str):\n    methodology = METHODOLOGY.read_text(encoding="utf-8")\n    marker = f"- **{boundary}**"\n    assert marker in methodology\n\n    deleted = methodology.replace(marker, "", 1)\n    with pytest.raises(AssertionError, match="ASCFT methodology changed or was weakened"):\n        _assert_ascft_integrity(deleted)\n\n    reversed_text = methodology.replace(\n        marker,\n        f"- **REVERSED: {boundary}**",\n        1,\n    )\n    with pytest.raises(AssertionError, match="ASCFT methodology changed or was weakened"):\n        _assert_ascft_integrity(reversed_text)\n''', encoding='utf-8')

          # Compute immutable fixtures from the canonical current documents.
          registry_ns = runpy.run_path(str(registry_path))
          corpus = registry_ns['CORPUS'].read_text(encoding='utf-8')
          source_use_records = registry_ns['_source_use_rules_record_receipt'](corpus)
          source_use_hash = hashlib.sha256(source_use_records.encode('utf-8')).hexdigest()
          registry_text = registry_path.read_text(encoding='utf-8').replace(
              '__SOURCE_USE_RECORDS_SHA256__', source_use_hash, 1
          )
          registry_path.write_text(registry_text, encoding='utf-8')

          ascft_ns = runpy.run_path(str(ascft_path))
          methodology = ascft_ns['METHODOLOGY'].read_text(encoding='utf-8')
          ascft_visible = ascft_ns['_normalised_ascft_visible_value'](methodology)
          ascft_records = ascft_ns['_ascft_record_receipt'](methodology)
          ascft_visible_hash = hashlib.sha256(ascft_visible.encode('utf-8')).hexdigest()
          ascft_records_hash = hashlib.sha256(ascft_records.encode('utf-8')).hexdigest()
          ascft_text = ascft_path.read_text(encoding='utf-8')
          ascft_text = ascft_text.replace('__ASCFT_VISIBLE_SHA256__', ascft_visible_hash, 1)
          ascft_text = ascft_text.replace('__ASCFT_RECORDS_SHA256__', ascft_records_hash, 1)
          ascft_path.write_text(ascft_text, encoding='utf-8')
          PY

      - name: Verify exact regressions and focused governance
        run: |
          pytest -q tests/test_research_reference_registry.py tests/test_ascft_methodology_integrity.py

      - name: Verify full suite
        run: pytest -q

      - name: Verify whitespace
        run: git diff --check

      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_research_reference_registry.py tests/test_ascft_methodology_integrity.py
          git commit -m "Harden remaining governance receipts"
          git push origin HEAD:research-corpus-governed-expansion
