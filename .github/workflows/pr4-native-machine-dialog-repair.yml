name: PR4 native metadata/dialog repair

on:
  push:
    branches: ["research-corpus-governed-expansion"]
    paths:
      - ".github/pr4_native_machine_dialog_patch.py"
      - ".github/workflows/pr4-native-machine-dialog-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply focused repair
        run: python .github/pr4_native_machine_dialog_patch.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Exact regressions
        run: pytest -q --disable-warnings --maxfail=1 tests/test_pr4_native_machine_dialog_regressions.py

      - name: Focused governance suite
        run: >-
          pytest -q --disable-warnings --maxfail=1
          tests/test_policing_context_roadmap.py
          tests/test_research_reference_registry.py
          tests/test_workstream_g_integrity.py
          tests/test_workstream_h_methodology.py
          tests/test_ascft_methodology_integrity.py
          tests/test_policing_contract_receipt.py
          tests/test_phase2_review_followup.py
          tests/test_pr4_native_machine_dialog_regressions.py

      - name: Validate datasets
        run: |
          python -m australian_for_ais.cli validate data/starter/examples.jsonl
          python -m australian_for_ais.cli validate-pilot data/pilot/items.jsonl

      - name: Full suite
        run: pytest -q --disable-warnings --maxfail=1

      - name: Whitespace check
        run: git diff --check

      - name: Commit verified repair and remove temporary runner
        run: |
          rm .github/pr4_native_machine_dialog_patch.py
          rm .github/workflows/pr4-native-machine-dialog-repair.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Harden native metadata and dialog governance"
          git push origin HEAD:research-corpus-governed-expansion
