name: Temporary PR4 Review Repair

on:
  push:
    branches: ["research-corpus-governed-expansion"]
    paths:
      - ".github/temporary-pr4-review-trigger.txt"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply guarded repair
        run: python .github/temporary-pr4-review-repair.py

      - name: Whitespace check
        run: git diff --check

      - name: Exact fresh regressions
        run: |
          pytest -q \
            tests/test_research_reference_registry.py::test_governed_registry_batch_prefix_rejects_nontext_rendering_semantics \
            tests/test_phase2_review_followup.py::test_phase2_receipts_reject_unsealed_link_destinations

      - name: Focused governance suite
        run: |
          pytest -q \
            tests/test_research_reference_registry.py \
            tests/test_phase2_review_followup.py \
            tests/test_policing_context_roadmap.py \
            tests/test_policing_contract_receipt.py \
            tests/test_workstream_h_methodology.py \
            tests/test_ascft_methodology_integrity.py

      - name: Validate starter dataset
        run: python -m australian_for_ais.cli validate data/starter/examples.jsonl

      - name: Validate Phase 2 pilot pack
        run: python -m australian_for_ais.cli validate-pilot data/pilot/items.jsonl

      - name: Full suite
        run: pytest -q --disable-warnings --maxfail=1

      - name: Commit permanent repair only
        env:
          BRANCH: research-corpus-governed-expansion
        run: |
          git config user.name "EmergentMonk"
          git config user.email "73952179+EmergentMonk@users.noreply.github.com"
          git add tests/test_research_reference_registry.py tests/test_phase2_review_followup.py
          git diff --cached --check
          git diff --cached --quiet && { echo "No permanent changes staged"; exit 1; }
          git commit -m "Seal registry prefix and Phase 2 links"
          git push origin HEAD:"$BRANCH"
