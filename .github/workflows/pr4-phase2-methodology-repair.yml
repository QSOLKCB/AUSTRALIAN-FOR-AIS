name: PR4 Phase2 Methodology Repair

on:
  push:
    branches: ["research-corpus-governed-expansion"]
    paths:
      - ".github/repair-pr4-phase2-methodology.py"
      - ".github/workflows/pr4-phase2-methodology-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0

      - name: Guard reviewed base and scaffold-only drift
        shell: bash
        run: |
          set -euo pipefail
          expected_base="4533cb2ee328cbc1e8ffc70e693fbd1ee175f600"
          git merge-base --is-ancestor "$expected_base" HEAD
          mapfile -t changed < <(git diff --name-only "$expected_base"..HEAD | sort)
          expected=(
            ".github/repair-pr4-phase2-methodology.py"
            ".github/workflows/pr4-phase2-methodology-repair.yml"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq "${#expected_sorted[@]}"
          for i in "${!expected_sorted[@]}"; do
            test "${changed[$i]}" = "${expected_sorted[$i]}"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply focused repair
        run: python .github/repair-pr4-phase2-methodology.py

      - name: Run exact review regressions
        run: |
          pytest -q \
            tests/test_pr4_current_review_regressions.py \
            tests/test_phase2_review_followup.py

      - name: Run focused governance suite
        run: |
          pytest -q \
            tests/test_policing_context_roadmap.py \
            tests/test_workstream_h_methodology.py \
            tests/test_research_reference_registry.py \
            tests/test_phase2_review_followup.py \
            tests/test_pr4_current_review_regressions.py \
            tests/test_policing_contract_receipt.py

      - name: Validate datasets
        run: |
          python -m australian_for_ais.cli validate data/starter/examples.jsonl
          python -m australian_for_ais.cli validate-pilot data/pilot/items.jsonl

      - name: Run full repository suite
        run: pytest -q --disable-warnings --maxfail=1

      - name: Check whitespace
        run: git diff --check

      - name: Self-clean and commit tested repair
        shell: bash
        run: |
          set -euo pipefail
          branch="research-corpus-governed-expansion"
          remote_sha="$(git ls-remote origin "refs/heads/$branch" | awk '{print $1}')"
          test "$remote_sha" = "$GITHUB_SHA"

          rm .github/repair-pr4-phase2-methodology.py
          rm .github/workflows/pr4-phase2-methodology-repair.yml

          git add \
            tests/test_policing_context_roadmap.py \
            tests/test_phase2_review_followup.py \
            tests/test_pr4_current_review_regressions.py \
            .github/repair-pr4-phase2-methodology.py \
            .github/workflows/pr4-phase2-methodology-repair.yml
          git diff --cached --check
          git diff --cached --quiet && { echo "no repair diff" >&2; exit 1; }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Seal methodology HTML and Phase 2 changelog integrity"
          git push origin HEAD:"$branch"
