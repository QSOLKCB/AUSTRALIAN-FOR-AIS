name: Temporary PR4 active-html/link/batch repair

on:
  push:
    branches:
      - research-corpus-governed-expansion
    paths:
      - .github/temporary-pr4-active-html-link-batch-trigger.txt

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply surgical repair
        run: |
          python .github/temporary-pr4-active-html-link-batch-repair.py
          python .github/temporary-pr4-active-html-link-batch-adjust.py

      - name: Whitespace guard
        run: git diff --check

      - name: Focused governance verification
        run: >-
          pytest -q
          tests/test_phase2_review_followup.py
          tests/test_policing_contract_receipt.py
          tests/test_research_reference_registry.py

      - name: Validate datasets
        run: |
          python -m australian_for_ais.cli validate data/starter/examples.jsonl
          python -m australian_for_ais.cli validate-pilot data/pilot/items.jsonl

      - name: Full suite
        run: pytest -q --disable-warnings --maxfail=1

      - name: Commit verified repair
        run: |
          git config user.name "EmergentMonk"
          git config user.email "73952179+EmergentMonk@users.noreply.github.com"
          git add tests/test_phase2_review_followup.py tests/test_policing_contract_receipt.py tests/test_research_reference_registry.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No permanent changes produced"
            exit 1
          fi
          git commit -m "Seal active HTML and remaining governance gaps"
          git push origin HEAD:research-corpus-governed-expansion
