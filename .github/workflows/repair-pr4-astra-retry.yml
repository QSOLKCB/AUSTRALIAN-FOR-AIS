name: Retry PR4 Astra review repair

on:
  push:
    branches:
      - research-corpus-governed-expansion

permissions:
  contents: write

concurrency:
  group: repair-pr4-astra-retry
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify repair-only branch movement
        shell: bash
        run: |
          set -euo pipefail
          base='74a66de0f43dd280adb4175b9005f46dd45b238d'
          unexpected="$(git diff --name-only "$base" HEAD | grep -v -E '^\.github/(repair-pr4-astra\.py|workflows/repair-pr4-astra-review\.yml|workflows/repair-pr4-astra-retry\.yml)$' || true)"
          test -z "$unexpected" || {
            echo "Refusing repair because substantive files moved since the reviewed head:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          }

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply guarded validator repair
        shell: bash
        run: |
          set -euo pipefail
          python .github/repair-pr4-astra.py
          git diff --check

      - name: Run focused governance regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_policing_context_roadmap.py \
            tests/test_research_reference_registry.py \
            tests/test_policing_contract_receipt.py \
            tests/test_pr4_astra_review_regressions.py

      - name: Run full suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q

      - name: Commit verified repair and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          rm \
            .github/workflows/repair-pr4-astra-review.yml \
            .github/workflows/repair-pr4-astra-retry.yml \
            .github/repair-pr4-astra.py
          git add \
            tests/test_policing_context_roadmap.py \
            tests/test_research_reference_registry.py \
            tests/test_pr4_astra_review_regressions.py \
            .github/workflows/repair-pr4-astra-review.yml \
            .github/workflows/repair-pr4-astra-retry.yml \
            .github/repair-pr4-astra.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Harden PR4 rendered governance receipts"
          git push origin HEAD:research-corpus-governed-expansion
