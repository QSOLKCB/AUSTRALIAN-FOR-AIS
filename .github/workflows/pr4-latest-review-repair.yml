name: PR4 latest review repair

on:
  push:
    branches:
      - research-corpus-governed-expansion
    paths:
      - .github/workflows/pr4-latest-review-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply exact guarded repair
        run: python .github/scripts/pr4-latest-review-repair-v2.py

      - name: Verify exact substantive file set
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            tests/test_policing_context_roadmap.py \
            tests/test_policing_contract_receipt.py \
            tests/test_research_reference_registry.py \
            tests/test_workstream_h_methodology.py | sort)"
          printf 'Changed files before tests:\n%s\n' "$actual"
          test "$actual" = "$expected"
          git diff --check

      - name: Run focused governance tests
        run: |
          pytest -q --disable-warnings --maxfail=1 \
            tests/test_research_reference_registry.py \
            tests/test_policing_context_roadmap.py \
            tests/test_workstream_h_methodology.py \
            tests/test_policing_contract_receipt.py \
            tests/test_phase2_review_followup.py

      - name: Validate starter dataset
        run: python -m australian_for_ais.cli validate data/starter/examples.jsonl

      - name: Validate Phase 2 pilot pack
        run: python -m australian_for_ais.cli validate-pilot data/pilot/items.jsonl

      - name: Run full suite
        run: pytest -q --disable-warnings --maxfail=1

      - name: Self-clean temporary repair machinery
        shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/pr4-latest-review-repair.py
          rm .github/scripts/pr4-latest-review-repair-v2.py
          rm .github/workflows/pr4-latest-review-repair.yml
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/scripts/pr4-latest-review-repair-v2.py \
            .github/scripts/pr4-latest-review-repair.py \
            .github/workflows/pr4-latest-review-repair.yml \
            tests/test_policing_context_roadmap.py \
            tests/test_policing_contract_receipt.py \
            tests/test_research_reference_registry.py \
            tests/test_workstream_h_methodology.py | sort)"
          printf 'Changed files after self-clean:\n%s\n' "$actual"
          test "$actual" = "$expected"

      - name: Commit and push substantive repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Close latest PR4 review gaps'
          git push origin HEAD:research-corpus-governed-expansion
