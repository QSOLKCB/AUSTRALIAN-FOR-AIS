name: PR 4 latest review repair

on:
  push:
    branches:
      - research-corpus-governed-expansion
    paths:
      - .github/pr4_review_repair_latest.py
      - .github/workflows/pr4-latest-review-repair.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Apply guarded review fixes
        run: python .github/pr4_review_repair_latest.py

      - name: Normalize generated EOF whitespace
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in (
              'tests/test_research_reference_registry.py',
              'tests/test_policing_context_roadmap.py',
          ):
              path = Path(name)
              path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY

      - name: Check patch whitespace
        run: git diff --check

      - name: Run focused governance regressions
        run: >-
          pytest -q
          tests/test_research_reference_registry.py
          tests/test_policing_context_roadmap.py
          tests/test_workstream_h_methodology.py
          tests/test_policing_contract_receipt.py
          --disable-warnings --maxfail=1

      - name: Run full test suite
        run: pytest -q --disable-warnings --maxfail=1

      - name: Re-check patch whitespace
        run: git diff --check

      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo 'No repair changes to commit.'
            exit 1
          fi
          git config user.name 'EmergentMonk'
          git config user.email '73952179+EmergentMonk@users.noreply.github.com'
          git add tests/test_research_reference_registry.py tests/test_policing_context_roadmap.py
          git commit -m 'Fix latest PR 4 rendering review findings'
          git push origin HEAD:research-corpus-governed-expansion
