name: PR4 latest Codex repair

on:
  push:
    branches:
      - research-corpus-governed-expansion

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply review repair
        run: python scripts/pr4_latest_review_repair.py

      - name: Preserve thematic-break diagnostic precedence
        run: |
          python - <<'PY'
          from pathlib import Path
          registry = Path("tests/test_research_reference_registry.py")
          text = registry.read_text(encoding="utf-8")
          needle = '    assert "rendered-break" not in found, (\n'
          replacement = (
              '    if "thematic-break" in found:\n'
              '        raise AssertionError(\n'
              '            "raw HTML thematic break is not allowed in governed documents"\n'
              '        )\n'
              '    assert "rendered-break" not in found, (\n'
          )
          if text.count(needle) != 1:
              raise SystemExit(f"expected one rendered-break assertion, found {text.count(needle)}")
          registry.write_text(text.replace(needle, replacement, 1), encoding="utf-8")

          regression = Path("tests/test_pr4_latest_review_regressions.py")
          tests = regression.read_text(encoding="utf-8")
          old = 'with pytest.raises(AssertionError, match="rendered break"):'
          new = 'with pytest.raises(AssertionError, match="raw HTML thematic break"):'
          if tests.count(old) != 1:
              raise SystemExit(f"expected one regression diagnostic matcher, found {tests.count(old)}")
          regression.write_text(tests.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Run exact review regressions
        run: pytest -q tests/test_pr4_latest_review_regressions.py

      - name: Run focused governance suite
        run: >-
          pytest -q
          tests/test_research_reference_registry.py
          tests/test_workstream_g_integrity.py
          tests/test_workstream_h_methodology.py
          tests/test_policing_context_roadmap.py
          tests/test_policing_contract_receipt.py
          tests/test_ascft_methodology_integrity.py
          tests/test_phase2_review_followup.py
          tests/test_pr4_latest_review_regressions.py

      - name: Validate datasets
        run: |
          python -m australian_for_ais.cli validate data/starter/examples.jsonl
          python -m australian_for_ais.cli validate-pilot data/pilot/items.jsonl

      - name: Run full suite
        run: pytest -q --disable-warnings --maxfail=1

      - name: Check whitespace
        run: git diff --check

      - name: Commit verified repair and remove temporary runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f scripts/pr4_latest_review_repair.py .github/workflows/pr4-latest-review-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden registry contracts and Workstream G links"
          git push origin HEAD:research-corpus-governed-expansion
