name: PR4 latest review repair

on:
  push:
    branches:
      - research-corpus-governed-expansion
    paths:
      - .github/workflows/pr4-latest-review-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Require reviewed code tree
        run: |
          git diff --exit-code 9227c43b6d9952e2a0a66f45578c8fafbd80f392 -- . ':(exclude).github/workflows/pr4-latest-review-repair.yml'

      - name: Apply merge-blocker repair
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_policing_context_roadmap.py")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  "        self._anchor_open = False\n        self._nobr_open = False\n        self._source = source\n",
                  "        self._anchor_open = False\n        self._nobr_open = False\n        self._dialog_open_stack: list[bool] = []\n        self._source = source\n",
              ),
              (
                  "        attribute_names = {key.lower() for key, _ in attrs}\n        # HTMLParser has already tokenized the complete start tag, including\n",
                  "        attribute_names = {key.lower() for key, _ in attrs}\n        if tag == \"dialog\":\n            self._dialog_open_stack.append(\"open\" in attribute_names)\n        # HTMLParser has already tokenized the complete start tag, including\n",
              ),
              (
                  "        if {\"aria-label\", \"aria-labelledby\", \"aria-description\", \"aria-describedby\", \"aria-details\"}.intersection(attribute_names):\n            self.violations.add(\"accessible-name\")\n        if \"aria-hidden\" in attribute_names:\n",
                  "        if {\"aria-label\", \"aria-labelledby\", \"aria-description\", \"aria-describedby\", \"aria-details\"}.intersection(attribute_names):\n            self.violations.add(\"accessible-name\")\n        if \"aria-owns\" in attribute_names:\n            self.violations.add(\"accessibility-ownership\")\n        if \"aria-hidden\" in attribute_names:\n",
              ),
              (
                  "    def handle_endtag(self, tag: str) -> None:\n        tag = tag.lower()\n        if tag == \"a\":\n            self._anchor_open = False\n        if tag == \"nobr\":\n            self._nobr_open = False\n",
                  "    def handle_endtag(self, tag: str) -> None:\n        tag = tag.lower()\n        if tag == \"dialog\":\n            dialog_was_open = self._dialog_open_stack.pop() if self._dialog_open_stack else False\n            if dialog_was_open and self._source:\n                start = self._source_offset()\n                close = self._source.find(\">\", start)\n                if close >= 0:\n                    end = close + 1\n                    line_start = self._source.rfind(\"\\n\", 0, start) + 1\n                    line_end = self._source.find(\"\\n\", end)\n                    if line_end < 0:\n                        line_end = len(self._source)\n                    prefix = self._source[line_start:start]\n                    suffix = self._source[end:line_end]\n                    if prefix.strip() or suffix.strip():\n                        self.violations.add(\"dialog-inline-block\")\n        if tag == \"a\":\n            self._anchor_open = False\n        if tag == \"nobr\":\n            self._nobr_open = False\n",
              ),
              (
                  "def _assert_supported_governed_html(violations: set[str]) -> None:\n    \"\"\"Fail closed on rendering semantics outside the shared text contract.\"\"\"\n    descriptions = {\n        \"replacement-content\": \"replacement-content HTML\",\n        \"rendered-break\": \"rendered break HTML\",\n",
                  "def _assert_supported_governed_html(violations: set[str]) -> None:\n    \"\"\"Fail closed on rendering semantics outside the shared text contract.\"\"\"\n    if \"closed-details\" in violations:\n        violations = violations - {\"raw-block\"}\n    descriptions = {\n        \"replacement-content\": \"replacement-content HTML\",\n        \"raw-block\": \"raw block-container HTML carrying governed prose\",\n        \"raw-list\": \"raw list HTML\",\n        \"rendered-break\": \"rendered break HTML\",\n",
              ),
              (
                  "        \"accessibility-disabled\": \"aria-disabled source-link suppression HTML\",\n        \"nested-anchor\": \"nested anchor HTML\",\n",
                  "        \"accessibility-disabled\": \"aria-disabled source-link suppression HTML\",\n        \"accessibility-ownership\": \"aria-owns accessibility-tree ownership override HTML\",\n        \"nested-anchor\": \"nested anchor HTML\",\n",
              ),
          ]
          for old, new in replacements:
              assert text.count(old) == 1, old[:100]
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          registry_path = Path("tests/test_research_reference_registry.py")
          registry = registry_path.read_text(encoding="utf-8")
          old = '    "accessibility-disabled",\n    "keyboard-navigation",\n'
          new = '    "accessibility-disabled",\n    "accessibility-ownership",\n    "keyboard-navigation",\n'
          assert registry.count(old) == 1
          registry = registry.replace(old, new, 1)
          old = '    assert "accessibility-disabled" not in found, (\n        "aria-disabled source-link suppression is not allowed in governed documents"\n    )\n    assert "keyboard-navigation" not in found, (\n'
          new = '    assert "accessibility-disabled" not in found, (\n        "aria-disabled source-link suppression is not allowed in governed documents"\n    )\n    assert "accessibility-ownership" not in found, (\n        "aria-owns accessibility-tree ownership overrides are not allowed in governed documents"\n    )\n    assert "keyboard-navigation" not in found, (\n'
          assert registry.count(old) == 1
          registry_path.write_text(registry.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Add exact regressions
        run: |
          cat > tests/test_pr4_latest_merge_blockers.py <<'PYTEST'
          """End-to-end regressions for the latest PR #4 merge blockers."""

          from pathlib import Path
          import runpy
          import pytest

          ROOT = Path(__file__).parent.parent
          POLICING = runpy.run_path(str(ROOT / "tests" / "test_policing_context_roadmap.py"))
          REGISTRY = runpy.run_path(str(ROOT / "tests" / "test_research_reference_registry.py"))
          CORPUS = ROOT / "docs" / "RESEARCH-REFERENCE-CORPUS.md"
          ROADMAP = ROOT / "ROADMAP.md"


          def test_raw_block_violation_is_consumed_end_to_end() -> None:
              mutated = ROADMAP.read_text(encoding="utf-8").replace(
                  "source-gated research proposal", "source-gated <div>research</div> proposal", 1
              )
              assert "raw-block" in POLICING["_governed_surface_html_violations"](
                  "source-gated <div>research</div> proposal"
              )
              with pytest.raises(AssertionError):
                  POLICING["_validate_policing_workstream"](mutated)


          def test_raw_list_violation_is_consumed_end_to_end() -> None:
              mutated = ROADMAP.read_text(encoding="utf-8").replace(
                  "source-gated research proposal", "source-gated <ul><li>research</li></ul> proposal", 1
              )
              assert "raw-list" in POLICING["_governed_surface_html_violations"](
                  "source-gated <ul><li>research</li></ul> proposal"
              )
              with pytest.raises(AssertionError):
                  POLICING["_validate_policing_workstream"](mutated)


          def test_open_dialog_closing_boundary_cannot_share_governed_prose() -> None:
              original = "Availability through ABC iview is not permission to redistribute content."
              fragment = (
                  "Availability through ABC iview is\n"
                  "<dialog open>\n"
                  "not</dialog> permission to redistribute content."
              )
              assert "dialog-inline-block" in POLICING["_governed_surface_html_violations"](fragment)
              mutated = CORPUS.read_text(encoding="utf-8").replace(original, fragment, 1)
              with pytest.raises(AssertionError):
                  REGISTRY["_validate_registry_corpus"](mutated)


          def test_clean_multiline_open_dialog_wrapper_still_supported() -> None:
              fragment = "<dialog open>\nCanonical governed prose.\n</dialog>\n"
              assert "dialog-inline-block" not in POLICING["_governed_surface_html_violations"](fragment)


          def test_aria_owns_reorders_no_governed_accessibility_tree() -> None:
              original = "Availability through ABC iview is not permission to redistribute content."
              fragment = (
                  'Availability through ABC iview is <span id="negation">not</span> '
                  'permission to redistribute content.<span aria-owns="negation"></span>'
              )
              assert "accessibility-ownership" in POLICING["_governed_surface_html_violations"](fragment)
              mutated = CORPUS.read_text(encoding="utf-8").replace(original, fragment, 1)
              with pytest.raises(AssertionError):
                  REGISTRY["_validate_registry_corpus"](mutated)
          PYTEST

      - name: Exact regressions
        run: pytest -q tests/test_pr4_latest_merge_blockers.py

      - name: Focused governance
        run: pytest -q tests/test_policing_context_roadmap.py tests/test_research_reference_registry.py tests/test_pr4_native_machine_dialog_regressions.py tests/test_pr4_latest_merge_blockers.py

      - name: Validate datasets
        run: |
          python -m australian_for_ais.cli validate data/starter/examples.jsonl
          python -m australian_for_ais.cli validate-pilot data/pilot/items.jsonl

      - name: Full suite
        run: pytest -q

      - name: Whitespace check
        run: git diff --check

      - name: Commit verified repair and self-delete
        run: |
          rm .github/workflows/pr4-latest-review-repair.yml
          git config user.name "EmergentMonk"
          git config user.email "73952179+EmergentMonk@users.noreply.github.com"
          git add tests/test_policing_context_roadmap.py tests/test_research_reference_registry.py tests/test_pr4_latest_merge_blockers.py .github/workflows/pr4-latest-review-repair.yml
          git commit -m "Harden governed HTML enforcement boundaries"
          git push origin HEAD:research-corpus-governed-expansion
