name: PR 4 latest review repair

on:
  push:
    branches:
      - research-corpus-governed-expansion
    paths:
      - .github/pr4_latest_review_repair_v2.py
      - .github/workflows/pr4-latest-review-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply guarded review repairs
        run: python .github/pr4_latest_review_repair_v2.py

      - name: Run focused governance tests
        run: |
          pytest -q \
            tests/test_research_reference_registry.py \
            tests/test_policing_context_roadmap.py \
            tests/test_workstream_h_methodology.py \
            tests/test_policing_contract_receipt.py \
            tests/test_phase2_review_followup.py

      - name: Run full test suite
        run: pytest -q --disable-warnings --maxfail=1

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit repaired files
        run: |
          git config user.name "EmergentMonk"
          git config user.email "73952179+EmergentMonk@users.noreply.github.com"
          git add tests/test_research_reference_registry.py tests/test_policing_context_roadmap.py
          git diff --cached --quiet && { echo "repair produced no changes"; exit 1; }
          git commit -m "Harden latest rendered governance semantics"
          git push origin HEAD:research-corpus-governed-expansion
