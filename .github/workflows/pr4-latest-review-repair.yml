name: PR4 latest review repair

on:
  push:
    branches:
      - research-corpus-governed-expansion

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Guard reviewed head and scaffolding scope
        shell: bash
        run: |
          set -euo pipefail
          reviewed=e165450209d3fd0e6013006a321bc50931ea02fd
          git merge-base --is-ancestor "$reviewed" HEAD
          unexpected="$(git diff --name-only "$reviewed"...HEAD | grep -v '^\.github/workflows/pr4-latest-review-repair\.yml$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected branch changes since reviewed head:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Apply review fixes and regressions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {path}: found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          policing = Path("tests/test_policing_context_roadmap.py")
          replace_once(
              policing,
              '''        # Hyperlink auditing can send an additional network request that is not\n        # represented by the sealed href binding. Fail closed on it.\n        if tag == "a" and "ping" in attribute_names:\n            self.violations.add("executable-url")\n''',
              '''        # `hidden=until-found` is conditionally revealed by find-in-page or\n        # fragment navigation. Treat it as active conditional content rather\n        # than omitting text that can later become reader-visible. Reuse the\n        # existing corpus-wide conditional-content policy kind so the registry\n        # and shared methodology validators fail closed together.\n        if any(\n            key.lower() == "hidden"\n            and (value or "").strip().casefold() == "until-found"\n            for key, value in attrs\n        ):\n            self.violations.add("conditional-raw-text")\n        # Hyperlink auditing can send an additional network request that is not\n        # represented by the sealed href binding. Fail closed on it.\n        if tag == "a" and "ping" in attribute_names:\n            self.violations.add("executable-url")\n''',
          )
          replace_once(
              policing,
              '''        # Raw Markdown is embedded into an existing HTML document. A live\n        # duplicate root tag can merge attributes onto that document root, so\n        # reject html/body rather than approximating tree-builder semantics.\n        if tag in {"html", "body"}:\n            self.violations.add("document-root")\n''',
              '''        # Raw Markdown is embedded into an existing HTML document. Live\n        # html/body tags can merge attributes onto the document root, while\n        # <base> mutates document-wide URL/target behavior for otherwise sealed\n        # links. Reject all three under the active document-global HTML policy\n        # rather than approximating tree-builder/navigation semantics.\n        if tag in {"html", "body", "base"}:\n            self.violations.add("document-root")\n''',
          )

          regressions = Path("tests/test_pr4_current_review_regressions.py")
          text = regressions.read_text(encoding="utf-8")
          marker = "\n\n# Human receipt: autolink/implied-end/type-6 repair passed 12 exact and 912 full-suite tests before self-cleanup.\n"
          if text.count(marker) != 1:
              raise SystemExit("current-review human-receipt marker missing or duplicated")
          additions = r'''


def test_hidden_until_found_is_rejected_across_governed_paths() -> None:
    roadmap = (ROOT / "ROADMAP.md").read_text(encoding="utf-8")
    payload = '<span hidden="until-found">Current sources may be skipped.</span>'
    mutated_roadmap = roadmap.replace(
        POLICING["WORKSTREAM_END"],
        "\n" + payload + "\n" + POLICING["WORKSTREAM_END"],
        1,
    )
    with pytest.raises(AssertionError, match="conditional/legacy raw-text"):
        POLICING["_validate_policing_workstream"](mutated_roadmap)

    corpus = (ROOT / "docs" / "RESEARCH-REFERENCE-CORPUS.md").read_text(encoding="utf-8")
    injected = REGISTRY["STATUS_HEADING"] + "\n" + payload
    mutated_corpus = corpus.replace(REGISTRY["STATUS_HEADING"], injected, 1)
    with pytest.raises(AssertionError, match="conditional/legacy raw-text"):
        REGISTRY["_validate_registry_corpus"](mutated_corpus)


def test_base_element_is_rejected_across_governed_paths() -> None:
    roadmap = (ROOT / "ROADMAP.md").read_text(encoding="utf-8")
    payload = '<base target="_top">'
    mutated_roadmap = roadmap.replace(
        POLICING["WORKSTREAM_END"],
        "\n" + payload + "\n" + POLICING["WORKSTREAM_END"],
        1,
    )
    with pytest.raises(AssertionError, match="document-root HTML"):
        POLICING["_validate_policing_workstream"](mutated_roadmap)

    corpus = (ROOT / "docs" / "RESEARCH-REFERENCE-CORPUS.md").read_text(encoding="utf-8")
    injected = REGISTRY["STATUS_HEADING"] + "\n" + payload
    mutated_corpus = corpus.replace(REGISTRY["STATUS_HEADING"], injected, 1)
    with pytest.raises(AssertionError, match="document-root HTML"):
        REGISTRY["_validate_registry_corpus"](mutated_corpus)
'''
          regressions.write_text(text.replace(marker, additions + marker, 1), encoding="utf-8")
          PY
          git diff --check

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify exact regressions
        run: pytest -q tests/test_pr4_current_review_regressions.py

      - name: Validate datasets
        run: |
          python -m australian_for_ais.cli validate data/starter/examples.jsonl
          python -m australian_for_ais.cli validate-pilot data/pilot/items.jsonl

      - name: Verify full suite
        run: pytest -q --disable-warnings --maxfail=1

      - name: Commit verified repair and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr4-latest-review-repair.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix conditional hidden and base governance bypasses'
          git push origin HEAD:research-corpus-governed-expansion
