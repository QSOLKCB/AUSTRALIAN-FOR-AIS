name: PR 4 latest review repair

on:
  push:
    branches:
      - research-corpus-governed-expansion
    paths:
      - .github/workflows/pr4-latest-review-repair.yml
      - .github/pr4_review_repair.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply guarded review fixes
        run: python .github/pr4_review_repair.py

      - name: Run focused registry regressions
        run: pytest -q tests/test_research_reference_registry.py --disable-warnings --maxfail=1

      - name: Run full test suite
        run: pytest -q --disable-warnings --maxfail=1

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_research_reference_registry.py
          git diff --cached --check
          git commit -m "Fix latest PR 4 governance review findings"
          git push origin HEAD:research-corpus-governed-expansion
