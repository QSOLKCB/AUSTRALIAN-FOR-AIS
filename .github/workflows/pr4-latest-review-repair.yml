name: PR 4 latest review repair

on:
  push:
    branches:
      - research-corpus-governed-expansion
    paths:
      - .github/workflows/pr4-latest-review-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply guarded review fixes
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import importlib.util
          from pathlib import Path
          import sys

          path = Path("tests/test_research_reference_registry.py")
          original = path.read_text(encoding="utf-8")

          # Compute the immutable Status-section seal from the current canonical
          # browser-visible document before changing the validator itself.
          spec = importlib.util.spec_from_file_location("_pr4_registry_before_repair", path)
          assert spec is not None and spec.loader is not None
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          corpus = module.CORPUS.read_text(encoding="utf-8")
          rendered, structure = module._markdown_views(corpus)
          status_start, _ = module._visible_markdown_heading_span(structure, module.STATUS_HEADING)
          status_end, _ = module._visible_markdown_heading_span(structure, module.SOURCE_USE_HEADING)
          assert status_start < status_end
          visible_status = module._visible_inline_text(rendered[status_start:status_end])
          status_hash = hashlib.sha256(visible_status.encode("utf-8")).hexdigest()

          text = original

          def replace_once(old: str, new: str, *, label: str) -> None:
              global text
              count = text.count(old)
              assert count == 1, f"{label}: expected one match, found {count}"
              text = text.replace(old, new, 1)

          replace_once(
              'SOURCE_USE_SECTION_HASH = "ffd50e6c62ec28f45dc18e372c0feb4d04f044671e1fc8cfb30293175935f1bb"\n',
              'SOURCE_USE_SECTION_HASH = "ffd50e6c62ec28f45dc18e372c0feb4d04f044671e1fc8cfb30293175935f1bb"\n'
              f'STATUS_SECTION_HASH = "{status_hash}"\n',
              label="Status hash fixture",
          )

          replace_once(
              'SVG_NON_RENDERING_METADATA_TAGS = frozenset({"title", "desc"})',
              'SVG_NON_RENDERING_METADATA_TAGS = frozenset({"title", "desc", "defs", "symbol", "metadata"})',
              label="SVG non-rendering containers",
          )

          attribute_helper = '''def _first_html_attribute_values(\n    attrs: list[tuple[str, str | None]],\n) -> dict[str, str]:\n    """Match browser parsing by preserving the first duplicate attribute value."""\n    values: dict[str, str] = {}\n    for key, value in attrs:\n        values.setdefault(key.lower(), value or "")\n    return values\n\n\n'''
          css_marker = 'def _css_hides_element(style: str) -> bool:\n'
          assert attribute_helper not in text
          assert text.count(css_marker) == 1
          text = text.replace(css_marker, attribute_helper + css_marker, 1)

          duplicate_attr_expr = 'values = {key.lower(): (value or "") for key, value in attrs}'
          duplicate_attr_count = text.count(duplicate_attr_expr)
          assert duplicate_attr_count == 2, (
              f"duplicate attribute reducer: expected two matches, found {duplicate_attr_count}"
          )
          text = text.replace(
              duplicate_attr_expr,
              'values = _first_html_attribute_values(attrs)',
          )

          replace_once(
              'def _normalise_https_destination(candidate: str) -> str | None:\n',
              'def _normalise_https_destination(\n'
              '    candidate: str,\n'
              '    *,\n'
              '    strip_trailing_prose_punctuation: bool = False,\n'
              ') -> str | None:\n',
              label="HTTPS normalizer signature",
          )
          replace_once(
              '    value = value.strip().strip("<>").rstrip(".,;:!?")\n',
              '    value = value.strip().strip("<>")\n'
              '    if strip_trailing_prose_punctuation:\n'
              '        value = value.rstrip(".,;:!?")\n',
              label="HTTPS punctuation policy",
          )

          bare_loop = '''    for match in BARE_HTTPS_LINE_PATTERN.finditer(without_links):\n        destinations.append(\n            _require_rendered_https_destination(match.group("url"))\n        )\n'''
          bare_loop_replacement = '''    for match in BARE_HTTPS_LINE_PATTERN.finditer(without_links):\n        destinations.append(\n            _normalise_https_destination(\n                match.group("url"),\n                strip_trailing_prose_punctuation=True,\n            )\n        )\n    assert all(destination is not None for destination in destinations), (\n        "registered-source rendered link has no usable HTTPS destination"\n    )\n'''
          replace_once(
              bare_loop,
              bare_loop_replacement,
              label="bare URL punctuation policy",
          )
          # Narrow Optional[str] values after the fail-closed assertion above.
          replace_once(
              '    return tuple(destinations)\n\n\ndef _visible_markdown_heading_span',
              '    return tuple(destination for destination in destinations if destination is not None)\n\n\ndef _visible_markdown_heading_span',
              label="destination narrowing",
          )

          status_helper = '''def _normalised_status_value(corpus: str) -> str:\n    """Return the complete browser-visible Status section."""\n    rendered, structure = _markdown_views(corpus)\n    start, _ = _visible_markdown_heading_span(structure, STATUS_HEADING)\n    end, _ = _visible_markdown_heading_span(structure, SOURCE_USE_HEADING)\n    assert start < end, "rendered Status/source-use boundaries are out of order"\n    return _visible_inline_text(rendered[start:end])\n\n\n'''
          source_use_marker = 'def _normalised_source_use_rules_value(corpus: str) -> str:\n'
          assert status_helper not in text
          assert text.count(source_use_marker) == 1
          text = text.replace(source_use_marker, status_helper + source_use_marker, 1)

          old_status_validation = '''    status_start, _ = _visible_markdown_heading_span(structure, STATUS_HEADING)\n    status_end, _ = _visible_markdown_heading_span(structure, SOURCE_USE_HEADING)\n    assert status_start < status_end, "rendered Status/source-use boundaries are out of order"\n    visible_status = _visible_inline_text(rendered[status_start:status_end])\n    assert REDISTRIBUTION_INVARIANT in visible_status, (\n        "redistribution invariant must remain browser-visible inside the Status section"\n    )\n\n'''
          new_status_validation = '''    visible_status = _normalised_status_value(corpus)\n    assert REDISTRIBUTION_INVARIANT in visible_status, (\n        "redistribution invariant must remain browser-visible inside the Status section"\n    )\n    actual_status_hash = hashlib.sha256(visible_status.encode("utf-8")).hexdigest()\n    assert actual_status_hash == STATUS_SECTION_HASH, (\n        "browser-visible Status section changed or was weakened: "\n        f"expected hash {STATUS_SECTION_HASH!r}, got {actual_status_hash!r}"\n    )\n\n'''
          replace_once(
              old_status_validation,
              new_status_validation,
              label="Status section validation",
          )

          regression_marker = "test_latest_review_status_and_browser_semantics_regressions"
          assert regression_marker not in text
          regressions = r'''


def test_latest_review_status_and_browser_semantics_regressions():
    corpus = CORPUS.read_text(encoding="utf-8")
    original_status = (
        "Australian comedy is used here as a rich source of adversarial pragmatic "
        "structures. It is not treated as a census of how Australians speak."
    )
    assert original_status in corpus
    mutated = corpus.replace(
        original_status,
        "Australian comedy is representative evidence of how all Australians speak.",
        1,
    )
    with pytest.raises(AssertionError, match="Status section changed or was weakened"):
        _validate_registry_corpus(mutated)

    # HTML tree builders preserve the first duplicate attribute. A later style
    # attribute must not resurrect text hidden by the first one.
    assert _visible_html_text(
        '<span style="display:none" style="display:inline">hidden governance</span>'
    ) == ""

    for container in ("defs", "symbol", "metadata"):
        assert _visible_html_text(
            f"<svg><{container}><text>hidden governance</text></{container}></svg>"
        ) == ""


def test_explicit_link_destinations_preserve_punctuation_but_bare_prose_trims_it():
    expected = "https://www.wikipedia.org/wiki/Australia;"
    assert _usable_https_destinations(
        f'<a href="{expected}">source</a>'
    ) == (expected,)
    assert _usable_https_destinations(f"[source]({expected})") == (expected,)
    assert _usable_https_destinations(f"<{expected}>") == (expected,)
    assert _usable_https_destinations(expected) == (expected.rstrip(";"),)
'''
          text += regressions

          assert text != original
          path.write_text(text, encoding="utf-8")
          print(f"Pinned browser-visible Status SHA-256: {status_hash}")
          PY

      - name: Run focused registry regressions
        run: pytest -q tests/test_research_reference_registry.py --disable-warnings --maxfail=1

      - name: Run full test suite
        run: pytest -q --disable-warnings --maxfail=1

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_research_reference_registry.py
          git diff --cached --check
          git commit -m "Fix latest PR 4 governance review findings"
          git push origin HEAD:research-corpus-governed-expansion
