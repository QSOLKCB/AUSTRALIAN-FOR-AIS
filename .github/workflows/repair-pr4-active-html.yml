name: Repair PR4 active HTML findings

on:
  push:
    branches:
      - research-corpus-governed-expansion

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply active HTML repair
        run: python scripts/repair_pr4_active_html.py

      - name: Check patch whitespace
        run: git diff --check

      - name: Run focused governance tests
        run: |
          pytest -q --disable-warnings --maxfail=1 \
            tests/test_policing_context_roadmap.py \
            tests/test_research_reference_registry.py \
            tests/test_workstream_h_methodology.py \
            tests/test_policing_contract_receipt.py

      - name: Validate datasets
        run: |
          python -m australian_for_ais.cli validate data/starter/examples.jsonl
          python -m australian_for_ais.cli validate-pilot data/pilot/items.jsonl

      - name: Run full suite
        run: pytest -q --disable-warnings --maxfail=1

      - name: Commit verified repair and self-cleanup
        run: |
          rm scripts/repair_pr4_active_html.py
          rm .github/workflows/repair-pr4-active-html.yml
          git add -A
          git diff --cached --check
          git config user.name "EmergentMonk"
          git config user.email "73952179+EmergentMonk@users.noreply.github.com"
          git commit -m "Reject active handlers and document-root HTML"
          git push origin HEAD:research-corpus-governed-expansion
