name: PR4 attribute policy repair

on:
  push:
    branches:
      - research-corpus-governed-expansion

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10
          ref: research-corpus-governed-expansion
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Verify guarded parent
        shell: bash
        run: |
          set -euo pipefail
          base='92bb905fe6ee1eeadf05e118ec3dfa03945bfca7'
          git merge-base --is-ancestor "$base" HEAD
          unexpected="$(git diff --name-only "$base"..HEAD | grep -Ev '^(.github/workflows/pr4-attribute-policy-repair.yml|scripts/pr4_attribute_policy_repair.py)$' || true)"
          test -z "$unexpected"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Apply repair
        run: python scripts/pr4_attribute_policy_repair.py
      - name: Compile and whitespace check
        run: |
          python -m py_compile tests/test_policing_context_roadmap.py tests/test_pr4_clean_head_audit_regressions.py
          git diff --check
      - name: Focused governance tests
        run: pytest -q tests/test_pr4_clean_head_audit_regressions.py tests/test_policing_context_roadmap.py tests/test_research_reference_registry.py
      - name: Full suite
        run: pytest -q --disable-warnings --maxfail=1
      - name: Commit verified repair and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr4-attribute-policy-repair.yml scripts/pr4_attribute_policy_repair.py
          git add tests/test_policing_context_roadmap.py tests/test_pr4_clean_head_audit_regressions.py
          git diff --cached --check
          git commit -m 'Harden governed HTML attribute policy'
          git push origin HEAD:research-corpus-governed-expansion
