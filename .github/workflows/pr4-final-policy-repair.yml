name: PR4 governed semantics repair

on:
  push:
    branches: ["research-corpus-governed-expansion"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply fail-closed governed semantics repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path} for {old!r}, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          policing = Path("tests/test_policing_context_roadmap.py")
          replace_once(
              policing,
              '        attribute_names = {key.lower() for key, _ in attrs}\n',
              '        attribute_names = {key.lower() for key, _ in attrs}\n'
              '        # contenteditable changes committed governance prose into an\n'
              '        # ordinary browser editing surface without changing its receipt.\n'
              '        if "contenteditable" in attribute_names:\n'
              '            self.violations.add("editable-content")\n',
          )
          replace_once(
              policing,
              '        # A role override can make an otherwise canonical provenance anchor\n'
              '        # cease to be exposed as a link to assistive technology. Keep the\n'
              '        # anchor\'s native semantic role inside the governed link contract.\n'
              '        if tag == "a" and "role" in attribute_names:\n'
              '            self.violations.add("semantic-role")\n',
              '        # Any role override can change the accessibility-tree semantics of\n'
              '        # governed prose or links without changing the sealed characters.\n'
              '        # Keep the more-specific semantic-heading diagnostic when applicable.\n'
              '        if "role" in attribute_names and "semantic-heading" not in self.violations:\n'
              '            self.violations.add("semantic-role")\n',
          )
          replace_once(
              policing,
              '        if tag == "details":\n'
              '            if "name" in attribute_names:\n'
              '                self.violations.add("named-details")\n'
              '            if "open" not in attribute_names:\n'
              '                self.violations.add("closed-details")\n',
              '        if tag == "details":\n'
              '            if "name" in attribute_names:\n'
              '                self.violations.add("named-details")\n'
              '            if "open" not in attribute_names:\n'
              '                self.violations.add("closed-details")\n'
              '            else:\n'
              '                # An initially open disclosure remains user-collapsible, so a\n'
              '                # mandatory qualifier can be hidden without changing the source.\n'
              '                self.violations.add("interactive-details")\n',
          )
          replace_once(
              policing,
              '        "named-details": "named details-group HTML",\n',
              '        "named-details": "named details-group HTML",\n'
              '        "interactive-details": "interactive details disclosure HTML",\n'
              '        "editable-content": "contenteditable governed HTML",\n',
          )
          # Preserve existing specific diagnostics when markup violates more than one
          # governed rule. Generic role overrides remain rejected, but accessibility
          # suppression is reported first when both are present.
          replace_once(
              policing,
              '        "semantic-role": "semantic role override HTML",\n',
              '',
          )
          replace_once(
              policing,
              '        "accessibility-hidden": "aria-hidden accessibility suppression HTML",\n',
              '        "accessibility-hidden": "aria-hidden accessibility suppression HTML",\n'
              '        "semantic-role": "semantic role override HTML",\n',
          )

          registry = Path("tests/test_research_reference_registry.py")
          replace_once(
              registry,
              '    "named-details",\n',
              '    "named-details",\n'
              '    "interactive-details",\n'
              '    "editable-content",\n',
          )
          replace_once(
              registry,
              '    assert "named-details" not in found, (\n'
              '        "named details-group HTML is not allowed in governed documents"\n'
              '    )\n',
              '    assert "named-details" not in found, (\n'
              '        "named details-group HTML is not allowed in governed documents"\n'
              '    )\n'
              '    assert "interactive-details" not in found, (\n'
              '        "interactive details disclosure HTML is not allowed in governed documents"\n'
              '    )\n'
              '    assert "editable-content" not in found, (\n'
              '        "contenteditable HTML is not allowed in governed documents"\n'
              '    )\n',
          )
          replace_once(
              registry,
              '        "semantic role overrides on governed source anchors are not allowed in governed documents"\n',
              '        "semantic role overrides are not allowed on governed content"\n',
          )
          replace_once(
              registry,
              'def test_open_details_keep_governed_batch_visible():\n'
              '    corpus = CORPUS.read_text(encoding="utf-8")\n'
              '    start = corpus.index(BATCH_HEADING) + len(BATCH_HEADING)\n'
              '    end = corpus.index(BATCH_END, start)\n'
              '    mutated = (\n'
              '        corpus[:start]\n'
              '        + "\\n<details open>\\n<summary>Governed references</summary>\\n\\n"\n'
              '        + corpus[start:end]\n'
              '        + "\\n</details>\\n\\n"\n'
              '        + corpus[end:]\n'
              '    )\n'
              '    _validate_registry_corpus(mutated)\n',
              'def test_open_details_are_rejected_as_collapsible_governance():\n'
              '    corpus = CORPUS.read_text(encoding="utf-8")\n'
              '    start = corpus.index(BATCH_HEADING) + len(BATCH_HEADING)\n'
              '    end = corpus.index(BATCH_END, start)\n'
              '    mutated = (\n'
              '        corpus[:start]\n'
              '        + "\\n<details open>\\n<summary>Governed references</summary>\\n\\n"\n'
              '        + corpus[start:end]\n'
              '        + "\\n</details>\\n\\n"\n'
              '        + corpus[end:]\n'
              '    )\n'
              '    with pytest.raises(AssertionError, match="interactive details disclosure"):\n'
              '        _validate_registry_corpus(mutated)\n',
          )

          regressions = Path("tests/test_pr4_current_review_regressions.py")
          marker = "def test_open_details_contenteditable_and_role_overrides_are_rejected() -> None:"
          text = regressions.read_text(encoding="utf-8")
          if marker not in text:
              text += '''\n\n\ndef test_open_details_contenteditable_and_role_overrides_are_rejected() -> None:\n    corpus = (ROOT / "docs" / "RESEARCH-REFERENCE-CORPUS.md").read_text(encoding="utf-8")\n    canonical = "Availability through ABC iview is not permission to redistribute content."\n    assert canonical in corpus\n    variants = (\n        (\n            "Availability through ABC iview is <details open>not</details> permission to redistribute content.",\n            "interactive details disclosure",\n        ),\n        (\n            "Availability through ABC iview is <span contenteditable>not</span> permission to redistribute content.",\n            "contenteditable",\n        ),\n        (\n            'Availability through ABC iview is <span role="img">not</span> permission to redistribute content.',\n            "semantic role overrides",\n        ),\n    )\n    for replacement, diagnostic in variants:\n        mutated = corpus.replace(canonical, replacement, 1)\n        assert mutated != corpus\n        with pytest.raises(AssertionError, match=diagnostic):\n            REGISTRY["_validate_registry_corpus"](mutated)\n\n\ndef test_shared_preflight_reports_governed_interaction_semantics() -> None:\n    violations = POLICING["_governed_surface_html_violations"]\n    assert "interactive-details" in violations("<details open>not</details>")\n    assert "closed-details" in violations("<details>not</details>")\n    assert "interactive-details" not in violations("<details>not</details>")\n    assert "editable-content" in violations("<span contenteditable>not</span>")\n    assert "semantic-role" in violations('<span role="img">not</span>')\n    assert "semantic-heading" in violations('<span role="heading">not</span>')\n    assert "semantic-role" not in violations('<span role="heading">not</span>')\n''' 
              regressions.write_text(text, encoding="utf-8")
          PY

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run exact review regressions
        run: pytest -q tests/test_pr4_current_review_regressions.py

      - name: Run focused governance suites
        run: |
          pytest -q \
            tests/test_policing_context_roadmap.py \
            tests/test_research_reference_registry.py \
            tests/test_workstream_h_methodology.py \
            tests/test_policing_contract_receipt.py \
            tests/test_ascft_methodology_integrity.py \
            tests/test_phase2_review_followup.py

      - name: Validate datasets and full suite
        run: |
          python -m australian_for_ais.cli validate data/starter/examples.jsonl
          python -m australian_for_ais.cli validate-pilot data/pilot/items.jsonl
          pytest -q --disable-warnings --maxfail=1
          git diff --check

      - name: Commit repair and self-delete runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr4-final-policy-repair.yml
          git add tests/test_policing_context_roadmap.py tests/test_research_reference_registry.py tests/test_pr4_current_review_regressions.py
          git commit -m "Harden governed interactive semantics"
          git push origin HEAD:research-corpus-governed-expansion
