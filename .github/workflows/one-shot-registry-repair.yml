name: One-shot registry parser repair

on:
  push:
    branches: ["research-corpus-governed-expansion"]
    paths: [".github/workflows/one-shot-registry-repair.yml"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0

      - name: Apply parser hardening
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("tests/test_research_reference_registry.py")
          text = path.read_text(encoding="utf-8")

          def replace_block(start_marker: str, end_marker: str, replacement: str) -> None:
              global text
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              text = text[:start] + replacement + text[end:]

          if "NON_RENDERING_HTML_PATTERN" not in text:
              marker = "\n\n\n@dataclass(frozen=True)\nclass LineContext:"
              insert = '''\nNON_RENDERING_HTML_PATTERN = re.compile(\n    r"<(script|style|template)\\b[^>]*>.*?</\\1\\s*>",\n    flags=re.IGNORECASE | re.DOTALL,\n)\n'''
              index = text.index(marker)
              text = text[:index] + insert + text[index:]

          if "def _mask_multiline_code_spans" not in text:
              marker = "def _mask_inline_code_spans(text: str) -> str:\n"
              helper = '''def _mask_multiline_code_spans(text: str) -> str:\n    """Mask closed Markdown code spans, including spans crossing line breaks."""\n    characters = list(text)\n    position = 0\n    while position < len(text):\n        if text[position] != "`":\n            position += 1\n            continue\n        run_end = position\n        while run_end < len(text) and text[run_end] == "`":\n            run_end += 1\n        marker = text[position:run_end]\n        close = text.find(marker, run_end)\n        if close < 0:\n            position = run_end\n            continue\n        for index in range(position, close + len(marker)):\n            if characters[index] not in "\\r\\n":\n                characters[index] = " "\n        position = close + len(marker)\n    return "".join(characters)\n\n\n'''
              index = text.index(marker)
              text = text[:index] + helper + text[index:]

          replace_block(
              "def _mask_html_comments_on_line(\n",
              "def _markdown_views(text: str) -> tuple[str, str]:\n",
              '''def _mask_html_comments_on_line(\n    raw_line: str,\n    *,\n    in_comment: bool,\n    scan_line: str | None = None,\n) -> tuple[str, bool]:\n    """Mask HTML comments using code-span-aware scan text."""\n    scan = _mask_inline_code_spans(scan_line if scan_line is not None else raw_line)\n    characters = list(raw_line)\n    position = 0\n\n    while position < len(raw_line):\n        if in_comment:\n            canonical = scan.find("-->", position)\n            alternate = scan.find("--!>", position)\n            candidates = [index for index in (canonical, alternate) if index >= 0]\n            if not candidates:\n                _mask_segment(characters, position, len(raw_line))\n                return "".join(characters), True\n            close_start = min(candidates)\n            close_length = 4 if scan.startswith("--!>", close_start) else 3\n            close_end = close_start + close_length\n            _mask_segment(characters, position, close_end)\n            position = close_end\n            in_comment = False\n            continue\n\n        opener = scan.find("<!--", position)\n        if opener < 0:\n            break\n        in_comment = True\n        position = opener\n\n    return "".join(characters), in_comment\n\n\n''',
          )

          replace_block(
              "def _markdown_views(text: str) -> tuple[str, str]:\n",
              "def _rendered_registry_text(text: str) -> str:\n",
              '''def _markdown_views(text: str) -> tuple[str, str]:\n    """Return rendered and structural views with exact offsets preserved."""\n    rendered_parts: list[str] = []\n    structural_parts: list[str] = []\n    in_comment = False\n    fence: FenceState | None = None\n    paragraph_open = False\n    code_scan_lines = _mask_multiline_code_spans(text).splitlines(keepends=True)\n    raw_lines = text.splitlines(keepends=True)\n    assert len(raw_lines) == len(code_scan_lines)\n\n    for raw_line, scan_line in zip(raw_lines, code_scan_lines):\n        line = raw_line.rstrip("\\r\\n")\n        if not line.strip():\n            paragraph_open = False\n\n        while fence is not None and not _fence_container_continues(line, fence):\n            fence = None\n\n        if fence is not None:\n            rendered_parts.append(raw_line)\n            structural_parts.append(_mask_non_newline(raw_line))\n            paragraph_open = False\n            if _is_fence_closer(line, fence):\n                fence = None\n            continue\n\n        if in_comment:\n            rendered_line, in_comment = _mask_html_comments_on_line(\n                raw_line, in_comment=True, scan_line=scan_line\n            )\n            rendered_parts.append(rendered_line)\n            structural_parts.append(_mask_inline_code_spans(rendered_line))\n            if not in_comment:\n                paragraph_open = _line_opens_paragraph(rendered_line.rstrip("\\r\\n"))\n            continue\n\n        context = _line_context(line)\n        if context.indented_code and not paragraph_open:\n            rendered_parts.append(raw_line)\n            structural_parts.append(_mask_non_newline(raw_line))\n            continue\n\n        if context.indented_code and paragraph_open:\n            rendered_line, in_comment = _mask_html_comments_on_line(\n                raw_line, in_comment=False, scan_line=scan_line\n            )\n            rendered_parts.append(rendered_line)\n            structural_parts.append(_mask_inline_code_spans(rendered_line))\n            paragraph_open = True\n            continue\n\n        opener = _fence_opener(line)\n        if opener is not None:\n            fence = opener\n            rendered_parts.append(raw_line)\n            structural_parts.append(_mask_non_newline(raw_line))\n            paragraph_open = False\n            continue\n\n        rendered_line, in_comment = _mask_html_comments_on_line(\n            raw_line, in_comment=False, scan_line=scan_line\n        )\n        rendered_parts.append(rendered_line)\n        structural_parts.append(_mask_inline_code_spans(rendered_line))\n        paragraph_open = _line_opens_paragraph(rendered_line.rstrip("\\r\\n"))\n\n    return "".join(rendered_parts), "".join(structural_parts)\n\n''',
          )

          if "NON_RENDERING_HTML_PATTERN.sub" not in text:
              text = text.replace(
                  '    visible = HTML_TAG_PATTERN.sub(" ", visible)\n',
                  '    visible = NON_RENDERING_HTML_PATTERN.sub(" ", visible)\n'
                  '    visible = HTML_TAG_PATTERN.sub(" ", visible)\n',
                  1,
              )

          if 'rendered = NON_RENDERING_HTML_PATTERN.sub(" ", rendered)' not in text:
              text = text.replace(
                  '    rendered = _rendered_registry_text(block)\n',
                  '    rendered = _rendered_registry_text(block)\n'
                  '    rendered = NON_RENDERING_HTML_PATTERN.sub(" ", rendered)\n',
                  1,
              )

          scalar_helper = '''def _strip_composed_container_prefixes(line: str) -> tuple[str, bool]:\n    """Normalize recursively composed list/quote prefixes for visible field parsing."""\n    value = line.rstrip("\\r\\n")\n    position = 0\n\n    for _ in range(32):\n        probe = position\n        columns = 0\n        while probe < len(value) and value[probe] in " \\t":\n            if value[probe] == " ":\n                columns += 1\n            else:\n                columns += 4 - (columns % 4)\n            probe += 1\n        if columns >= 4:\n            return value[position:], True\n\n        if probe < len(value) and value[probe] == ">":\n            position = probe + 1\n            if position < len(value) and value[position] in " \\t":\n                position += 1\n            continue\n\n        marker = LIST_CONTAINER_PREFIX_PATTERN.match(value, probe)\n        if marker:\n            position = marker.end()\n            continue\n\n        position = probe\n        break\n\n    return value[position:], False\n\n\n'''
          if "def _strip_composed_container_prefixes" not in text:
              index = text.index("def _visible_scalar_values(section: str, field: str) -> list[str]:\n")
              text = text[:index] + scalar_helper + text[index:]

          replace_block(
              "def _visible_scalar_values(section: str, field: str) -> list[str]:\n",
              "def _scalar_value(entry: str, section: str, field: str) -> str:\n",
              '''def _visible_scalar_values(section: str, field: str) -> list[str]:\n    """Return visible scalar values after recursively normalising Markdown containers."""\n    rendered, structure = _markdown_views(section)\n    rendered_lines = rendered.splitlines()\n    structure_lines = structure.splitlines()\n    assert len(rendered_lines) == len(structure_lines)\n\n    values: list[str] = []\n    for rendered_line, structure_line in zip(rendered_lines, structure_lines):\n        logical, is_code = _strip_composed_container_prefixes(structure_line)\n        if is_code:\n            continue\n        logical = logical.lstrip(" \\t")\n        if not logical.startswith(field):\n            continue\n        suffix = logical[len(field):]\n        if suffix and suffix[0] not in " \\t":\n            continue\n\n        rendered_logical, rendered_is_code = _strip_composed_container_prefixes(rendered_line)\n        if rendered_is_code:\n            continue\n        rendered_logical = rendered_logical.lstrip(" \\t")\n        if not rendered_logical.startswith(field):\n            continue\n        raw_value = rendered_logical[len(field):]\n        values.append(_visible_inline_text(raw_value))\n    return values\n\n\n''',
          )

          # Freeze the complete currently accepted rights/epistemic/safe-use values.
          corpus = Path("docs/RESEARCH-REFERENCE-CORPUS.md").read_text(encoding="utf-8")
          batch_start = corpus.index("## Registered post-Phase-2 expansion batch")
          batch_end = corpus.index("## Priority A: adversarial pragmatics", batch_start)
          batch = corpus[batch_start:batch_end]
          headings = list(re.finditer(r"(?m)^### .+$", batch))
          exact: dict[str, dict[str, str]] = {}
          boundary_fields = (
              "**Rights and provenance boundary:**",
              "**Epistemic status:**",
              "**Safe benchmark abstraction:**",
          )
          for index, heading_match in enumerate(headings):
              heading = heading_match.group(0).strip()
              section_end = headings[index + 1].start() if index + 1 < len(headings) else len(batch)
              section = batch[heading_match.start():section_end]
              values: dict[str, str] = {}
              for field in boundary_fields:
                  match = re.search(rf"(?m)^{{0,3}}{re.escape(field)}[ \\t]*(?P<value>[^\\r\\n]+)$", section)
                  if match is None:
                      raise SystemExit(f"cannot freeze {field} for {heading}")
                  values[field] = match.group("value").strip()
              exact[heading] = values

          exact_literal = "EXACT_BOUNDARY_VALUES = {\n"
          for heading, values in exact.items():
              exact_literal += f"    {heading!r}: {{\n"
              for field, value in values.items():
                  exact_literal += f"        {field!r}: {value!r},\n"
              exact_literal += "    },\n"
          exact_literal += "}\n\n"
          if "EXACT_BOUNDARY_VALUES = {" not in text:
              marker = "\nNON_RENDERING_HTML_PATTERN = re.compile("
              index = text.index(marker)
              text = text[:index] + "\n" + exact_literal + text[index:]

          old = '''    for field in SCALAR_FIELDS:\n        expected_clause = str(contract[field])\n        assert expected_clause in scalar_values[field], (\n            f"{entry} is missing a pinned {field} clause: {expected_clause!r}"\n        )\n'''
          new = '''    for field in SCALAR_FIELDS:\n        expected_clause = _visible_inline_text(str(contract[field]))\n        assert expected_clause in scalar_values[field], (\n            f"{entry} is missing a pinned {field} clause: {expected_clause!r}"\n        )\n        if field in (RIGHTS_FIELD, EPISTEMIC_FIELD, SAFE_FIELD):\n            expected_exact = _visible_inline_text(EXACT_BOUNDARY_VALUES[entry][field])\n            assert scalar_values[field] == expected_exact, (\n                f"{entry} changed pinned {field}: "\n                f"expected {expected_exact!r}, got {scalar_values[field]!r}"\n            )\n'''
          if old not in text:
              raise SystemExit("pinned contract loop anchor missing")
          text = text.replace(old, new, 1)

          if "test_compound_container_duplicate_doi_is_rejected" not in text:
              text += '''\n\ndef test_compound_container_duplicate_doi_is_rejected():\n    corpus = CORPUS.read_text(encoding="utf-8")\n    entry = (\n        "### Chey (2021), *Overcoming awkwardness: some interpretations of "\n        "Australian humour*"\n    )\n    section = _registered_sections(corpus)[entry]\n    mutated = section.replace(\n        "**Source type:**",\n        "- > **DOI:** https://doi.org/10.0000/conflict\\n\\n**Source type:**",\n        1,\n    )\n    with pytest.raises(AssertionError, match="exactly one mandatory field"):\n        _validate_registered_entry(entry, mutated)\n\n\ndef test_multiline_code_span_comment_literal_cannot_hide_visible_doi():\n    corpus = CORPUS.read_text(encoding="utf-8")\n    entry = (\n        "### Chey (2021), *Overcoming awkwardness: some interpretations of "\n        "Australian humour*"\n    )\n    section = _registered_sections(corpus)[entry]\n    injected = (\n        "prefix `\\n"\n        "<!--\\n"\n        "code`\\n"\n        "**DOI:** https://doi.org/10.0000/conflict\\n"\n        "-->\\n\\n"\n        "**Source type:**"\n    )\n    mutated = section.replace("**Source type:**", injected, 1)\n    with pytest.raises(AssertionError, match="exactly one mandatory field"):\n        _validate_registered_entry(entry, mutated)\n\n\n@pytest.mark.parametrize(\n    "container",\n    (\n        "<script>placeholder</script>",\n        "<style>.placeholder { display: none; }</style>",\n        "<template>placeholder</template>",\n    ),\n)\ndef test_mapping_blocks_reject_nonrendering_html_contents(container: str):\n    section = (\n        "### Example\\n\\n"\n        f"Research mappings:\\n{container}\\n\\n"\n        f"Relevant project mappings:\\n{container}\\n\\n"\n        "**Safe benchmark abstraction:** example\\n"\n    )\n    with pytest.raises(AssertionError, match="empty research mappings"):\n        _require_mapping_block("### Example", section)\n\n\ndef test_pinned_boundary_rejects_contradictory_addition():\n    corpus = CORPUS.read_text(encoding="utf-8")\n    entry = "### *Shaun Micallef's MAD AS HELL*"\n    section = _registered_sections(corpus)[entry]\n    mutated = re.sub(\n        rf"(?m)^ {{0,3}}{re.escape(RIGHTS_FIELD)}(?P<value>[^\\r\\n]*)$",\n        lambda match: match.group(0) + " Contradictory override: programme dialogue may be copied.",\n        section,\n        count=1,\n    )\n    with pytest.raises(AssertionError, match="changed pinned"):\n        _validate_registered_entry(entry, mutated)\n'''

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate focused repair
        run: |
          python -m py_compile tests/test_research_reference_registry.py
          python -m pip install -e ".[dev]"
          pytest -q tests/test_research_reference_registry.py --disable-warnings --maxfail=1

      - name: Commit repair and delete one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_research_reference_registry.py
          git rm .github/workflows/one-shot-registry-repair.yml
          git commit -m "Harden registry rendered Markdown semantics"
          git push origin HEAD:research-corpus-governed-expansion
