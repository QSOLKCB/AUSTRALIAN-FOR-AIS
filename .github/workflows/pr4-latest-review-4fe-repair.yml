name: PR4 Latest Review 4fe Repair

on:
  push:
    branches:
      - research-corpus-governed-expansion
    paths:
      - .github/pr4_latest_review_4fe_repair.py
      - .github/workflows/pr4-latest-review-4fe-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply guarded review repair
        run: |
          python - <<'PY'
          from pathlib import Path

          script_path = Path(".github/pr4_latest_review_4fe_repair.py")
          script = script_path.read_text(encoding="utf-8")

          old_details = '"\\\\n\\\\n<details><summary>This source may be freely copied.</summary></details>\\\\n"'
          new_details = '"\\\\n\\\\n<details><summary>This source may be freely copied.</summary></details>\\\\n\\\\n"'
          if script.count(old_details) != 1:
              raise SystemExit(
                  "closed-details generator fixture: expected exactly one malformed boundary"
              )
          script = script.replace(old_details, new_details, 1)

          old_match = 'match="missing a pinned|changed pinned"'
          new_match = (
              'match="complete rendered governed entry changed|missing a pinned|changed pinned"'
          )
          if script.count(old_match) != 2:
              raise SystemExit(
                  "rendered-integrity regressions: expected exactly two narrow matchers"
              )
          script = script.replace(old_match, new_match)

          old_raw = '''    mutated_section = section.replace(expected, f"<{tag}>{expected}</{tag}>", 1)\\n    with pytest.raises(AssertionError, match="conditional/legacy raw-text HTML"):\\n        _validate_registry_corpus(corpus.replace(section, mutated_section, 1))\\n'''
          new_raw = '''    mutated_section = section.replace(expected, f"<{tag}>{expected}</{tag}>", 1)\\n    assert "conditional-raw-text" in _forbidden_governed_html_constructs(mutated_section)\\n    with pytest.raises(\\n        AssertionError,\\n        match="conditional/legacy raw-text HTML|changed pinned",\\n    ):\\n        _validate_registry_corpus(corpus.replace(section, mutated_section, 1))\\n'''
          if script.count(old_raw) != 1:
              raise SystemExit(
                  "raw-text regression: expected exactly one assertion-order-sensitive block"
              )
          script = script.replace(old_raw, new_raw, 1)
          script_path.write_text(script, encoding="utf-8")
          PY
          python .github/pr4_latest_review_4fe_repair.py
          python - <<'PY'
          from pathlib import Path
          for name in (
              "tests/test_research_reference_registry.py",
              "tests/test_workstream_h_methodology.py",
          ):
              path = Path(name)
              path.write_text(path.read_text(encoding="utf-8").rstrip() + "\n", encoding="utf-8")
          PY

      - name: Check patch whitespace
        run: git diff --check

      - name: Run focused governance tests
        run: |
          pytest -q --disable-warnings --maxfail=1 \
            tests/test_research_reference_registry.py \
            tests/test_policing_context_roadmap.py \
            tests/test_workstream_h_methodology.py \
            tests/test_policing_contract_receipt.py \
            tests/test_phase2_review_followup.py

      - name: Run full test suite
        run: pytest -q --disable-warnings --maxfail=1

      - name: Recheck patch whitespace
        run: git diff --check

      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_research_reference_registry.py tests/test_workstream_h_methodology.py
          if git diff --cached --quiet; then
            echo "No repair changes to commit"
            exit 0
          fi
          git commit -m "Harden latest browser governance semantics"
          git push origin HEAD:research-corpus-governed-expansion
