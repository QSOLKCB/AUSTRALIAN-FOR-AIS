name: PR4 five-fresh-review guarded repair

on:
  push:
    branches:
      - research-corpus-governed-expansion
    paths:
      - .github/workflows/pr4-five-fresh-review-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply guarded repair
        run: |
          set -euo pipefail
          python .github/scripts/pr4-five-fresh-review-repair.py

      - name: Run focused governance suite
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_research_reference_registry.py \
            tests/test_policing_context_roadmap.py \
            tests/test_workstream_h_methodology.py \
            tests/test_policing_contract_receipt.py

      - name: Validate data contracts
        run: |
          set -euo pipefail
          python -m australian_for_ais.cli validate data/starter/examples.jsonl
          python -m australian_for_ais.cli validate-pilot data/pilot/items.jsonl

      - name: Run full suite
        run: |
          set -euo pipefail
          pytest -q --disable-warnings --maxfail=1

      - name: Self-clean temporary repair machinery
        run: |
          set -euo pipefail
          rm .github/scripts/pr4-five-fresh-review-repair.py
          rm .github/workflows/pr4-five-fresh-review-repair.yml
          test ! -e .github/scripts/pr4-five-fresh-review-repair.py
          test ! -e .github/workflows/pr4-five-fresh-review-repair.yml

      - name: Commit verified repair
        run: |
          set -euo pipefail
          git config user.name "Trent Slade"
          git config user.email "73952179+EmergentMonk@users.noreply.github.com"
          git add \
            tests/test_research_reference_registry.py \
            tests/test_policing_context_roadmap.py \
            tests/test_workstream_h_methodology.py \
            tests/test_policing_contract_receipt.py
          git add -u \
            .github/scripts/pr4-five-fresh-review-repair.py \
            .github/workflows/pr4-five-fresh-review-repair.yml
          git diff --cached --check
          git commit -m "Close five fresh PR4 review gaps"
          git push origin HEAD:research-corpus-governed-expansion
