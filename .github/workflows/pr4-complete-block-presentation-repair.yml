name: PR4 complete block and presentation repair

on:
  push:
    branches:
      - research-corpus-governed-expansion

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact repair parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "479d50da342df0ed849f99adfae8b6ac1ebb249a"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Patch complete block policy and presentation regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected one occurrence of {old!r}, found {count}"
                  )
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          policing = Path("tests/test_policing_context_roadmap.py")

          policy_marker = 'COMMONMARK_RAW_HTML_TAG_SENTINEL = "\\ue03f"\n'
          policy = '''# Every CommonMark type-6 block tag must either have a dedicated fail-closed\n# rendering policy or participate in the generic raw-block ownership policy.\n# Derive the latter from the canonical CommonMark set above so new/less-common\n# block elements cannot silently drift out of coverage.\nGOVERNED_BLOCK_TAGS_WITH_DEDICATED_POLICY = frozenset({\n    "base", "basefont", "blockquote", "body", "caption", "col", "colgroup",\n    "details", "dialog", "form", "h1", "h2", "h3", "h4", "h5", "h6",\n    "head", "hr", "html", "iframe", "link", "noframes", "ol", "optgroup",\n    "option", "table", "tbody", "td", "tfoot", "th", "thead", "title", "tr",\n    "ul",\n})\nGOVERNED_RAW_BLOCK_CONTAINER_TAGS = (\n    PREFLIGHT_HTML_BLOCK_TAGS - GOVERNED_BLOCK_TAGS_WITH_DEDICATED_POLICY\n)\n\n\n'''
          replace_once(policing, policy_marker, policy + policy_marker)

          old_regex = '''    raw_block_tag = re.compile(\n        r"<(?P<closing>/)?(?P<tag>address|article|aside|div|dl|fieldset|figcaption|figure|footer|header|main|nav|p|section|summary)\\b[^>]*>",\n        flags=re.IGNORECASE,\n    )\n'''
          new_regex = '''    raw_block_pattern = "|".join(\n        re.escape(tag) for tag in sorted(GOVERNED_RAW_BLOCK_CONTAINER_TAGS)\n    )\n    raw_block_tag = re.compile(\n        rf"<(?P<closing>/)?(?P<tag>{raw_block_pattern})\\b[^>]*>",\n        flags=re.IGNORECASE,\n    )\n'''
          replace_once(policing, old_regex, new_regex)

          replace_once(
              policing,
              '        if tag in {"font", "basefont", "small"}:\n',
              '        if tag in {"font", "basefont", "small", "sup", "sub"}:\n',
          )

          regression = Path("tests/test_pr4_clean_head_audit_regressions.py")
          text = regression.read_text(encoding="utf-8")
          additions = r'''


          def test_raw_block_policy_is_derived_from_complete_commonmark_set() -> None:
              expected = (
                  POLICING["PREFLIGHT_HTML_BLOCK_TAGS"]
                  - POLICING["GOVERNED_BLOCK_TAGS_WITH_DEDICATED_POLICY"]
              )
              assert POLICING["GOVERNED_RAW_BLOCK_CONTAINER_TAGS"] == expected
              assert {"center", "search", "menu", "legend"} <= expected
              assert "title" not in expected


          @pytest.mark.parametrize("tag", ("center", "search", "menu", "legend"))
          def test_additional_commonmark_block_containers_cannot_detach_rights_negation(
              tag: str,
          ) -> None:
              corpus = CORPUS.read_text(encoding="utf-8")
              original = (
                  "Availability through ABC iview is not permission "
                  "to redistribute content."
              )
              fragment = (
                  "Availability through ABC iview is "
                  f"<{tag}>not</{tag}> permission to redistribute content."
              )
              assert original in corpus
              assert "raw-block" in POLICING["_governed_surface_html_violations"](
                  fragment
              )
              with pytest.raises(AssertionError, match="raw block-container HTML"):
                  REGISTRY["_validate_registry_corpus"](
                      corpus.replace(original, fragment, 1)
                  )


          @pytest.mark.parametrize("tag", ("sup", "sub"))
          def test_vertical_presentation_cannot_deemphasize_rights_negation(tag: str) -> None:
              corpus = CORPUS.read_text(encoding="utf-8")
              original = (
                  "Availability through ABC iview is not permission "
                  "to redistribute content."
              )
              fragment = (
                  "Availability through ABC iview is "
                  f"<{tag}>not</{tag}> permission to redistribute content."
              )
              assert original in corpus
              violations = POLICING["_governed_surface_html_violations"](fragment)
              assert "presentational-font" in violations
              with pytest.raises(AssertionError, match="presentational"):
                  REGISTRY["_validate_registry_corpus"](
                      corpus.replace(original, fragment, 1)
                  )
          '''
          additions = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in additions.splitlines()
          )
          regression.write_text(text.rstrip() + additions + "\n", encoding="utf-8")
          PY

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run focused regressions
        run: |
          pytest -q \
            tests/test_pr4_clean_head_audit_regressions.py \
            tests/test_policing_context_roadmap.py \
            tests/test_research_reference_registry.py

      - name: Run full suite
        run: pytest -q --disable-warnings --maxfail=1

      - name: Commit verified repair and self-delete runner
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr4-complete-block-presentation-repair.yml
          git add tests/test_policing_context_roadmap.py \
                  tests/test_pr4_clean_head_audit_regressions.py
          git diff --cached --check
          git commit -m "Close PR4 block and presentation gaps"
          git push origin HEAD:research-corpus-governed-expansion
