name: PR4 seven-review guarded repair v2

on:
  push:
    branches:
      - research-corpus-governed-expansion
    paths:
      - .github/workflows/pr4-seven-review-fixes-v2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -e . pytest

      - name: Patch exact review findings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              assert count == 1, f"{path}: expected one patch target, found {count}"
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          policing = "tests/test_policing_context_roadmap.py"
          registry = "tests/test_research_reference_registry.py"
          workstream_h = "tests/test_workstream_h_methodology.py"
          phase2 = "tests/test_phase2_review_followup.py"

          replace_once(
              policing,
              '''COMMONMARK_CHARACTER_REFERENCE_PATTERN = re.compile(
              r"&(?:#[0-9]{1,7}|#[xX][0-9A-Fa-f]{1,6}|[A-Za-z][A-Za-z0-9]{1,31});"
          )
          ENTITY_LITERAL_ASTERISK = "\\uE112"
          ''',
              '''COMMONMARK_CHARACTER_REFERENCE_PATTERN = re.compile(
              r"&(?:#[0-9]{1,7}|#[xX][0-9A-Fa-f]{1,6}|[A-Za-z][A-Za-z0-9]{1,31});"
          )


          def _contains_non_commonmark_character_reference(text: str) -> bool:
              """Detect HTML-only semicolonless references before HTML reduction."""
              for match in re.finditer(
                  r"&(?:#[xX][0-9A-Fa-f]{1,6}|#[0-9]{1,7}|[A-Za-z][A-Za-z0-9]{0,31})",
                  text,
              ):
                  token = match.group(0)
                  if match.end() < len(text) and text[match.end()] == ";":
                      continue
                  if html.unescape(token) != token:
                      return True
              return False


          ENTITY_LITERAL_ASTERISK = "\\uE112"
          ''',
          )

          replace_once(
              policing,
              '''HTML_IMPLIED_SIBLING_END_TAGS = {
              "li": frozenset({"li"}),
              "dt": frozenset({"dt", "dd"}),
              "dd": frozenset({"dt", "dd"}),
          }
          ''',
              '''HTML_IMPLIED_SIBLING_END_TAGS = {
              "li": frozenset({"li"}),
              "dt": frozenset({"dt", "dd"}),
              "dd": frozenset({"dt", "dd"}),
              "rt": frozenset({"rt", "rp"}),
              "rp": frozenset({"rt", "rp"}),
          }
          ''',
          )

          replace_once(
              policing,
              '''        self.violations: set[str] = set()
                  self._anchor_open = False
          ''',
              '''        self.violations: set[str] = set()
                  self._anchor_open = False
                  self._nobr_open = False
          ''',
          )

          replace_once(
              policing,
              '''        if tag == "a":
                      if self._anchor_open:
                          self.violations.add("nested-anchor")
                      self._anchor_open = True
          ''',
              '''        if tag == "a":
                      if self._anchor_open:
                          self.violations.add("nested-anchor")
                      self._anchor_open = True
                  if tag == "nobr":
                      if self._nobr_open:
                          self.violations.add("nested-nobr")
                      self._nobr_open = True
          ''',
          )

          replace_once(
              policing,
              '''        if tag in {"html", "body"}:
                      self.violations.add("document-root")
          ''',
              '''        if tag in {"html", "body"}:
                      self.violations.add("document-root")
                  if tag in {"head", "caption", "col", "colgroup", "tbody", "td", "tfoot", "th", "thead", "tr"}:
                      self.violations.add("in-body-structure")
          ''',
          )

          replace_once(
              policing,
              '''    def handle_endtag(self, tag: str) -> None:
                  if tag.lower() == "a":
                      self._anchor_open = False
          ''',
              '''    def handle_endtag(self, tag: str) -> None:
                  tag = tag.lower()
                  if tag == "a":
                      self._anchor_open = False
                  if tag == "nobr":
                      self._nobr_open = False
          ''',
          )

          replace_once(
              policing,
              '''    if any(
                  _has_executable_url_scheme(
                      _decode_markdown_destination_for_scheme(match.group("url"))
                  )
                  for match in AUTOLINK_PATTERN.finditer(markdown_source)
              ):
                  parser.violations.add("executable-url")
              if _contains_live_markdown_image_syntax(markdown_source):
          ''',
              '''    if any(
                  _has_executable_url_scheme(
                      _decode_markdown_destination_for_scheme(match.group("url"))
                  )
                  for match in AUTOLINK_PATTERN.finditer(markdown_source)
              ):
                  parser.violations.add("executable-url")
              if _contains_non_commonmark_character_reference(markdown_source):
                  parser.violations.add("non-commonmark-character-reference")
              if _contains_live_markdown_image_syntax(markdown_source):
          ''',
          )

          replace_once(
              policing,
              '''        "nested-anchor": "nested anchor HTML",
                  "interactive-form": "interactive form control HTML",
          ''',
              '''        "nested-anchor": "nested anchor HTML",
                  "nested-nobr": "nested nobr HTML",
                  "in-body-structure": "discarded in-body structural HTML",
                  "non-commonmark-character-reference": "semicolonless HTML-only character reference",
                  "interactive-form": "interactive form control HTML",
          ''',
          )

          replace_once(
              registry,
              '''    "generated-quotation",
              "markdown-image",
          })
          ''',
              '''    "generated-quotation",
              "markdown-image",
              "raw-svg",
              "raw-mathml",
              "nested-nobr",
              "in-body-structure",
              "non-commonmark-character-reference",
          })
          ''',
          )

          replace_once(
              registry,
              '''    assert "markdown-image" not in found, (
                  "Markdown images are not allowed in governed documents"
              )
          ''',
              '''    assert "markdown-image" not in found, (
                  "Markdown images are not allowed in governed documents"
              )
              assert "raw-svg" not in found, (
                  "raw SVG is not allowed in governed documents"
              )
              assert "raw-mathml" not in found, (
                  "raw MathML is not allowed in governed documents"
              )
              assert "nested-nobr" not in found, (
                  "nested nobr HTML is not allowed in governed documents"
              )
              assert "in-body-structure" not in found, (
                  "discarded in-body structural HTML is not allowed in governed documents"
              )
              assert "non-commonmark-character-reference" not in found, (
                  "semicolonless HTML-only character references are not allowed in governed documents"
              )
          ''',
          )

          replace_once(
              workstream_h,
              '''def _rendered_inline_citation_links(text: str) -> tuple[tuple[str, str], ...]:
              """Use the registry's structural view, not hidden Markdown source text."""
              registry = runpy.run_path(str(POLICING_TEST.with_name("test_research_reference_registry.py")))
              structure = registry["_structural_registry_text"](text)
          ''',
              '''def _rendered_inline_citation_links(text: str) -> tuple[tuple[str, str], ...]:
              """Use the registry's structural view, not hidden Markdown source text."""
              registry = runpy.run_path(str(POLICING_TEST.with_name("test_research_reference_registry.py")))
              assert not registry["_contains_markdown_structure_in_type6_raw_html"](text), (
                  "Workstream H citations must not depend on Markdown made literal by a CommonMark type-6 raw HTML block"
              )
              structure = registry["_structural_registry_text"](text)
          ''',
          )

          replace_once(
              phase2,
              '''def _next_notes_peer_heading(structure: str, namespace: dict) -> int:
              """Find a visible ATX, Setext, or HTML peer heading without crossing code."""
              offset = 0
          ''',
              '''def _next_notes_peer_heading(structure: str, namespace: dict) -> int:
              """Find a visible ATX, Setext, or HTML peer heading without crossing code."""
              html_heading_starts = [
                  match.start()
                  for match in re.finditer(
                      r"^[ \\t]{0,3}<h[1-3](?=[ \\t\\r\\n\\f/>])(?:[^>\\\"']|\\\"[^\\\"]*\\\"|'[^']*')*>",
                      structure,
                      flags=re.IGNORECASE | re.MULTILINE | re.DOTALL,
                  )
              ]
              offset = 0
          ''',
          )

          replace_once(
              phase2,
              '''    for raw_line in structure.splitlines(keepends=True):
                  if paragraph_start is not None:
          ''',
              '''    for raw_line in structure.splitlines(keepends=True):
                  if html_heading_starts and offset <= html_heading_starts[0] < offset + len(raw_line):
                      return html_heading_starts[0]
                  if paragraph_start is not None:
          ''',
          )

          regression = Path("tests/test_pr4_seven_review_regressions.py")
          assert not regression.exists(), f"{regression} already exists"
          regression.write_text('''"""Exact regressions for the seven September PR4 review findings."""

          from pathlib import Path
          import runpy

          import pytest


          ROOT = Path(__file__).parent.parent
          POLICING_PATH = ROOT / "tests" / "test_policing_context_roadmap.py"
          REGISTRY_PATH = ROOT / "tests" / "test_research_reference_registry.py"
          WORKSTREAM_H_PATH = ROOT / "tests" / "test_workstream_h_methodology.py"
          PHASE2_PATH = ROOT / "tests" / "test_phase2_review_followup.py"

          policing = runpy.run_path(str(POLICING_PATH))
          registry = runpy.run_path(str(REGISTRY_PATH))
          workstream_h = runpy.run_path(str(WORKSTREAM_H_PATH))
          phase2 = runpy.run_path(str(PHASE2_PATH))


          @pytest.mark.parametrize(
              "wrapper",
              (
                  '<svg width="0" height="0"><text>{}</text></svg>',
                  '<math><mphantom>{}</mphantom></math>',
              ),
          )
          def test_registry_rejects_raw_svg_and_mathml_corpus_wide(wrapper):
              corpus = registry["CORPUS"].read_text(encoding="utf-8")
              phrase = "RESEARCH REFERENCE != REDISTRIBUTABLE DATA"
              assert phrase in corpus
              mutated = corpus.replace(phrase, wrapper.format(phrase), 1)
              with pytest.raises(AssertionError):
                  registry["_validate_registry_corpus"](mutated)


          @pytest.mark.parametrize("tag", ("rt", "rp"))
          def test_shared_reducer_models_ruby_implied_sibling_ends(tag):
              roadmap = policing["ROADMAP"].read_text(encoding="utf-8")
              payload = f'<ruby><{tag} hidden>masked<{tag}>Current sources may be skipped.</ruby>\\n'
              mutated = roadmap.replace(policing["WORKSTREAM_END"], "\\n" + payload + policing["WORKSTREAM_END"], 1)
              with pytest.raises(AssertionError):
                  policing["_validate_policing_workstream"](mutated)


          def test_workstream_h_rejects_type6_html_around_citation_markdown():
              roadmap = policing["ROADMAP"].read_text(encoding="utf-8")
              lines = roadmap.splitlines(keepends=True)
              index = next(i for i, line in enumerate(lines) if "[Australian slang dictionary]" in line)
              original = lines[index]
              lines[index] = "<div>\\n" + original.rstrip("\\r\\n") + "\\n\\n</div>\\n"
              mutated = "".join(lines)
              with pytest.raises(AssertionError):
                  workstream_h["_assert_workstream_h_integrity"](mutated)


          def test_nested_nobr_is_rejected_on_shared_and_registry_surfaces():
              payload = '<nobr hidden>masked<nobr>Current sources may be skipped.</nobr></nobr>'
              roadmap = policing["ROADMAP"].read_text(encoding="utf-8")
              mutated_roadmap = roadmap.replace(
                  policing["WORKSTREAM_END"], "\\n" + payload + "\\n" + policing["WORKSTREAM_END"], 1
              )
              with pytest.raises(AssertionError):
                  policing["_validate_policing_workstream"](mutated_roadmap)

              corpus = registry["CORPUS"].read_text(encoding="utf-8")
              status_end = "## Source-use rules"
              mutated_corpus = corpus.replace(status_end, payload + "\\n\\n" + status_end, 1)
              with pytest.raises(AssertionError):
                  registry["_validate_registry_corpus"](mutated_corpus)


          @pytest.mark.parametrize("tag", ("td", "head"))
          def test_discarded_in_body_hidden_tags_fail_closed(tag):
              roadmap = policing["ROADMAP"].read_text(encoding="utf-8")
              payload = f'<{tag} hidden>Current sources may be skipped.</{tag}>\\n'
              mutated = roadmap.replace(policing["WORKSTREAM_END"], "\\n" + payload + policing["WORKSTREAM_END"], 1)
              with pytest.raises(AssertionError):
                  policing["_validate_policing_workstream"](mutated)


          def test_phase2_notes_stop_at_multiline_raw_html_peer_heading():
              changelog = phase2["CHANGELOG"].read_text(encoding="utf-8")
              bullet = "- " + phase2["FREE_TEXT_IAA_BOUNDARY"]
              assert bullet in changelog
              mutated = changelog.replace(bullet, '<h2\\nid="x"></h2>\\n' + bullet, 1)
              assert phase2["_visible_phase2_notes"](mutated) != phase2["EXPECTED_VISIBLE_PHASE2_NOTES"]


          @pytest.mark.parametrize(
              "replacement",
              (
                  "source-gated&#32research proposal",
                  "source-gated&nbspresearch proposal",
              ),
          )
          def test_shared_reducer_rejects_semicolonless_html_only_references(replacement):
              roadmap = policing["ROADMAP"].read_text(encoding="utf-8")
              mutated = roadmap.replace("source-gated research proposal", replacement, 1)
              with pytest.raises(AssertionError):
                  policing["_validate_policing_workstream"](mutated)
          ''', encoding="utf-8")
          PY

      - name: Exact regression set
        run: PYTHONPATH=src pytest -q tests/test_pr4_seven_review_regressions.py

      - name: Dataset validation
        run: |
          PYTHONPATH=src python -m australian_for_ais.validation data/starter_dataset.jsonl
          PYTHONPATH=src python -m australian_for_ais.validation data/phase2_pilot_pack.jsonl

      - name: Full suite
        run: PYTHONPATH=src pytest -q

      - name: Whitespace check
        run: git diff --check

      - name: Commit repair and self-clean
        shell: bash
        run: |
          rm .github/workflows/pr4-seven-review-fixes.yml
          rm .github/workflows/pr4-seven-review-fixes-v2.yml
          git config user.name "EmergentMonk"
          git config user.email "73952179+EmergentMonk@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden governed rendering against seven review bypasses"
          git push origin HEAD:research-corpus-governed-expansion
