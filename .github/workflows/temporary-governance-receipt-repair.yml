name: Temporary governance receipt repair

on:
  push:
    branches: ["research-corpus-governed-expansion"]
    paths:
      - ".github/temporary-governance-receipt-trigger.txt"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Patch four governance receipt gaps
        run: python .github/temporary-governance-receipt-repair.py

      - name: Whitespace check
        run: git diff --check

      - name: Focused governance verification
        run: |
          pytest -q \
            tests/test_ascft_methodology_integrity.py \
            tests/test_research_reference_registry.py \
            tests/test_phase2_review_followup.py \
            tests/test_workstream_h_methodology.py \
            tests/test_policing_context_roadmap.py

      - name: Full suite
        run: pytest -q --disable-warnings --maxfail=1

      - name: Commit verified repair
        run: |
          git config user.name "EmergentMonk"
          git config user.email "73952179+EmergentMonk@users.noreply.github.com"
          git add tests/test_ascft_methodology_integrity.py tests/test_research_reference_registry.py tests/test_phase2_review_followup.py
          git diff --cached --check
          git commit -m "Bind remaining governance receipt structure"
          git push origin HEAD:research-corpus-governed-expansion
