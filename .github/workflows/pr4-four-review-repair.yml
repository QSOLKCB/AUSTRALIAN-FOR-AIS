name: PR4 four review repair

on:
  push:
    branches:
      - research-corpus-governed-expansion

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Preserve literal generated source
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/_repair_pr4_four.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'fence_block_pattern.subn(new_fence_block, text, count=1)': 'fence_block_pattern.subn(lambda _match: new_fence_block, text, count=1)',
              'strip_pattern.subn(new_strip, text, count=1)': 'strip_pattern.subn(lambda _match: new_strip, text, count=1)',
              'canonical_pattern.subn(new_canonical, text, count=1)': 'canonical_pattern.subn(lambda _match: new_canonical, text, count=1)',
          }
          for old, new in replacements.items():
              assert old in text, old
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply four review repairs
        run: python scripts/_repair_pr4_four.py

      - name: Run focused review regressions
        run: |
          python -m pytest -q \
            tests/test_research_reference_registry.py \
            tests/test_workstream_h_methodology.py

      - name: Run full test suite
        run: python -m pytest -q

      - name: Commit verified repairs and remove temporary files
        run: |
          rm .github/workflows/pr4-four-review-repair.yml
          rm scripts/_repair_pr4_four.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No repair changes to commit.'
            exit 0
          fi
          git commit -m 'Close four follow-up review gaps'
          git push origin HEAD:research-corpus-governed-expansion
