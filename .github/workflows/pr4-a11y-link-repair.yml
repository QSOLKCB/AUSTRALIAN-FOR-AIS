name: PR4 accessibility link repair

on:
  push:
    branches:
      - research-corpus-governed-expansion

permissions:
  contents: write

concurrency:
  group: repair-pr4-a11y-links
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify repair-only branch movement
        shell: bash
        run: |
          set -euo pipefail
          base='0af1e400845679ce5e9bf79cb4441d5c99fc5ce1'
          unexpected="$(git diff --name-only "$base" HEAD | grep -v -E '^\.github/(repair-pr4-a11y-links\.py|workflows/pr4-a11y-link-repair\.yml)$' || true)"
          test -z "$unexpected" || {
            echo "Refusing repair because substantive files moved since the reviewed head:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          }

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply guarded accessibility-link repair
        shell: bash
        run: |
          set -euo pipefail
          python .github/repair-pr4-a11y-links.py
          git diff --check

      - name: Run exact and focused governance regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_pr4_current_review_regressions.py \
            tests/test_policing_context_roadmap.py \
            tests/test_research_reference_registry.py

      - name: Validate datasets
        shell: bash
        run: |
          set -euo pipefail
          python -m australian_for_ais.cli validate data/starter/examples.jsonl
          python -m australian_for_ais.cli validate-pilot data/pilot/items.jsonl

      - name: Run full suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q

      - name: Commit verified repair and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          rm \
            .github/workflows/pr4-a11y-link-repair.yml \
            .github/repair-pr4-a11y-links.py
          git add \
            tests/test_policing_context_roadmap.py \
            tests/test_research_reference_registry.py \
            tests/test_pr4_current_review_regressions.py \
            .github/workflows/pr4-a11y-link-repair.yml \
            .github/repair-pr4-a11y-links.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Seal governed link accessibility metadata"
          git push origin HEAD:research-corpus-governed-expansion
