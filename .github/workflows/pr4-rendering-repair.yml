name: Guarded PR4 rendering repair

on:
  push:
    branches: [research-corpus-governed-expansion]
    paths:
      - scripts/_pr4_rendering_repair.py
      - scripts/_pr4_setext_followup.py
      - .github/workflows/pr4-rendering-repair.yml

permissions:
  contents: read

jobs:
  repair:
    if: github.repository == 'QSOLKCB/AUSTRALIAN-FOR-AIS' && github.ref == 'refs/heads/research-corpus-governed-expansion' && !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact repair base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = f774acd7a60d1b2aa9bc20f2a24f37cdb76512ad
          test "$(git hash-object .github/workflows/ci.yml)" = 2f7380017c0ad8b7b6a8b61f00b09c566b0bcdaa
          python -m pip install -e '.[dev]'
      - name: Reproduce, repair, and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python scripts/_pr4_rendering_repair.py
          python scripts/_pr4_setext_followup.py
          rm scripts/_pr4_rendering_repair.py scripts/_pr4_setext_followup.py .github/workflows/pr4-rendering-repair.yml
          git diff --check
      - name: Verify focused governance and data
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_governance_review_regressions.py tests/test_research_reference_registry.py tests/test_policing_context_roadmap.py tests/test_workstream_h_methodology.py tests/test_policing_contract_receipt.py tests/test_phase2_review_followup.py
          python -m australian_for_ais.cli validate data/starter/examples.jsonl
          python -m australian_for_ais.cli validate-pilot data/pilot/items.jsonl
      - name: Verify full suite and exact changed paths
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --junitxml=/tmp/pr4-after.xml
          git diff --check
          python - <<'PY'
          import subprocess
          expected = {
              'tests/test_governance_review_regressions.py',
              'tests/test_research_reference_registry.py',
              'tests/test_policing_context_roadmap.py',
              'tests/test_workstream_h_methodology.py',
              'tests/test_phase2_review_followup.py',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--name-only', 'd26fa93a03d57fd551adb42ba3916847a968e069'], text=True).splitlines())
          assert actual == expected, (actual, expected)
          print('Verified changed paths:', sorted(actual))
          PY
      - name: Publish verified repair without force
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tests/test_governance_review_regressions.py tests/test_research_reference_registry.py tests/test_policing_context_roadmap.py tests/test_workstream_h_methodology.py tests/test_phase2_review_followup.py scripts/_pr4_rendering_repair.py scripts/_pr4_setext_followup.py .github/workflows/pr4-rendering-repair.yml
          git commit -m 'Fix seven outstanding rendered-governance review findings'
          python - <<'PY'
          import base64, os, subprocess
          env = os.environ.copy()
          token = env.pop('GH_TOKEN')
          env['GIT_CONFIG_COUNT'] = '1'
          env['GIT_CONFIG_KEY_0'] = 'http.https://github.com/.extraheader'
          env['GIT_CONFIG_VALUE_0'] = 'AUTHORIZATION: basic ' + base64.b64encode(('x-access-token:' + token).encode()).decode()
          ref = 'refs/heads/research-corpus-governed-expansion'
          remote = subprocess.check_output(['git', 'ls-remote', 'origin', ref], env=env, text=True).split()[0]
          assert remote == os.environ['GITHUB_SHA'], 'PR head moved; refusing to publish stale repair'
          subprocess.run(['git', 'push', 'origin', 'HEAD:' + ref], env=env, check=True)
          PY
          printf 'VERIFIED_REPAIR_COMMIT='
          git rev-parse HEAD
          printf 'VERIFIED_REPAIR_TREE='
          git rev-parse HEAD^{tree}
