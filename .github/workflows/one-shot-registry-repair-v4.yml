name: Final one-shot registry parser repair
# Triggered after the workflow exists on the branch so GitHub can execute it.

on:
  push:
    branches: ["research-corpus-governed-expansion"]
    paths: [".github/workflows/one-shot-registry-repair-v4.yml"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0

      - name: Execute staged repair with line-based boundary freeze
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path(".github/workflows/one-shot-registry-repair.yml").read_text(encoding="utf-8")
          staged = workflow.split("python - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          script = textwrap.dedent(staged)

          freeze_start = script.index("for index, heading_match in enumerate(headings):")
          freeze_end = script.index("exact_literal =", freeze_start)
          freeze_replacement = '''for index, heading_match in enumerate(headings):
    heading = heading_match.group(0).strip()
    section_end = headings[index + 1].start() if index + 1 < len(headings) else len(batch)
    section = batch[heading_match.start():section_end]
    values: dict[str, str] = {}
    for field in boundary_fields:
        candidates = []
        for source_line in section.splitlines():
            stripped = source_line.lstrip(" ")
            if stripped.startswith(field):
                candidates.append(stripped[len(field):].strip())
        if len(candidates) != 1 or not candidates[0]:
            raise SystemExit(
                f"cannot freeze unique non-empty {field} for {heading}: {candidates!r}"
            )
        values[field] = candidates[0]
    exact[heading] = values

'''
          script = script[:freeze_start] + freeze_replacement + script[freeze_end:]
          exec(compile(script, "staged-registry-repair", "exec"), {"__name__": "__main__"})
          PY

      - name: Validate focused repair
        run: |
          python -m py_compile tests/test_research_reference_registry.py
          python -m pip install -e ".[dev]"
          pytest -q tests/test_research_reference_registry.py --disable-warnings --maxfail=1

      - name: Commit repair and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_research_reference_registry.py
          git rm .github/workflows/one-shot-registry-repair.yml
          git rm .github/workflows/one-shot-registry-repair-v3.yml
          git rm .github/workflows/one-shot-registry-repair-v4.yml
          git commit -m "Harden registry rendered Markdown semantics"
          git push origin HEAD:research-corpus-governed-expansion
