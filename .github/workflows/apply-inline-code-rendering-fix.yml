name: Apply inline rendering repair

on:
  push:
    branches:
      - research-corpus-governed-expansion
    paths:
      - .github/workflows/apply-inline-code-rendering-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0

      - name: Repair rendered inline-code handling
        shell: python
        run: |
          from pathlib import Path

          path = Path("tests/test_research_reference_registry.py")
          text = path.read_text(encoding="utf-8")

          old_visible = '''def _visible_inline_text(text: str) -> str:
              """Reduce Markdown/HTML metadata to its rendered visible text."""
              structural = _structural_registry_text(text)
              visible = MARKDOWN_LINK_PATTERN.sub(lambda match: match.group("label"), structural)
              visible = AUTOLINK_PATTERN.sub(lambda match: match.group("url"), visible)
              visible = HTML_TAG_PATTERN.sub(" ", visible)
              visible = html.unescape(visible)
              visible = visible.replace("`", "")
              visible = visible.replace("**", "").replace("__", "")
              visible = visible.replace("*", "").replace("_", "")
              return " ".join(visible.split())
          '''
          new_visible = '''def _render_inline_code_spans(text: str) -> str:
              """Replace same-line code spans with the text they visibly render."""
              parts: list[str] = []
              position = 0
              while position < len(text):
                  if text[position] != "`":
                      parts.append(text[position])
                      position += 1
                      continue
                  run_end = position
                  while run_end < len(text) and text[run_end] == "`":
                      run_end += 1
                  marker = text[position:run_end]
                  close = text.find(marker, run_end)
                  if close < 0:
                      parts.append(marker)
                      position = run_end
                      continue
                  parts.append(text[run_end:close].strip(" "))
                  position = close + len(marker)
              return "".join(parts)


          def _visible_inline_text(text: str) -> str:
              """Reduce Markdown/HTML metadata to its rendered visible text."""
              rendered = _rendered_registry_text(text)
              visible = _render_inline_code_spans(rendered)
              visible = MARKDOWN_LINK_PATTERN.sub(lambda match: match.group("label"), visible)
              visible = AUTOLINK_PATTERN.sub(lambda match: match.group("url"), visible)
              visible = HTML_TAG_PATTERN.sub(" ", visible)
              visible = html.unescape(visible)
              visible = visible.replace("**", "").replace("__", "")
              visible = visible.replace("*", "").replace("_", "")
              return " ".join(visible.split())
          '''
          assert old_visible in text
          text = text.replace(old_visible, new_visible, 1)

          old_scalar = '''def _scalar_value(entry: str, section: str, field: str) -> str:
              structure = _structural_registry_text(section)
              prefix = rf"(?m)^ {{0,3}}{re.escape(field)}"
              occurrences = list(re.finditer(prefix, structure))
              assert len(occurrences) == 1, (
                  f"{entry} must contain exactly one mandatory field {field}"
              )
              match = re.search(
                  rf"{prefix}[ \\t]*([^\\r\\n]*\\S[^\\r\\n]*)[ \\t]*$",
                  structure,
              )
              assert match, f"{entry} has an empty mandatory field {field}"
              value = _visible_inline_text(match.group(1))
              assert value, f"{entry} has an empty mandatory field {field}"
              return value
          '''
          new_scalar = '''def _scalar_value(entry: str, section: str, field: str) -> str:
              rendered, structure = _markdown_views(section)
              prefix = rf"(?m)^ {{0,3}}{re.escape(field)}"
              occurrences = list(re.finditer(prefix, structure))
              assert len(occurrences) == 1, (
                  f"{entry} must contain exactly one mandatory field {field}"
              )
              match = re.search(
                  rf"{prefix}[ \\t]*([^\\r\\n]*\\S[^\\r\\n]*)[ \\t]*$",
                  structure,
              )
              assert match, f"{entry} has an empty mandatory field {field}"
              raw_value = rendered[match.start(1):match.end(1)]
              value = _visible_inline_text(raw_value)
              assert value, f"{entry} has an empty mandatory field {field}"
              return value
          '''
          assert old_scalar in text
          text = text.replace(old_scalar, new_scalar, 1)

          text = text.replace(
              'with pytest.raises(AssertionError, match="no usable HTTPS destination"):\n'
              '        _require_registered_source_link("### Example", inline)',
              'with pytest.raises(AssertionError, match="empty registered-source field"):\n'
              '        _require_registered_source_link("### Example", inline)',
              1,
          )

          hidden_scalar_case = '''        (
              "### Example\\n\\n"
              "**Rights and provenance boundary:** `hidden value`\\n",
              RIGHTS_FIELD,
              "empty mandatory field",
          ),
          '''
          assert hidden_scalar_case in text
          text = text.replace(hidden_scalar_case, "", 1)

          hidden_governance_case = '''
              hidden = (
                  "### Example\\n\\n"
                  "**Community-specific governance:** not-required: `hidden`\\n"
              )
              with pytest.raises(AssertionError, match="invalid community-specific governance"):
                  _require_community_governance("### Example", hidden)
          '''
          assert hidden_governance_case in text
          text = text.replace(hidden_governance_case, "", 1)

          path.write_text(text, encoding="utf-8")

      - name: Run focused registry tests
        run: python -m pytest -q tests/test_research_reference_registry.py

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_research_reference_registry.py
          git commit -m "Render inline code correctly in registry fields"
          git push origin HEAD:research-corpus-governed-expansion
