name: Temporary fix governance runner

on:
  push:
    branches: ["research-corpus-governed-expansion"]
    paths:
      - ".github/temporary-fix-governance-runner-trigger.txt"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0
      - name: Fix EOF formatting in repair runner
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/temporary-governance-receipt-repair.yml')
          text = path.read_text(encoding='utf-8')
          old = 'ascft = ascft.rstrip() + ascft_test + "\\n"'
          new = 'ascft = ascft.rstrip() + ascft_test.rstrip() + "\\n"'
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Commit runner fix
        run: |
          git config user.name "EmergentMonk"
          git config user.email "73952179+EmergentMonk@users.noreply.github.com"
          git add .github/workflows/temporary-governance-receipt-repair.yml
          git commit -m "Fix temporary governance repair formatting"
          git push origin HEAD:research-corpus-governed-expansion
