name: Repair PR4 accessibility and implied HTML v4

on:
  push:
    branches: ["research-corpus-governed-expansion"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply reviewed governance patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source_workflow = Path('.github/workflows/repair-pr4-accessibility-implied-html-v2.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          script = source_workflow.split(marker, 1)[1].split("\n          PY\n", 1)[0]
          exec(compile(textwrap.dedent(script), '<v2-repair-script>', 'exec'))

          path = Path('tests/test_policing_context_roadmap.py')
          text = path.read_text(encoding='utf-8')
          old = '''def _rendered_policing_workstream(roadmap: str) -> str:
              try:
                  # Global styles and ancestor direction can affect a section even when
                  # their source lies outside its heading boundaries.
                  _assert_supported_governed_html(_governed_surface_html_violations(roadmap))
                  structure = _rendered_structure(roadmap)
                  start, _ = _visible_markdown_heading_span(structure, WORKSTREAM_HEADING)
              except AssertionError as exc:
                  raise AssertionError("rendered policing workstream is missing; missing policing-workstream safeguard") from exc
          '''
          new = '''def _rendered_policing_workstream(roadmap: str) -> str:
              try:
                  # Global styles and ancestor direction can affect a section even when
                  # their source lies outside its heading boundaries.
                  _assert_supported_governed_html(_governed_surface_html_violations(roadmap))
                  structure = _rendered_structure(roadmap)
                  start, _ = _visible_markdown_heading_span(structure, WORKSTREAM_HEADING)
              except AssertionError as exc:
                  # Preserve the established generic safeguard diagnostic for legacy
                  # rendering-policy failures while allowing the newly migrated form
                  # control preflight to retain its specific contract.
                  if "interactive form control HTML" in str(exc):
                      raise
                  raise AssertionError("rendered policing workstream is missing; missing policing-workstream safeguard") from exc
          '''
          if old not in text:
              raise SystemExit('policing workstream diagnostic anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Check patch whitespace
        run: git diff --check

      - name: Run focused governance tests
        run: |
          pytest -q \
            tests/test_policing_context_roadmap.py \
            tests/test_research_reference_registry.py \
            tests/test_pr4_latest_governance_regressions.py

      - name: Validate datasets
        run: |
          python -m australian_for_ais.cli validate data/starter/examples.jsonl
          python -m australian_for_ais.cli validate-pilot data/pilot/items.jsonl

      - name: Run full suite
        run: pytest -q --disable-warnings --maxfail=1

      - name: Commit verified repair and self-clean
        run: |
          git rm .github/workflows/repair-pr4-accessibility-implied-html-v4.yml
          git add tests/test_policing_context_roadmap.py tests/test_pr4_latest_governance_regressions.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Harden governed accessibility and HTML state"
          git push origin HEAD:research-corpus-governed-expansion
