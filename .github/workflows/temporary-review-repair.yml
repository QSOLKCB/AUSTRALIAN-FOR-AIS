name: Temporary PR4 review repair

on:
  push:
    branches: [research-corpus-governed-expansion]
    paths: [.github/temporary-review-repair-trigger.txt]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify repair base
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only c1f85e8f8aa85471c4063727bc7c345f6bc26dd1..HEAD | sort > /tmp/changed.txt
          python - <<'PY'
          from pathlib import Path
          allowed = {'.github/workflows/temporary-review-repair.yml', '.github/temporary-review-repair-trigger.txt'}
          changed = {x.strip() for x in Path('/tmp/changed.txt').read_text().splitlines() if x.strip()}
          assert not changed - allowed, f'unexpected pre-repair changes: {sorted(changed - allowed)}'
          PY
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Apply receipt hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, re, runpy

          # --- Workstream H: raw-anchor rejection + ordered record seal ---
          hp = Path('tests/test_workstream_h_methodology.py')
          h = hp.read_text(encoding='utf-8')

          if 'WORKSTREAM_H_RECORDS_SHA256' not in h:
              m = re.search(r'(?m)^(WORKSTREAM_H_VISIBLE_SHA256\s*=\s*"[0-9a-f]{64}")$', h)
              assert m
              h = h[:m.end()] + '\nWORKSTREAM_H_RECORDS_SHA256 = "__WORKSTREAM_H_RECORDS_SHA256__"' + h[m.end():]

          helper_marker = '\n\ndef _rendered_inline_citation_links(\n'
          raw_anchor_helper = '''\n\nclass _RawAnchorDetector(HTMLParser):\n    """Detect live raw-HTML anchors before Markdown-link masking."""\n\n    def __init__(self) -> None:\n        super().__init__(convert_charrefs=True)\n        self.hrefs: list[str] = []\n\n    def _record(self, tag: str, attrs: list[tuple[str, str | None]]) -> None:\n        if tag.lower() == "a":\n            for key, value in attrs:\n                if key.lower() == "href":\n                    self.hrefs.append(value or "")\n                    break\n\n    def handle_starttag(self, tag: str, attrs: list[tuple[str, str | None]]) -> None:\n        self._record(tag, attrs)\n\n    def handle_startendtag(self, tag: str, attrs: list[tuple[str, str | None]]) -> None:\n        self._record(tag, attrs)\n\n\ndef _raw_html_anchor_hrefs(text: str) -> tuple[str, ...]:\n    parser = _RawAnchorDetector()\n    parser.feed(text)\n    parser.close()\n    return tuple(parser.hrefs)\n'''
          assert helper_marker in h
          if 'class _RawAnchorDetector' not in h:
              h = h.replace(helper_marker, raw_anchor_helper + helper_marker, 1)

          old = '''    assert not registry["_contains_inert_html"](structure), (\n        "Workstream H citations must not depend on inert, non-navigable HTML"\n    )\n    structure = registry["_mask_raw_html_tags_for_markdown_link_discovery"](structure)\n'''
          new = '''    assert not registry["_contains_inert_html"](structure), (\n        "Workstream H citations must not depend on inert, non-navigable HTML"\n    )\n    raw_anchor_hrefs = _raw_html_anchor_hrefs(structure)\n    assert not raw_anchor_hrefs, (\n        "Workstream H raw HTML anchors are not allowed; "\n        f"got {raw_anchor_hrefs!r}"\n    )\n    structure = registry["_mask_raw_html_tags_for_markdown_link_discovery"](structure)\n'''
          if 'raw_anchor_hrefs = _raw_html_anchor_hrefs(structure)' not in h:
              assert old in h
              h = h.replace(old, new, 1)

          hash_tail = '''    assert actual_hash == WORKSTREAM_H_VISIBLE_SHA256, (\n        "browser-visible Workstream H changed: expected hash "\n        f"{WORKSTREAM_H_VISIBLE_SHA256!r}, got {actual_hash!r}"\n    )\n    return section\n'''
          sealed_tail = '''    assert actual_hash == WORKSTREAM_H_VISIBLE_SHA256, (\n        "browser-visible Workstream H changed: expected hash "\n        f"{WORKSTREAM_H_VISIBLE_SHA256!r}, got {actual_hash!r}"\n    )\n    record_value = "\\n".join(\n        f"{signature}\\x1f{line}" for signature, line in visible_records\n    )\n    actual_record_hash = hashlib.sha256(record_value.encode("utf-8")).hexdigest()\n    assert actual_record_hash == WORKSTREAM_H_RECORDS_SHA256, (\n        "browser-visible Workstream H record boundaries changed: expected hash "\n        f"{WORKSTREAM_H_RECORDS_SHA256!r}, got {actual_record_hash!r}"\n    )\n    return section\n'''
          if 'actual_record_hash = hashlib.sha256(record_value.encode("utf-8")).hexdigest()' not in h:
              assert hash_tail in h
              h = h.replace(hash_tail, sealed_tail, 1)

          tests = '''\n\ndef test_workstream_h_record_boundaries_are_pinned():\n    roadmap = ROADMAP.read_text(encoding="utf-8")\n    _assert_workstream_h_integrity(roadmap)\n    preceding = (\n        "- connect suitable tests to Phase 5 adversarial context swaps and Phase 7 "\n        "cross-dialect/cross-register comparison;"\n    )\n    boundary = (\n        "- keep any military claims limited to what official or archival evidence "\n        "actually demonstrates."\n    )\n    canonical = preceding + "\\n" + boundary\n    assert canonical in roadmap\n    mutated = roadmap.replace(canonical, preceding + " " + boundary, 1)\n    with pytest.raises(AssertionError, match="record boundaries changed"):\n        _assert_workstream_h_integrity(mutated)\n\n\ndef test_workstream_h_rejects_raw_html_anchor_attribution():\n    roadmap = ROADMAP.read_text(encoding="utf-8")\n    phrase = "local language, terminology, accent, and slang"\n    assert phrase in roadmap\n    mutated = roadmap.replace(\n        phrase,\n        f'<a href="https://example.com/unregistered">{phrase}</a>',\n        1,\n    )\n    with pytest.raises(AssertionError, match="raw HTML anchors are not allowed"):\n        _assert_workstream_h_integrity(mutated)\n'''
          tm = '\n\ndef _trans_tasman_raw(text: str) -> str:\n'
          assert tm in h
          if 'def test_workstream_h_record_boundaries_are_pinned' not in h:
              h = h.replace(tm, tests + tm, 1)
          hp.write_text(h, encoding='utf-8')

          # --- Registry: seal the complete reader-visible trailing corpus ---
          rp = Path('tests/test_research_reference_registry.py')
          r = rp.read_text(encoding='utf-8')
          if 'REGISTRY_TRAILING_VISIBLE_SHA256' not in r:
              m = re.search(r'(?m)^(SOURCE_USE_SECTION_HASH\s*=\s*[\"\'][0-9a-f]{64}[\"\'])$', r)
              assert m
              r = r[:m.end()] + '\nREGISTRY_TRAILING_VISIBLE_SHA256 = "__REGISTRY_TRAILING_VISIBLE_SHA256__"' + r[m.end():]

          vm = '\n\ndef _validate_registry_corpus(corpus: str) -> None:\n'
          helper = '''\n\ndef _normalised_registry_trailing_value(corpus: str) -> str:\n    """Return browser-visible registry content from the post-batch boundary to EOF."""\n    rendered, structure = _markdown_views(corpus)\n    start, _ = _visible_markdown_heading_span(structure, BATCH_END)\n    return _visible_inline_text(rendered[start:])\n'''
          assert vm in r
          if 'def _normalised_registry_trailing_value' not in r:
              r = r.replace(vm, helper + vm, 1)

          inert = '''    assert "accessibility-inert" not in _SHARED_HTML_PREFLIGHT(corpus), (\n        "native inert accessibility suppression is not allowed in governed documents"\n    )\n'''
          seal = '''    assert "accessibility-inert" not in _SHARED_HTML_PREFLIGHT(corpus), (\n        "native inert accessibility suppression is not allowed in governed documents"\n    )\n\n    visible_trailing = _normalised_registry_trailing_value(corpus)\n    actual_trailing_hash = hashlib.sha256(visible_trailing.encode("utf-8")).hexdigest()\n    assert actual_trailing_hash == REGISTRY_TRAILING_VISIBLE_SHA256, (\n        "browser-visible trailing registry content changed outside the governed receipts: "\n        f"expected hash {REGISTRY_TRAILING_VISIBLE_SHA256!r}, got {actual_trailing_hash!r}"\n    )\n'''
          if 'actual_trailing_hash = hashlib.sha256(visible_trailing.encode("utf-8")).hexdigest()' not in r:
              assert inert in r
              r = r.replace(inert, seal, 1)

          marker = '\ndef test_post_phase2_registry_batch_preserves_governance_contract():\n'
          regression = '''\n\ndef test_trailing_registry_visible_corpus_is_pinned():\n    corpus = CORPUS.read_text(encoding="utf-8")\n    _validate_registry_corpus(corpus)\n    mutated = (\n        corpus.rstrip()\n        + "\\n\\nAll registered sources may be copied freely into benchmark data.\\n"\n    )\n    with pytest.raises(AssertionError, match="browser-visible trailing registry content changed"):\n        _validate_registry_corpus(mutated)\n\n'''
          assert marker in r
          if 'def test_trailing_registry_visible_corpus_is_pinned' not in r:
              r = r.replace(marker, regression + marker, 1)
          rp.write_text(r, encoding='utf-8')

          # Compute canonical fixtures after helpers are in place.
          hns = runpy.run_path(str(hp))
          roadmap = Path('ROADMAP.md').read_text(encoding='utf-8')
          raw_h = hns['_workstream_h_raw'](roadmap)
          pns = runpy.run_path('tests/test_policing_context_roadmap.py')
          records = pns['_normalised_visible_workstream_records'](raw_h)
          record_value = '\n'.join(f'{signature}\x1f{line}' for signature, line in records)
          record_hash = hashlib.sha256(record_value.encode()).hexdigest()

          rns = runpy.run_path(str(rp))
          corpus = Path('docs/RESEARCH-REFERENCE-CORPUS.md').read_text(encoding='utf-8')
          trailing = rns['_normalised_registry_trailing_value'](corpus)
          trailing_hash = hashlib.sha256(trailing.encode()).hexdigest()

          h = hp.read_text(encoding='utf-8').replace('__WORKSTREAM_H_RECORDS_SHA256__', record_hash, 1)
          r = rp.read_text(encoding='utf-8').replace('__REGISTRY_TRAILING_VISIBLE_SHA256__', trailing_hash, 1)
          hp.write_text(h, encoding='utf-8')
          rp.write_text(r, encoding='utf-8')
          print('record hash', record_hash)
          print('trailing hash', trailing_hash)
          PY
      - name: Focused regression suite
        run: python -m pytest -q tests/test_workstream_h_methodology.py tests/test_research_reference_registry.py
      - name: Full test suite
        run: python -m pytest -q
      - name: Whitespace check
        run: git diff --check
      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EmergentMonk"
          git config user.email "73952179+EmergentMonk@users.noreply.github.com"
          git add tests/test_workstream_h_methodology.py tests/test_research_reference_registry.py
          git commit -m "Seal remaining governed receipt boundaries"
          git push origin HEAD:research-corpus-governed-expansion
