name: Temporary PR4 review repair

on:
  push:
    branches:
      - research-corpus-governed-expansion
    paths:
      - .github/temporary-review-repair-trigger.txt

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify repair base
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only c1f85e8f8aa85471c4063727bc7c345f6bc26dd1..HEAD | sort > /tmp/changed.txt
          cat /tmp/changed.txt
          python - <<'PY'
          from pathlib import Path
          allowed = {
              '.github/workflows/temporary-review-repair.yml',
              '.github/temporary-review-repair-trigger.txt',
          }
          changed = {line.strip() for line in Path('/tmp/changed.txt').read_text().splitlines() if line.strip()}
          unexpected = changed - allowed
          assert not unexpected, f'unexpected branch changes before repair: {sorted(unexpected)}'
          PY

      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Apply receipt hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re
          import runpy

          h_path = Path('tests/test_workstream_h_methodology.py')
          h = h_path.read_text(encoding='utf-8')

          if 'WORKSTREAM_H_RECORDS_SHA256' not in h:
              match = re.search(r'(?m)^(WORKSTREAM_H_VISIBLE_SHA256\s*=\s*"[0-9a-f]{64}")$', h)
              assert match, 'Workstream H visible-hash anchor not found'
              h = h[:match.end()] + '\nWORKSTREAM_H_RECORDS_SHA256 = "__WORKSTREAM_H_RECORDS_SHA256__"' + h[match.end():]

          raw_anchor_helper = '''\n\nclass _RawAnchorDetector(HTMLParser):\n    """Detect live raw-HTML anchors before Markdown-link masking."""\n\n    def __init__(self) -> None:\n        super().__init__(convert_charrefs=True)\n        self.hrefs: list[str] = []\n\n    def _record(self, tag: str, attrs: list[tuple[str, str | None]]) -> None:\n        if tag.lower() != "a":\n            return\n        for key, value in attrs:\n            if key.lower() == "href":\n                self.hrefs.append(value or "")\n                return\n\n    def handle_starttag(self, tag: str, attrs: list[tuple[str, str | None]]) -> None:\n        self._record(tag, attrs)\n\n    def handle_startendtag(self, tag: str, attrs: list[tuple[str, str | None]]) -> None:\n        self._record(tag, attrs)\n\n\ndef _raw_html_anchor_hrefs(text: str) -> tuple[str, ...]:\n    parser = _RawAnchorDetector()\n    parser.feed(text)\n    parser.close()\n    return tuple(parser.hrefs)\n'''
          marker = '\n\ndef _rendered_inline_citation_links(\n'
          assert marker in h, 'citation helper insertion anchor not found'
          if 'class _RawAnchorDetector' not in h:
              h = h.replace(marker, raw_anchor_helper + marker, 1)

          inert_block = '''    assert not registry["_contains_inert_html"](structure), (\n        "Workstream H citations must not depend on inert, non-navigable HTML"\n    )\n    structure = registry["_mask_raw_html_tags_for_markdown_link_discovery"](structure)\n'''
          hardened_inert_block = '''    assert not registry["_contains_inert_html"](structure), (\n        "Workstream H citations must not depend on inert, non-navigable HTML"\n    )\n    raw_anchor_hrefs = _raw_html_anchor_hrefs(structure)\n    assert not raw_anchor_hrefs, (\n        "Workstream H raw HTML anchors are not allowed; "\n        f"got {raw_anchor_hrefs!r}"\n    )\n    structure = registry["_mask_raw_html_tags_for_markdown_link_discovery"](structure)\n'''
          if 'raw_anchor_hrefs = _raw_html_anchor_hrefs(structure)' not in h:
              assert inert_block in h, 'raw-anchor hardening anchor not found'
              h = h.replace(inert_block, hardened_inert_block, 1)

          hierarchy_block = '''    assert not unsupported_containers, (\n        "browser-visible Workstream H list/container hierarchy changed: "\n        f"{unsupported_containers!r}"\n    )\n    value = " ".join(section.split())\n'''
          sealed_hierarchy_block = '''    assert not unsupported_containers, (\n        "browser-visible Workstream H list/container hierarchy changed: "\n        f"{unsupported_containers!r}"\n    )\n    record_value = "\\n".join(\n        f"{signature}\\x1f{line}" for signature, line in visible_records\n    )\n    actual_record_hash = hashlib.sha256(record_value.encode("utf-8")).hexdigest()\n    assert actual_record_hash == WORKSTREAM_H_RECORDS_SHA256, (\n        "browser-visible Workstream H record boundaries changed: expected hash "\n        f"{WORKSTREAM_H_RECORDS_SHA256!r}, got {actual_record_hash!r}"\n    )\n    value = " ".join(section.split())\n'''
          if 'actual_record_hash = hashlib.sha256(record_value.encode("utf-8")).hexdigest()' not in h:
              assert hierarchy_block in h, 'record-seal anchor not found'
              h = h.replace(hierarchy_block, sealed_hierarchy_block, 1)

          new_h_tests = '''\n\ndef test_workstream_h_record_boundaries_are_pinned():\n    roadmap = ROADMAP.read_text(encoding="utf-8")\n    _assert_workstream_h_integrity(roadmap)\n    preceding = (\n        "- connect suitable tests to Phase 5 adversarial context swaps and Phase 7 "\n        "cross-dialect/cross-register comparison;"\n    )\n    boundary = (\n        "- keep any military claims limited to what official or archival evidence "\n        "actually demonstrates."\n    )\n    canonical = preceding + "\\n" + boundary\n    assert canonical in roadmap\n    mutated = roadmap.replace(canonical, preceding + " " + boundary, 1)\n    with pytest.raises(AssertionError, match="record boundaries changed"):\n        _assert_workstream_h_integrity(mutated)\n\n\ndef test_workstream_h_rejects_raw_html_anchor_attribution():\n    roadmap = ROADMAP.read_text(encoding="utf-8")\n    phrase = "local language, terminology, accent, and slang"\n    assert phrase in roadmap\n    mutated = roadmap.replace(\n        phrase,\n        f'<a href="https://example.com/unregistered">{phrase}</a>',\n        1,\n    )\n    with pytest.raises(AssertionError, match="raw HTML anchors are not allowed"):\n        _assert_workstream_h_integrity(mutated)\n'''
          trans_marker = '\n\ndef _trans_tasman_raw(text: str) -> str:\n'
          assert trans_marker in h, 'Workstream H regression insertion anchor not found'
          if 'def test_workstream_h_record_boundaries_are_pinned' not in h:
              h = h.replace(trans_marker, new_h_tests + trans_marker, 1)

          h_path.write_text(h, encoding='utf-8')

          r_path = Path('tests/test_research_reference_registry.py')
          r = r_path.read_text(encoding='utf-8')
          if 'REGISTRY_VISIBLE_CORPUS_SHA256' not in r:
              match = re.search(r'(?m)^(SOURCE_USE_SECTION_HASH\s*=\s*[\"\'][0-9a-f]{64}[\"\'])$', r)
              assert match, 'source-use hash anchor not found'
              r = r[:match.end()] + '\nREGISTRY_VISIBLE_CORPUS_SHA256 = "__REGISTRY_VISIBLE_CORPUS_SHA256__"' + r[match.end():]

          validator_marker = '\n\ndef _validate_registry_corpus(corpus: str) -> None:\n'
          assert validator_marker in r, 'registry validator anchor not found'
          corpus_helper = '''\n\ndef _normalised_registry_visible_value(corpus: str) -> str:\n    """Return the complete browser-visible registry corpus for final sealing."""\n    return _visible_inline_text(corpus)\n'''
          if 'def _normalised_registry_visible_value' not in r:
              r = r.replace(validator_marker, corpus_helper + validator_marker, 1)

          inert_tail = '''    assert "accessibility-inert" not in _SHARED_HTML_PREFLIGHT(corpus), (\n        "native inert accessibility suppression is not allowed in governed documents"\n    )\n'''
          corpus_seal_tail = '''    assert "accessibility-inert" not in _SHARED_HTML_PREFLIGHT(corpus), (\n        "native inert accessibility suppression is not allowed in governed documents"\n    )\n\n    visible_corpus = _normalised_registry_visible_value(corpus)\n    actual_corpus_hash = hashlib.sha256(visible_corpus.encode("utf-8")).hexdigest()\n    assert actual_corpus_hash == REGISTRY_VISIBLE_CORPUS_SHA256, (\n        "browser-visible registry corpus changed outside the governed receipts: "\n        f"expected hash {REGISTRY_VISIBLE_CORPUS_SHA256!r}, got {actual_corpus_hash!r}"\n    )\n'''
          if 'actual_corpus_hash = hashlib.sha256(visible_corpus.encode("utf-8")).hexdigest()' not in r:
              assert inert_tail in r, 'registry final-seal anchor not found'
              r = r.replace(inert_tail, corpus_seal_tail, 1)

          registry_test_marker = '\ndef test_post_phase2_registry_batch_preserves_governance_contract():\n'
          assert registry_test_marker in r, 'registry regression insertion anchor not found'
          registry_test = '''\n\ndef test_complete_registry_visible_corpus_is_pinned():\n    corpus = CORPUS.read_text(encoding="utf-8")\n    _validate_registry_corpus(corpus)\n    mutated = (\n        corpus.rstrip()\n        + "\\n\\nAll registered sources may be copied freely into benchmark data.\\n"\n    )\n    with pytest.raises(AssertionError, match="browser-visible registry corpus changed"):\n        _validate_registry_corpus(mutated)\n\n'''
          if 'def test_complete_registry_visible_corpus_is_pinned' not in r:
              r = r.replace(registry_test_marker, registry_test + registry_test_marker, 1)

          r_path.write_text(r, encoding='utf-8')

          # Compute the two new fixtures from the unchanged canonical documents.
          h_ns = runpy.run_path(str(h_path))
          roadmap = Path('ROADMAP.md').read_text(encoding='utf-8')
          raw_h = h_ns['_workstream_h_raw'](roadmap)
          policing = runpy.run_path('tests/test_policing_context_roadmap.py')
          records = policing['_normalised_visible_workstream_records'](raw_h)
          record_value = '\n'.join(f'{signature}\x1f{line}' for signature, line in records)
          record_hash = hashlib.sha256(record_value.encode('utf-8')).hexdigest()

          r_ns = runpy.run_path(str(r_path))
          corpus = Path('docs/RESEARCH-REFERENCE-CORPUS.md').read_text(encoding='utf-8')
          corpus_value = r_ns['_normalised_registry_visible_value'](corpus)
          corpus_hash = hashlib.sha256(corpus_value.encode('utf-8')).hexdigest()

          h = h_path.read_text(encoding='utf-8')
          assert '__WORKSTREAM_H_RECORDS_SHA256__' in h
          h = h.replace('__WORKSTREAM_H_RECORDS_SHA256__', record_hash, 1)
          h_path.write_text(h, encoding='utf-8')

          r = r_path.read_text(encoding='utf-8')
          assert '__REGISTRY_VISIBLE_CORPUS_SHA256__' in r
          r = r.replace('__REGISTRY_VISIBLE_CORPUS_SHA256__', corpus_hash, 1)
          r_path.write_text(r, encoding='utf-8')

          print('WORKSTREAM_H_RECORDS_SHA256=', record_hash)
          print('REGISTRY_VISIBLE_CORPUS_SHA256=', corpus_hash)
          PY

      - name: Focused regression suite
        run: python -m pytest -q tests/test_workstream_h_methodology.py tests/test_research_reference_registry.py

      - name: Full test suite
        run: python -m pytest -q

      - name: Whitespace check
        run: git diff --check

      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EmergentMonk"
          git config user.email "73952179+EmergentMonk@users.noreply.github.com"
          git add tests/test_workstream_h_methodology.py tests/test_research_reference_registry.py
          if git diff --cached --quiet; then
            echo "No repair changes to commit"
            exit 0
          fi
          git commit -m "Seal remaining governed receipt boundaries"
          git push origin HEAD:research-corpus-governed-expansion
