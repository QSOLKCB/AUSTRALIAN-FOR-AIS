name: Guarded PR4 global rendering repair

on:
  push:
    branches: [research-corpus-governed-expansion]
    paths:
      - scripts/_pr4_global_rendering_repair.py
      - .github/workflows/pr4-global-rendering-repair.yml

permissions:
  contents: read

jobs:
  repair:
    if: github.repository == 'QSOLKCB/AUSTRALIAN-FOR-AIS' && github.ref == 'refs/heads/research-corpus-governed-expansion' && !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact repair base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 728a0a71d7508e23903fa79a93c25cd6f07a19f8
          test "$(git hash-object .github/workflows/ci.yml)" = 2f7380017c0ad8b7b6a8b61f00b09c566b0bcdaa
          python -m pip install -e '.[dev]'
      - name: Reproduce all three reported findings
        shell: bash
        run: |
          python - <<'PY'
          import subprocess, sys, xml.etree.ElementTree as ET
          result = subprocess.run([
              sys.executable, '-m', 'pytest', '-q', '--tb=short',
              'tests/test_pr4_global_rendering_regressions.py', '-k', 'test_reported_',
              '--junitxml=/tmp/pr4-global-before.xml',
          ], check=False)
          root = ET.parse('/tmp/pr4-global-before.xml').getroot()
          cases = list(root.iter('testcase'))
          failures = [c for c in cases if c.find('failure') is not None]
          assert result.returncode == 1 and not list(root.iter('error'))
          assert len(cases) == len(failures) == 3, (len(cases), len(failures))
          print('BEFORE_REPAIR: all three reported bypasses reproduced', flush=True)
          PY
      - name: Apply guarded patch and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python scripts/_pr4_global_rendering_repair.py
          rm scripts/_pr4_global_rendering_repair.py .github/workflows/pr4-global-rendering-repair.yml
          git diff --check
      - name: Verify focused governance and datasets
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --tb=short tests/test_pr4_global_rendering_regressions.py tests/test_pr4_shared_html_regressions.py tests/test_pr4_source_binding_regressions.py tests/test_governance_review_regressions.py tests/test_research_reference_registry.py tests/test_policing_context_roadmap.py tests/test_workstream_h_methodology.py tests/test_policing_contract_receipt.py tests/test_phase2_review_followup.py
          python -m australian_for_ais.cli validate data/starter/examples.jsonl
          python -m australian_for_ais.cli validate-pilot data/pilot/items.jsonl
      - name: Verify full suite and exact changed paths
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --tb=short --junitxml=/tmp/pr4-global-after.xml
          git diff --check
          python - <<'PY'
          import ast, subprocess
          from pathlib import Path
          base = '728a0a71d7508e23903fa79a93c25cd6f07a19f8'
          expected = {
              'tests/test_pr4_global_rendering_regressions.py',
              'tests/test_policing_context_roadmap.py',
              'tests/test_workstream_h_methodology.py',
              'tests/test_policing_contract_receipt.py',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--name-only', base], text=True).splitlines())
          assert actual == expected, (actual, expected)
          for name in expected - {'tests/test_pr4_global_rendering_regressions.py'}:
              old = ast.parse(subprocess.check_output(['git', 'show', base + ':' + name], text=True))
              new = ast.parse(Path(name).read_text(encoding='utf-8'))
              old_tests = {n.name: ast.dump(n) for n in old.body if isinstance(n, ast.FunctionDef) and n.name.startswith('test_')}
              new_tests = {n.name: ast.dump(n) for n in new.body if isinstance(n, ast.FunctionDef) and n.name.startswith('test_')}
              assert old_tests == new_tests, 'Existing tests changed: ' + name
          print('Verified exact changed paths and unchanged existing tests:', sorted(actual))
          PY
      - name: Publish verified repair without force
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tests/test_pr4_global_rendering_regressions.py tests/test_policing_context_roadmap.py tests/test_workstream_h_methodology.py tests/test_policing_contract_receipt.py scripts/_pr4_global_rendering_repair.py .github/workflows/pr4-global-rendering-repair.yml
          git commit -m 'Reject global stylesheet, MathML and bidirectional governance bypasses'
          python - <<'PY'
          import base64, os, subprocess
          env = os.environ.copy()
          token = env.pop('GH_TOKEN')
          env['GIT_CONFIG_COUNT'] = '1'
          env['GIT_CONFIG_KEY_0'] = 'http.https://github.com/.extraheader'
          env['GIT_CONFIG_VALUE_0'] = 'AUTHORIZATION: basic ' + base64.b64encode(('x-access-token:' + token).encode()).decode()
          ref = 'refs/heads/research-corpus-governed-expansion'
          remote = subprocess.check_output(['git', 'ls-remote', 'origin', ref], env=env, text=True).split()[0]
          assert remote == os.environ['GITHUB_SHA'], 'PR head moved; refusing stale repair'
          subprocess.run(['git', 'push', 'origin', 'HEAD:' + ref], env=env, check=True)
          PY
          printf 'VERIFIED_REPAIR_COMMIT='
          git rev-parse HEAD
          printf 'VERIFIED_REPAIR_TREE='
          git rev-parse HEAD^{tree}
