name: Guarded PR4 latest review repair

on:
  push:
    branches:
      - research-corpus-governed-expansion

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch latest review findings
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement target, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          policing = 'tests/test_policing_context_roadmap.py'
          old_visible = '''def _visible_text(markdown: str) -> str:\n    \"\"\"Return browser-visible text without hidden HTML or link metadata.\"\"\"\n    assert INTERACTIVE_FORM_CONTROL_PATTERN.search(markdown) is None, (\n        \"interactive form control HTML is not allowed on governed methodology surfaces\"\n    )\n'''
          new_visible = '''class _GovernedSurfaceHTMLParser(HTMLParser):\n    \"\"\"Detect raw-HTML constructs whose browser semantics are unsafe to approximate.\"\"\"\n\n    def __init__(self) -> None:\n        super().__init__(convert_charrefs=True)\n        self.violations: set[str] = set()\n\n    def handle_starttag(\n        self, tag: str, attrs: list[tuple[str, str | None]]\n    ) -> None:\n        tag = tag.lower()\n        if tag == \"canvas\":\n            self.violations.add(\"canvas\")\n        if tag == \"details\":\n            attribute_names = {key.lower() for key, _ in attrs}\n            if \"open\" not in attribute_names:\n                self.violations.add(\"closed-details\")\n\n    def handle_startendtag(\n        self, tag: str, attrs: list[tuple[str, str | None]]\n    ) -> None:\n        # Browsers ignore the self-closing flag on these non-void elements.\n        self.handle_starttag(tag, attrs)\n\n\ndef _governed_surface_html_violations(markdown: str) -> set[str]:\n    \"\"\"Inspect live rendered structure, leaving code/comments inert.\"\"\"\n    parser = _GovernedSurfaceHTMLParser()\n    parser.feed(_rendered_structure(markdown))\n    parser.close()\n    return parser.violations\n\n\ndef _visible_text(markdown: str) -> str:\n    \"\"\"Return browser-visible text without hidden HTML or link metadata.\"\"\"\n    violations = _governed_surface_html_violations(markdown)\n    assert \"canvas\" not in violations, (\n        \"canvas fallback HTML is not allowed on governed methodology surfaces\"\n    )\n    assert \"closed-details\" not in violations, (\n        \"default-closed <details> is not allowed on governed methodology surfaces\"\n    )\n    assert INTERACTIVE_FORM_CONTROL_PATTERN.search(markdown) is None, (\n        \"interactive form control HTML is not allowed on governed methodology surfaces\"\n    )\n'''
          replace_once(policing, old_visible, new_visible)

          old_rendered = '''    end, _ = _visible_markdown_heading_span(structure, WORKSTREAM_END_HEADING)\n    assert start < end, \"rendered policing workstream boundary is invalid\"\n    visible_structure = _mask_hidden_html_regions(structure)\n    return visible_structure[start:end]\n'''
          new_rendered = '''    end, _ = _visible_markdown_heading_span(structure, WORKSTREAM_END_HEADING)\n    assert start < end, \"rendered policing workstream boundary is invalid\"\n    assert \"closed-details\" not in _governed_surface_html_violations(roadmap[start:end]), (\n        \"default-closed <details> is not allowed in the rendered policing workstream\"\n    )\n    visible_structure = _mask_hidden_html_regions(structure)\n    return visible_structure[start:end]\n'''
          replace_once(policing, old_rendered, new_rendered)

          marker = '''def test_policing_fence_container_ownership_hides_top_level_code_payload():\n'''
          added_tests = '''def test_shared_governance_reducer_rejects_canvas_fallback():\n    with pytest.raises(AssertionError, match=\"canvas fallback HTML\"):\n        _visible_text(\"<canvas>Current sources may be skipped.</canvas>\")\n\n\ndef test_closed_details_summary_cannot_escape_policing_integrity():\n    roadmap = ROADMAP.read_text(encoding=\"utf-8\")\n    contradiction = (\n        \"<details><summary>Current sources may be skipped.</summary></details>\\n\\n\"\n    )\n    mutated = roadmap.replace(WORKSTREAM_END, contradiction + WORKSTREAM_END, 1)\n    with pytest.raises(AssertionError, match=\"default-closed <details>\"):\n        _validate_policing_workstream(mutated)\n\n\n'''
          replace_once(policing, marker, added_tests + marker)

          phase2 = 'tests/test_phase2_review_followup.py'
          replace_once(
              phase2,
              'import runpy\\n\\nimport pytest\\n',
              'import runpy\\nimport re\\n\\nimport pytest\\n',
          )

          old_notes = '''def _visible_phase2_notes(changelog: str) -> str:\n    namespace = runpy.run_path(str(POLICING_TEST))\n    structure = namespace[\"_rendered_structure\"](changelog)\n    phase2_start, _ = namespace[\"_visible_markdown_heading_span\"](\n        structure, PHASE2_HEADING\n    )\n    phase1_start, _ = namespace[\"_visible_markdown_heading_span\"](\n        structure, PHASE1_HEADING\n    )\n    assert phase2_start < phase1_start, \"Phase 2 changelog boundaries are out of order\"\n\n    phase2_structure = structure[phase2_start:phase1_start]\n    notes_start, _ = namespace[\"_visible_markdown_heading_span\"](\n        phase2_structure, PHASE2_NOTES_HEADING\n    )\n    absolute_notes_start = phase2_start + notes_start\n    return namespace[\"_visible_text\"](\n        changelog[absolute_notes_start:phase1_start]\n    )\n'''
          new_notes = '''def _visible_phase2_notes(changelog: str) -> str:\n    namespace = runpy.run_path(str(POLICING_TEST))\n    structure = namespace[\"_rendered_structure\"](changelog)\n    phase2_start, _ = namespace[\"_visible_markdown_heading_span\"](\n        structure, PHASE2_HEADING\n    )\n    phase1_start, _ = namespace[\"_visible_markdown_heading_span\"](\n        structure, PHASE1_HEADING\n    )\n    assert phase2_start < phase1_start, \"Phase 2 changelog boundaries are out of order\"\n\n    phase2_structure = structure[phase2_start:phase1_start]\n    notes_start, notes_heading_end = namespace[\"_visible_markdown_heading_span\"](\n        phase2_structure, PHASE2_NOTES_HEADING\n    )\n    visible_phase2_structure = namespace[\"_mask_hidden_html_regions\"](phase2_structure)\n\n    notes_end = len(phase2_structure)\n    relative_offset = 0\n    for raw_line in visible_phase2_structure[notes_heading_end:].splitlines(keepends=True):\n        line = raw_line.rstrip(\"\\r\\n\")\n        logical, is_code, _ = namespace[\"_parse_fence_container_prefixes\"](line)\n        if not is_code:\n            stripped = logical.strip(\" \\t\")\n            if re.match(r\"^#{1,3}(?:[ \\t]+|$)\", stripped):\n                notes_end = notes_heading_end + relative_offset\n                break\n        relative_offset += len(raw_line)\n\n    absolute_notes_start = phase2_start + notes_start\n    absolute_notes_end = phase2_start + notes_end\n    return namespace[\"_visible_text\"](\n        changelog[absolute_notes_start:absolute_notes_end]\n    )\n'''
          replace_once(phase2, old_notes, new_notes)

          p = Path(phase2)
          text = p.read_text(encoding='utf-8')
          regression = '''\n\ndef test_phase2_notes_stop_at_next_visible_peer_heading():\n    changelog = CHANGELOG.read_text(encoding=\"utf-8\")\n    bullet = f\"- {FREE_TEXT_IAA_BOUNDARY}\\n\"\n    assert bullet in changelog\n    moved = changelog.replace(bullet, \"\", 1).replace(\n        PHASE1_HEADING,\n        \"### Additional Phase 2 subsection\\n\\n\"\n        f\"- {FREE_TEXT_IAA_BOUNDARY}\\n\\n\"\n        + PHASE1_HEADING,\n        1,\n    )\n    assert FREE_TEXT_IAA_BOUNDARY not in _visible_phase2_notes(moved)\n'''
          if 'def test_phase2_notes_stop_at_next_visible_peer_heading()' in text:
              raise SystemExit('phase2 peer-heading regression already present')
          p.write_text(text.rstrip() + regression + '\n', encoding='utf-8')

      - name: Install test dependencies
        run: python -m pip install -e . pytest

      - name: Focused governance verification
        run: >-
          python -m pytest -q
          tests/test_policing_context_roadmap.py
          tests/test_workstream_h_methodology.py
          tests/test_policing_contract_receipt.py
          tests/test_phase2_review_followup.py
          tests/test_research_reference_registry.py

      - name: Full suite
        run: python -m pytest -q

      - name: Whitespace check
        run: git diff --check

      - name: Commit verified repair and remove runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/repair-pr4-latest.yml
          git add tests/test_policing_context_roadmap.py tests/test_phase2_review_followup.py .github/workflows/repair-pr4-latest.yml
          git commit -m "Harden latest governance rendering edges"
          git push origin HEAD:research-corpus-governed-expansion
