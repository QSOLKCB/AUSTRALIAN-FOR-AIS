name: Repair PR4 accessibility tree and nested anchors v5

on:
  push:
    branches: [research-corpus-governed-expansion]

permissions:
  contents: write

concurrency:
  group: repair-pr4-accessibility-anchor-v5
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository test environment
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Apply guarded repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{path}: replacement target count {n}, expected 1")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "tests/test_policing_context_roadmap.py",
              '        self.violations: set[str] = set()\n',
              '        self.violations: set[str] = set()\n        self._anchor_open = False\n',
          )
          replace_once(
              "tests/test_policing_context_roadmap.py",
              '        tag = tag.lower()\n        if tag == "canvas":\n',
              '        tag = tag.lower()\n        if tag == "a":\n            if self._anchor_open:\n                self.violations.add("nested-anchor")\n            self._anchor_open = True\n        if tag == "canvas":\n',
          )
          replace_once(
              "tests/test_policing_context_roadmap.py",
              '        if {"aria-label", "aria-labelledby"}.intersection(attribute_names):\n            self.violations.add("accessible-name")\n',
              '        if {"aria-label", "aria-labelledby"}.intersection(attribute_names):\n            self.violations.add("accessible-name")\n        if "aria-hidden" in attribute_names:\n            self.violations.add("accessibility-hidden")\n',
          )
          replace_once(
              "tests/test_policing_context_roadmap.py",
              '    def handle_startendtag(\n        self, tag: str, attrs: list[tuple[str, str | None]]\n    ) -> None:\n',
              '    def handle_endtag(self, tag: str) -> None:\n        if tag.lower() == "a":\n            self._anchor_open = False\n\n    def handle_startendtag(\n        self, tag: str, attrs: list[tuple[str, str | None]]\n    ) -> None:\n',
          )
          replace_once(
              "tests/test_policing_context_roadmap.py",
              '        "accessible-name": "accessible-name override HTML",\n        "interactive-form": "interactive form control HTML",\n',
              '        "accessible-name": "accessible-name override HTML",\n        "accessibility-hidden": "aria-hidden accessibility suppression HTML",\n        "nested-anchor": "nested anchor HTML",\n        "interactive-form": "interactive form control HTML",\n',
          )

          replace_once(
              "tests/test_research_reference_registry.py",
              '    "presentational-font",\n    "accessible-name",\n    "non-rendering-container",\n',
              '    "presentational-font",\n    "accessible-name",\n    "accessibility-hidden",\n    "nested-anchor",\n    "non-rendering-container",\n',
          )
          replace_once(
              "tests/test_research_reference_registry.py",
              '    assert "accessible-name" not in found, (\n        "accessible-name overrides on governed anchors are not allowed in governed documents"\n    )\n    assert "non-rendering-container" not in found, (\n',
              '    assert "accessible-name" not in found, (\n        "accessible-name overrides are not allowed in governed documents"\n    )\n    assert "accessibility-hidden" not in found, (\n        "aria-hidden accessibility suppression is not allowed in governed documents"\n    )\n    assert "nested-anchor" not in found, (\n        "nested anchor HTML is not allowed in governed documents"\n    )\n    assert "non-rendering-container" not in found, (\n',
          )

          replace_once(
              "tests/test_workstream_h_methodology.py",
              '''def test_aria_hidden_remains_visually_visible_to_workstream_h_reducer():\n    clause = "nationality and first-language identity must not define the comparison cohorts"\n    rendered = _visible_markdown_text(f'<span aria-hidden="true">{clause}</span>')\n    assert clause in rendered\n''',
              '''def test_aria_hidden_is_rejected_on_workstream_h_governed_surface():\n    clause = "nationality and first-language identity must not define the comparison cohorts"\n    with pytest.raises(AssertionError, match="aria-hidden accessibility suppression HTML"):\n        _visible_markdown_text(f'<span aria-hidden="true">{clause}</span>')\n''',
          )

          Path("tests/test_pr4_accessibility_anchor_regressions.py").write_text('''"""Regressions for governed accessibility-tree and anchor semantics."""\n\nfrom pathlib import Path\nimport runpy\n\nimport pytest\n\nTESTS = Path(__file__).parent\nROOT = TESTS.parent\nPOLICING = runpy.run_path(str(TESTS / "test_policing_context_roadmap.py"))\nREGISTRY = runpy.run_path(str(TESTS / "test_research_reference_registry.py"))\n\n@pytest.mark.parametrize("markup", [\n    '<span role="img" aria-hidden="true">source-gated research proposal</span>',\n    '<a href="https://example.org/source" aria-hidden="true">https://example.org/source</a>',\n])\ndef test_aria_hidden_is_rejected_by_shared_and_registry_preflights(markup: str) -> None:\n    violations = POLICING["_governed_surface_html_violations"](markup)\n    assert "accessibility-hidden" in violations\n    with pytest.raises(AssertionError, match="aria-hidden"):\n        POLICING["_assert_supported_governed_html"](violations)\n    found = REGISTRY["_forbidden_governed_html_constructs"](markup)\n    assert "accessibility-hidden" in found\n    with pytest.raises(AssertionError, match="aria-hidden"):\n        REGISTRY["_assert_no_active_document_html"](found)\n\ndef test_aria_hidden_cannot_hide_policing_safeguard() -> None:\n    roadmap = (ROOT / "ROADMAP.md").read_text(encoding="utf-8")\n    mutated = roadmap.replace("source-gated research proposal", '<span aria-hidden="true">source-gated research proposal</span>', 1)\n    with pytest.raises(AssertionError):\n        POLICING["_validate_policing_workstream"](mutated)\n\ndef test_aria_hidden_cannot_hide_registered_source() -> None:\n    corpus = (ROOT / "docs" / "RESEARCH-REFERENCE-CORPUS.md").read_text(encoding="utf-8")\n    source = "https://iview.abc.net.au/show/black-comedy"\n    mutated = corpus.replace(source, f'<a href="{source}" aria-hidden="true">{source}</a>', 1)\n    with pytest.raises(AssertionError, match="aria-hidden"):\n        REGISTRY["_validate_registry_corpus"](mutated)\n\n@pytest.mark.parametrize("markup", [\n    '<a hidden>masked<a>Current sources may be skipped.</a></a>',\n    '<a hidden><span>masked</span><a>Current sources may be skipped.</a></a>',\n])\ndef test_nested_anchors_are_rejected_by_shared_and_registry_preflights(markup: str) -> None:\n    violations = POLICING["_governed_surface_html_violations"](markup)\n    assert "nested-anchor" in violations\n    with pytest.raises(AssertionError, match="nested anchor"):\n        POLICING["_assert_supported_governed_html"](violations)\n    found = REGISTRY["_forbidden_governed_html_constructs"](markup)\n    assert "nested-anchor" in found\n    with pytest.raises(AssertionError, match="nested anchor"):\n        REGISTRY["_assert_no_active_document_html"](found)\n\ndef test_nested_anchor_cannot_escape_hidden_policing_ancestor() -> None:\n    roadmap = (ROOT / "ROADMAP.md").read_text(encoding="utf-8")\n    marker = "\\n---\\n\\n## Phase 3"\n    mutated = roadmap.replace(marker, '\\n<a hidden>masked<a>Current sources may be skipped.</a></a>\\n' + marker, 1)\n    with pytest.raises(AssertionError):\n        POLICING["_validate_policing_workstream"](mutated)\n\ndef test_nested_anchor_cannot_escape_hidden_registry_ancestor() -> None:\n    corpus = (ROOT / "docs" / "RESEARCH-REFERENCE-CORPUS.md").read_text(encoding="utf-8")\n    marker = "## Priority A: adversarial pragmatics"\n    mutated = corpus.replace(marker, '<a hidden>masked<a>This source may be copied freely.</a></a>\\n\\n' + marker, 1)\n    with pytest.raises(AssertionError, match="nested anchor"):\n        REGISTRY["_validate_registry_corpus"](mutated)\n''', encoding="utf-8")
          PY
          git diff --check
      - name: Validate datasets
        run: |
          python -m australian_for_ais.cli validate data/starter/examples.jsonl
          python -m australian_for_ais.cli validate-pilot data/pilot/items.jsonl
      - name: Run focused governance suite
        run: |
          pytest -q tests/test_policing_context_roadmap.py tests/test_research_reference_registry.py tests/test_workstream_h_methodology.py tests/test_policing_contract_receipt.py tests/test_phase2_review_followup.py tests/test_pr4_accessibility_anchor_regressions.py
      - name: Run full suite
        run: pytest -q
      - name: Commit repair and self-delete workflow
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          rm .github/workflows/repair-pr4-accessibility-anchor-v5.yml
          git add tests/test_policing_context_roadmap.py tests/test_research_reference_registry.py tests/test_workstream_h_methodology.py tests/test_pr4_accessibility_anchor_regressions.py .github/workflows/repair-pr4-accessibility-anchor-v5.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Harden governed accessibility and anchor semantics"
          git push origin HEAD:research-corpus-governed-expansion
