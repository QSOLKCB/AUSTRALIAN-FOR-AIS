name: Repair latest Codex findings

on:
  push:
    branches:
      - research-corpus-governed-expansion

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply fail-closed HTML policy repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          def insert_before_once(text: str, marker: str, addition: str, label: str) -> str:
              return replace_once(text, marker, addition + marker, label)

          def insert_after_once(text: str, marker: str, addition: str, label: str) -> str:
              return replace_once(text, marker, marker + addition, label)

          shared_path = Path("tests/test_policing_context_roadmap.py")
          shared = shared_path.read_text(encoding="utf-8")

          class_marker = "class _GovernedSurfaceHTMLParser(HTMLParser):"
          constants = (
              'GOVERNED_EXECUTABLE_URL_ATTRIBUTES = frozenset({\n'
              '    "href", "src", "action", "formaction", "xlink:href",\n'
              '})\n'
              'GOVERNED_EXECUTABLE_URL_SCHEMES = frozenset({"javascript", "vbscript"})\n\n\n'
              'def _has_executable_url_scheme(value: str) -> bool:\n'
              '    """Detect script-capable URL schemes after browser-style whitespace folding."""\n'
              '    if ":" not in value:\n'
              '        return False\n'
              '    raw_scheme = value.split(":", 1)[0]\n'
              '    # HTMLParser has already decoded character references. Fail closed\n'
              '    # on ASCII whitespace/control characters embedded in a URL scheme.\n'
              '    scheme = re.sub(r"[\\x00-\\x20\\x7f]+", "", raw_scheme).casefold()\n'
              '    return scheme in GOVERNED_EXECUTABLE_URL_SCHEMES\n\n\n'
          )
          if "GOVERNED_EXECUTABLE_URL_ATTRIBUTES" not in shared:
              shared = insert_before_once(
                  shared, class_marker, constants, "insert shared executable URL policy"
              )

          style_marker = '        if "style" in attribute_names:\n'
          detections = (
              '        if any(\n'
              '            name in values and _has_executable_url_scheme(values[name])\n'
              '            for name in GOVERNED_EXECUTABLE_URL_ATTRIBUTES\n'
              '        ):\n'
              '            self.violations.add("executable-url")\n'
              '        if tag == "datalist":\n'
              '            self.violations.add("non-rendering-container")\n'
          )
          if 'self.violations.add("executable-url")' not in shared:
              shared = insert_before_once(
                  shared, style_marker, detections, "detect executable URLs and datalist"
              )

          description_marker = '        "executable-script": "executable script HTML",\n'
          descriptions = (
              '        "executable-url": "executable URL HTML",\n'
              '        "non-rendering-container": "non-rendering datalist HTML",\n'
          )
          if '"executable-url": "executable URL HTML"' not in shared:
              shared = insert_after_once(
                  shared, description_marker, descriptions, "reject new shared violation kinds"
              )

          shared_tests = r'''

          @pytest.mark.parametrize(
              ("markup", "kind"),
              (
                  ('<a href="javascript:alert(1)">governed clause</a>', "executable-url"),
                  ('<a href="java&#x0A;script:alert(1)">governed clause</a>', "executable-url"),
                  ('<form action="vbscript:msgbox(1)">governed clause</form>', "executable-url"),
                  ('<datalist><option>governed clause</option></datalist>', "non-rendering-container"),
              ),
          )
          def test_governed_surface_preflight_rejects_executable_urls_and_datalist(
              markup: str,
              kind: str,
          ) -> None:
              violations = _governed_surface_html_violations(markup)
              assert kind in violations
              with pytest.raises(AssertionError):
                  _assert_supported_governed_html(violations)
          '''
          shared_test_marker = "def test_governed_surface_preflight_rejects_executable_urls_and_datalist("
          if shared_test_marker not in shared:
              shared = shared.rstrip() + "\n" + shared_tests.lstrip("\n")
          shared_path.write_text(shared, encoding="utf-8")

          registry_path = Path("tests/test_research_reference_registry.py")
          registry = registry_path.read_text(encoding="utf-8")

          old_active = 'ACTIVE_DOCUMENT_HTML_KINDS = frozenset({"executable-script", "meta-refresh"})'
          new_active = (
              'ACTIVE_DOCUMENT_HTML_KINDS = frozenset({\n'
              '    "executable-script",\n'
              '    "meta-refresh",\n'
              '    "conditional-raw-text",\n'
              '    "executable-url",\n'
              '    "non-rendering-container",\n'
              '})'
          )
          if old_active in registry:
              registry = replace_once(
                  registry, old_active, new_active, "expand document-wide active HTML kinds"
              )

          meta_assert = (
              '    assert "meta-refresh" not in found, '
              '"meta-refresh HTML is not allowed in governed documents"\n'
          )
          global_guards = (
              '    assert "conditional-raw-text" not in found, (\n'
              '        "conditional/legacy raw-text HTML is not allowed in governed documents"\n'
              '    )\n'
              '    assert "executable-url" not in found, (\n'
              '        "executable URL HTML is not allowed in governed documents"\n'
              '    )\n'
              '    assert "non-rendering-container" not in found, (\n'
              '        "non-rendering datalist HTML is not allowed in governed documents"\n'
              '    )\n'
          )
          if '"executable-url" not in found' not in registry:
              registry = insert_after_once(
                  registry, meta_assert, global_guards, "strengthen document-wide HTML guard"
              )

          conditional_marker = '    assert "conditional-raw-text" not in forbidden_html, (\n'
          entry_guards = (
              '    assert "executable-url" not in forbidden_html, (\n'
              '        f"{entry} contains an executable URL attribute; governed HTML must not "\n'
              '        "carry javascript:/vbscript: navigation"\n'
              '    )\n'
              '    assert "non-rendering-container" not in forbidden_html, (\n'
              '        f"{entry} contains a non-rendering datalist container; governed clauses "\n'
              '        "must remain ordinary reader-visible document prose"\n'
              '    )\n'
          )
          if '"executable-url" not in forbidden_html' not in registry:
              registry = insert_before_once(
                  registry, conditional_marker, entry_guards, "strengthen per-entry HTML guard"
              )

          registry_tests = r'''

          @pytest.mark.parametrize(
              ("replacement", "error"),
              (
                  (
                      f"<noscript>{REDISTRIBUTION_INVARIANT}</noscript>",
                      "conditional/legacy raw-text",
                  ),
                  (
                      f'<a href="javascript:alert(1)">{REDISTRIBUTION_INVARIANT}</a>',
                      "executable URL",
                  ),
                  (
                      f"<datalist>{REDISTRIBUTION_INVARIANT}</datalist>",
                      "non-rendering datalist",
                  ),
              ),
          )
          def test_registry_status_rejects_document_wide_active_or_nonrendering_html(
              replacement: str,
              error: str,
          ) -> None:
              corpus = CORPUS.read_text(encoding="utf-8")
              assert REDISTRIBUTION_INVARIANT in corpus
              mutation = corpus.replace(REDISTRIBUTION_INVARIANT, replacement, 1)
              with pytest.raises(AssertionError, match=error):
                  _validate_registry_corpus(mutation)
          '''
          registry_test_marker = "def test_registry_status_rejects_document_wide_active_or_nonrendering_html("
          if registry_test_marker not in registry:
              registry = registry.rstrip() + "\n" + registry_tests.lstrip("\n")
          registry_path.write_text(registry, encoding="utf-8")
          PY

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run focused governance tests
        run: |
          pytest -q \
            tests/test_research_reference_registry.py \
            tests/test_policing_context_roadmap.py \
            tests/test_workstream_h_methodology.py \
            tests/test_pr4_active_html_regressions.py \
            tests/test_pr4_global_rendering_regressions.py \
            tests/test_pr4_shared_html_regressions.py

      - name: Run full verification
        run: |
          python -m australian_for_ais.cli validate data/starter/examples.jsonl
          python -m australian_for_ais.cli validate-pilot data/pilot/items.jsonl
          pytest -q --disable-warnings --maxfail=1
          git diff --check

      - name: Commit verified repair and self-delete
        run: |
          rm .github/workflows/repair-latest-codex.yml
          git config user.name "EmergentMonk"
          git config user.email "73952179+EmergentMonk@users.noreply.github.com"
          git add tests/test_policing_context_roadmap.py tests/test_research_reference_registry.py .github/workflows/repair-latest-codex.yml
          git commit -m "Close latest governed HTML integrity bypasses" -m "Reject executable URL schemes, corpus-wide conditional raw text, and non-rendering datalist containers before governed integrity hashing. Add regressions and preserve the existing research documents and integrity fixtures. Temporary repair workflow self-deleted after focused and full verification."
          git push origin HEAD:research-corpus-governed-expansion
