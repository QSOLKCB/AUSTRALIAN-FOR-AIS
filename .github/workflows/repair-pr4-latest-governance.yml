name: Repair PR4 latest governance review

on:
  push:
    branches:
      - research-corpus-governed-expansion

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Apply review repair
        run: |
          python - <<'PY'
          from pathlib import Path

          def rep(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          policing = "tests/test_policing_context_roadmap.py"
          registry = "tests/test_research_reference_registry.py"
          phase2 = "tests/test_phase2_review_followup.py"

          rep(
              policing,
              '        if tag == "table":\n            self.violations.add("raw-table")\n        # SVG needs its own rendering tree, not HTML character-data callbacks.\n',
              '        if tag == "table":\n            self.violations.add("raw-table")\n        # Legacy font presentation can make sealed prose unreadable without\n        # changing its character data. Do not approximate that rendering.\n        if tag in {"font", "basefont"}:\n            self.violations.add("presentational-font")\n        # SVG needs its own rendering tree, not HTML character-data callbacks.\n',
          )
          rep(
              policing,
              '        if "title" in attribute_names:\n            self.violations.add("tooltip-title")\n        # Raw Markdown is embedded into an existing HTML document. A live\n',
              '        if "title" in attribute_names:\n            self.violations.add("tooltip-title")\n        if tag == "a" and {"aria-label", "aria-labelledby"}.intersection(attribute_names):\n            self.violations.add("accessible-name")\n        # Raw Markdown is embedded into an existing HTML document. A live\n',
          )
          rep(
              policing,
              '        "tooltip-title": "tooltip title-attribute HTML",\n        "non-rendering-container": "non-rendering container HTML",\n',
              '        "tooltip-title": "tooltip title-attribute HTML",\n        "presentational-font": "legacy presentational font HTML",\n        "accessible-name": "accessible-name override HTML",\n        "non-rendering-container": "non-rendering container HTML",\n',
          )

          rep(
              registry,
              '    "tooltip-title",\n    "non-rendering-container",\n})\n',
              '    "tooltip-title",\n    "presentational-font",\n    "accessible-name",\n    "non-rendering-container",\n})\n',
          )
          rep(
              registry,
              '    assert "tooltip-title" not in found, (\n        "tooltip title-attribute HTML is not allowed in governed documents"\n    )\n    assert "non-rendering-container" not in found, (\n',
              '    assert "tooltip-title" not in found, (\n        "tooltip title-attribute HTML is not allowed in governed documents"\n    )\n    assert "presentational-font" not in found, (\n        "legacy presentational font HTML is not allowed in governed documents"\n    )\n    assert "accessible-name" not in found, (\n        "accessible-name overrides on governed anchors are not allowed in governed documents"\n    )\n    assert "non-rendering-container" not in found, (\n',
          )

          rep(
              phase2,
              'FREE_TEXT_IAA_BOUNDARY = (\n    "Free-text pragmatic interpretations remain qualitative evidence and are not "\n    "assigned a misleading exact-string IAA score."\n)\n',
              'FREE_TEXT_IAA_BOUNDARY = (\n    "Free-text pragmatic interpretations remain qualitative evidence and are not "\n    "assigned a misleading exact-string IAA score."\n)\nEXPECTED_VISIBLE_PHASE2_NOTES = (\n    "### Notes - The Phase 2 pilot is an unannotated research fixture. "\n    "No human annotation results, ethical approvals, or empirical agreement statistics "\n    "are claimed until real pilot collection occurs. - "\n    "Free-text pragmatic interpretations remain qualitative evidence and are not "\n    "assigned a misleading exact-string IAA score. ---"\n)\n',
          )
          rep(
              phase2,
              'def test_phase2_changelog_keeps_free_text_iaa_boundary():\n    changelog = CHANGELOG.read_text(encoding="utf-8")\n    assert FREE_TEXT_IAA_BOUNDARY in _visible_phase2_notes(changelog)\n',
              'def test_phase2_changelog_keeps_free_text_iaa_boundary():\n    changelog = CHANGELOG.read_text(encoding="utf-8")\n    assert _visible_phase2_notes(changelog) == EXPECTED_VISIBLE_PHASE2_NOTES\n\n\ndef test_phase2_changelog_rejects_contradictory_iaa_continuation():\n    changelog = CHANGELOG.read_text(encoding="utf-8")\n    bullet = f"- {FREE_TEXT_IAA_BOUNDARY}\\n"\n    contradictory = changelog.replace(\n        bullet,\n        f"- {FREE_TEXT_IAA_BOUNDARY} However, these interpretations are assigned "\n        "an exact-string IAA score after all.\\n",\n        1,\n    )\n    assert _visible_phase2_notes(contradictory) != EXPECTED_VISIBLE_PHASE2_NOTES\n',
          )
          PY

          cat > tests/test_pr4_latest_governance_regressions.py <<'PY'
          from pathlib import Path
          import runpy

          import pytest

          ROOT = Path(__file__).parent.parent
          P = runpy.run_path(str(ROOT / "tests/test_policing_context_roadmap.py"))
          R = runpy.run_path(str(ROOT / "tests/test_research_reference_registry.py"))
          ROADMAP = (ROOT / "ROADMAP.md").read_text(encoding="utf-8")
          CORPUS = (ROOT / "docs/RESEARCH-REFERENCE-CORPUS.md").read_text(encoding="utf-8")

          POLICING_CLAUSE = "source-gated research proposal"
          RIGHTS_CLAUSE = R["REDISTRIBUTION_INVARIANT"]
          BLACK_COMEDY_URL = "https://iview.abc.net.au/show/black-comedy"


          @pytest.mark.parametrize(
              "markup",
              (
                  '<font color="white">{clause}</font>',
                  '<font color="transparent">{clause}</font>',
                  '<basefont color="white">{clause}',
              ),
          )
          def test_shared_preflight_rejects_legacy_presentational_font(markup):
              violations = P["_governed_surface_html_violations"](
                  markup.format(clause="governed clause")
              )
              assert "presentational-font" in violations
              with pytest.raises(AssertionError):
                  P["_assert_supported_governed_html"](violations)


          @pytest.mark.parametrize(
              "markup",
              (
                  '<font color="white">{clause}</font>',
                  '<font color="transparent">{clause}</font>',
              ),
          )
          def test_policing_and_registry_reject_presentational_font(markup):
              roadmap = ROADMAP.replace(
                  POLICING_CLAUSE, markup.format(clause=POLICING_CLAUSE), 1
              )
              with pytest.raises(AssertionError):
                  P["_validate_policing_workstream"](roadmap)

              corpus = CORPUS.replace(
                  RIGHTS_CLAUSE, markup.format(clause=RIGHTS_CLAUSE), 1
              )
              with pytest.raises(AssertionError):
                  R["_validate_registry_corpus"](corpus)


          @pytest.mark.parametrize("attribute", ("aria-label", "aria-labelledby"))
          def test_registry_rejects_accessible_name_override_on_registered_source(attribute):
              value = (
                  "Unverified and reusable source"
                  if attribute == "aria-label"
                  else "contradictory-source-name"
              )
              anchor = (
                  f'<a href="{BLACK_COMEDY_URL}" {attribute}="{value}">' 
                  f"{BLACK_COMEDY_URL}</a>"
              )
              mutation = CORPUS.replace(BLACK_COMEDY_URL, anchor, 1)
              violations = P["_governed_surface_html_violations"](anchor)
              assert "accessible-name" in violations
              with pytest.raises(AssertionError):
                  R["_validate_registry_corpus"](mutation)
          PY
      - name: Diff check
        run: git diff --check
      - name: Focused governance tests
        run: |
          pytest -q \
            tests/test_pr4_latest_governance_regressions.py \
            tests/test_policing_context_roadmap.py \
            tests/test_research_reference_registry.py \
            tests/test_phase2_review_followup.py \
            tests/test_governance_review_regressions.py \
            tests/test_pr4_active_html_regressions.py \
            tests/test_pr4_global_rendering_regressions.py \
            tests/test_pr4_shared_html_regressions.py
      - name: Dataset validation
        run: |
          python -m australian_for_ais.cli validate data/starter/examples.jsonl
          python -m australian_for_ais.cli validate-pilot data/pilot/items.jsonl
      - name: Full suite
        run: pytest -q --disable-warnings --maxfail=1
      - name: Commit verified repair and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-pr4-latest-governance.yml
          git add tests/test_policing_context_roadmap.py \
                  tests/test_research_reference_registry.py \
                  tests/test_phase2_review_followup.py \
                  tests/test_pr4_latest_governance_regressions.py
          git diff --cached --check
          git commit -m "Harden governed presentation and accessibility semantics"
          git push origin HEAD:research-corpus-governed-expansion
