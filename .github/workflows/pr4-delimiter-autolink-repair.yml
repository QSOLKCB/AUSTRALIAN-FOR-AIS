name: PR4 delimiter and email-autolink repair

on:
  push:
    branches:
      - research-corpus-governed-expansion

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Correct repair harness
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/pr4_delimiter_autolink_repair.py')
          text = path.read_text(encoding='utf-8')

          start = text.index('    email_corpus = corpus.replace(\n')
          end = text.index('\n\n\nCOMMON_DELIMITER_FUNCTION', start)
          replacement = '''    assert registry["_visible_inline_text"](email) == "", (
              "expected the pre-fix registry reducer to drop CommonMark email autolinks"
          )'''
          text = text[:start] + replacement + text[end:]

          text = text.replace(
              '''    new_protect = \'\'\'    visible = _protect_entity_decoded_emphasis_punctuation(visible)\\n    visible = _protect_unmatched_markdown_emphasis_delimiters(visible)\\n    # HTMLParser(convert_charrefs=True) performs the browser's one character-\\n\'\'\'\n''',
              '''    new_protect = \'\'\'    visible = _protect_entity_decoded_emphasis_punctuation(visible)\\n    # HTMLParser(convert_charrefs=True) performs the browser's one character-\\n\'\'\'\n''',
              1,
          )
          text = text.replace(
              '''    new_restore = \'\'\'    visible = _strip_emphasis_preserving_intraword_underscores(visible)\\n    visible = _restore_entity_decoded_emphasis_punctuation(visible)\\n    visible = _restore_unmatched_markdown_emphasis_delimiters(visible)\\n    visible = visible.replace(RAW_HTML_LITERAL_ASTERISK, "*")\\n\'\'\'\n''',
              '''    new_restore = \'\'\'    visible = _protect_unmatched_markdown_emphasis_delimiters(visible)\\n    visible = _strip_emphasis_preserving_intraword_underscores(visible)\\n    visible = _restore_entity_decoded_emphasis_punctuation(visible)\\n    visible = _restore_unmatched_markdown_emphasis_delimiters(visible)\\n    visible = visible.replace(RAW_HTML_LITERAL_ASTERISK, "*")\\n\'\'\'\n''',
              1,
          )
          # Registry raw-HTML punctuation already owns the low private-use
          # sentinels. Give unmatched/surplus Markdown delimiters a distinct
          # namespace so the two protection passes cannot collide.
          text = text.replace('\\uE003', '\\uE101').replace('\\uE004', '\\uE102')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Reproduce and apply guarded repair
        run: python scripts/pr4_delimiter_autolink_repair.py

      - name: Add raw-HTML punctuation compatibility receipt
        run: |
          cat >> tests/test_pr4_delimiter_autolink_regressions.py <<'PY'

          def test_registry_raw_html_literal_punctuation_stays_literal():
              assert REGISTRY["_visible_inline_text"]("The art<span>*</span>icle") == "The art*icle"
              assert REGISTRY["_visible_inline_text"]("The art<span>_</span>icle") == "The art_icle"
          PY

      - name: Remove temporary repair machinery
        run: |
          git rm -f scripts/pr4_delimiter_autolink_repair.py
          git rm -f .github/workflows/pr4-delimiter-autolink-repair.yml

      - name: Verify exact regressions
        run: pytest -q tests/test_pr4_delimiter_autolink_regressions.py

      - name: Validate datasets
        run: |
          python -m australian_for_ais.cli validate data/starter/examples.jsonl
          python -m australian_for_ais.cli validate-pilot data/pilot/items.jsonl

      - name: Verify full suite and whitespace
        run: |
          git diff --check
          pytest -q --disable-warnings --maxfail=1
          git diff --check

      - name: Commit verified repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_policing_context_roadmap.py tests/test_research_reference_registry.py tests/test_pr4_delimiter_autolink_regressions.py
          git commit -m 'Harden delimiter and email autolink receipts'
          git push origin HEAD:research-corpus-governed-expansion
