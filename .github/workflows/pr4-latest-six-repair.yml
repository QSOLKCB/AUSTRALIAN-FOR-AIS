name: PR4 latest six review repair v3

on:
  push:
    branches:
      - research-corpus-governed-expansion
    paths:
      - .github/workflows/pr4-latest-six-repair.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply six-review repair
        run: python .github/scripts/pr4-latest-six-repair.py

      - name: Apply correction layer
        run: python .github/scripts/pr4-latest-six-correction.py

      - name: Focused governance tests
        run: |
          pytest -q \
            tests/test_research_reference_registry.py \
            tests/test_workstream_h_methodology.py \
            tests/test_policing_context_roadmap.py \
            tests/test_policing_contract_receipt.py \
            tests/test_phase2_review_followup.py

      - name: Validate data contracts
        run: |
          python -m australian_for_ais.cli validate data/starter/examples.jsonl
          python -m australian_for_ais.cli validate-pilot data/pilot/items.jsonl

      - name: Full test suite
        run: pytest -q --disable-warnings --maxfail=1

      - name: Verify patch whitespace
        run: git diff --check

      - name: Self-clean repair machinery
        run: |
          rm .github/scripts/pr4-latest-six-repair.py
          rm .github/scripts/pr4-latest-six-correction.py
          rm .github/workflows/pr4-latest-six-repair.yml
          git diff --check

      - name: Commit and push verified repair
        run: |
          git config user.name "Trent Slade"
          git config user.email "73952179+EmergentMonk@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Guard produced no substantive change" >&2
            exit 1
          fi
          git commit -m "Close latest six PR4 review gaps"
          git push origin HEAD:research-corpus-governed-expansion
