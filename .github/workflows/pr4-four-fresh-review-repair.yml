name: PR4 four-fresh-review guarded repair

on:
  push:
    branches:
      - research-corpus-governed-expansion
    paths:
      - '.github/scripts/pr4-four-fresh-review-repair.py'
      - '.github/workflows/pr4-four-fresh-review-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Apply four fresh review repairs
        run: python .github/scripts/pr4-four-fresh-review-repair.py
      - name: Align exact-run sentinel checks
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_research_reference_registry.py")
          text = path.read_text(encoding="utf-8")
          old = (
              "        close = _matching_backtick_run_start(text, run_end, len(marker))\n"
              "        if close < 0:\n"
          )
          new = (
              "        close = _matching_backtick_run_start(text, run_end, len(marker))\n"
              "        if close is None:\n"
          )
          count = text.count(old)
          if count != 3:
              raise SystemExit(f"expected 3 exact-run helper sentinel checks, found {count}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Run focused regressions
        run: pytest -q tests/test_research_reference_registry.py tests/test_workstream_h_methodology.py tests/test_policing_contract_receipt.py tests/test_policing_context_roadmap.py
      - name: Run full suite
        run: pytest -q --disable-warnings --maxfail=1
      - name: Commit verified repairs and remove temporary runner
        run: |
          rm .github/scripts/pr4-four-fresh-review-repair.py
          rm .github/workflows/pr4-four-fresh-review-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "Close four fresh PR4 review gaps"
          git push origin HEAD:research-corpus-governed-expansion
