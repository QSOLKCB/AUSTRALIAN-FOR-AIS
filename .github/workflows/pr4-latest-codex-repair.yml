name: PR4 latest Codex repair

on:
  push:
    branches:
      - research-corpus-governed-expansion
    paths:
      - .github/workflows/pr4-latest-codex-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply exact review repair
        run: python .github/pr4_latest_codex_repair.py

      - name: Run exact regressions
        run: pytest -q tests/test_pr4_latest_codex_regressions.py

      - name: Run focused governance suite
        run: |
          pytest -q \
            tests/test_research_reference_registry.py \
            tests/test_policing_context_roadmap.py \
            tests/test_workstream_h_methodology.py

      - name: Run full suite
        run: pytest -q --disable-warnings --maxfail=1

      - name: Check whitespace
        run: git diff --check

      - name: Commit verified repair
        run: |
          # Fifth gate: all three findings are wired through their final validation paths.
          if git diff --quiet -- tests/test_research_reference_registry.py tests/test_policing_context_roadmap.py tests/test_pr4_latest_codex_regressions.py; then
            echo "No repair diff produced"
            exit 1
          fi
          git config user.name "Trent Slade"
          git config user.email "73952179+EmergentMonk@users.noreply.github.com"
          git add tests/test_research_reference_registry.py tests/test_policing_context_roadmap.py tests/test_pr4_latest_codex_regressions.py
          git commit -m "Fix latest Codex governance receipt findings"
          git push origin HEAD:research-corpus-governed-expansion
