name: Repair PR4 executable Markdown links

on:
  push:
    branches: ["research-corpus-governed-expansion"]
    paths: [".github/workflows/repair-pr4-executable-markdown-links.yml"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify guarded parent
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "a5b0cd9339b2eeaa38d9f98f2fd6d14a2a3d62d8"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply repair
        run: python .github/repair-pr4-executable-markdown-links.py

      - name: Diff check
        run: |
          git diff --check
          git add -N tests/test_pr4_executable_markdown_links.py
          git diff --check

      - name: Validate datasets
        run: |
          python -m australian_for_ais.cli validate data/starter/examples.jsonl
          python -m australian_for_ais.cli validate-pilot data/pilot/items.jsonl

      - name: Run focused governance tests
        run: |
          pytest -q --disable-warnings --maxfail=1 \
            tests/test_pr4_executable_markdown_links.py \
            tests/test_policing_context_roadmap.py \
            tests/test_research_reference_registry.py \
            tests/test_workstream_h_methodology.py \
            tests/test_policing_contract_receipt.py \
            tests/test_phase2_review_followup.py

      - name: Run full suite
        run: pytest -q --disable-warnings --maxfail=1

      - name: Commit repair and self-delete
        run: |
          set -euo pipefail
          rm .github/workflows/repair-pr4-executable-markdown-links.yml
          rm .github/repair-pr4-executable-markdown-links.py
          git add tests/test_policing_context_roadmap.py tests/test_pr4_executable_markdown_links.py .github/workflows/repair-pr4-executable-markdown-links.yml .github/repair-pr4-executable-markdown-links.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Reject executable Markdown links on governed surfaces"
          git push origin HEAD:research-corpus-governed-expansion
