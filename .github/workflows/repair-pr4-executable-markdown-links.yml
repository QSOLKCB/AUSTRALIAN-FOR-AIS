          rm .github/workflows/repair-pr4-executable-markdown-links.yml
          git add tests/test_policing_context_roadmap.py tests/test_research_reference_registry.py tests/test_pr4_executable_markdown_links.py .github/workflows/repair-pr4-executable-markdown-links.yml
