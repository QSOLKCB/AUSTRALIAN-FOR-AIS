name: Repair PR4 executable Markdown links

on:
  push:
    branches: ["research-corpus-governed-expansion"]
    paths: [".github/workflows/repair-pr4-executable-markdown-links.yml"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify guarded parent
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "5e3d379c9c3a07fdaaf3a7f35edb0a7c1f8d9550"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply executable Markdown destination hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          policing = Path("tests/test_policing_context_roadmap.py")
          text = policing.read_text()

          anchor = "    return destination\n\n\ndef _replace_inline_markdown_links_for_visibility"
          assert anchor in text
          helper = r'''    return destination


def _decode_markdown_destination_for_scheme(destination: str) -> str:
    """Decode only CommonMark character references and punctuation escapes."""
    reference = re.compile(
        r"&(?:#[0-9]{1,7}|#[xX][0-9A-Fa-f]{1,6}|[A-Za-z][A-Za-z0-9]{1,31});"
    )
    value = reference.sub(lambda match: html.unescape(match.group(0)), destination)
    decoded: list[str] = []
    cursor = 0
    while cursor < len(value):
        if (
            value[cursor] == "\\"
            and cursor + 1 < len(value)
            and value[cursor + 1] in string.punctuation
        ):
            decoded.append(value[cursor + 1])
            cursor += 2
            continue
        decoded.append(value[cursor])
        cursor += 1
    return "".join(decoded)


def _iter_inline_markdown_destinations(text: str):
    """Yield rendered inline-link destinations while ignoring image destinations."""
    cursor = 0
    while cursor < len(text):
        bracket = text.find("[", cursor)
        if bracket < 0:
            return
        if _is_escaped_markdown_character(text, bracket):
            cursor = bracket + 1
            continue
        label_end = _balanced_markdown_label_end(text, bracket)
        if label_end is None or label_end + 1 >= len(text) or text[label_end + 1] != "(":
            cursor = bracket + 1
            continue
        paren_start = label_end + 1
        paren_end = _inline_link_closing_paren(text, paren_start)
        if paren_end is None:
            cursor = bracket + 1
            continue
        destination = _inline_link_destination(text[paren_start + 1:paren_end])
        if destination is None:
            cursor = bracket + 1
            continue
        image = (
            bracket > 0
            and text[bracket - 1] == "!"
            and not _is_escaped_markdown_character(text, bracket - 1)
        )
        if not image:
            yield destination
        cursor = paren_end + 1


def _replace_inline_markdown_links_for_visibility'''
          text = text.replace(anchor, helper, 1)

          old = '''    parser.feed("".join(characters))\n    parser.close()\n    return parser.violations\n'''
          assert old in text
          new = '''    live_markup = "".join(characters)\n\n    # Markdown links become anchors only after Markdown rendering, so the raw-HTML\n    # parser cannot enforce executable-scheme policy on them. Inspect the rendered\n    # Markdown structure before link labels are reduced to visible text. Raw HTML\n    # blocks/tags remain excluded so attribute text is not mistaken for Markdown.\n    markdown_characters = list(live_markup)\n    for start, end in html_spans:\n        markdown_characters[start:end] = " " * (end - start)\n    markdown_without_blocks = "".join(markdown_characters)\n    for match in reversed(list(PREFLIGHT_HTML_TAG.finditer(markdown_without_blocks))):\n        markdown_characters[match.start():match.end()] = " " * (match.end() - match.start())\n    markdown_source = "".join(markdown_characters)\n    if any(\n        _has_executable_url_scheme(_decode_markdown_destination_for_scheme(destination))\n        for destination in _iter_inline_markdown_destinations(markdown_source)\n    ):\n        parser.violations.add("executable-markdown-url")\n\n    parser.feed(live_markup)\n    parser.close()\n    return parser.violations\n'''
          text = text.replace(old, new, 1)

          old = '        "executable-url": "executable URL HTML",\n'
          assert old in text
          text = text.replace(
              old,
              old + '        "executable-markdown-url": "executable Markdown link destination",\n',
              1,
          )
          policing.write_text(text)

          registry = Path("tests/test_research_reference_registry.py")
          text = registry.read_text()
          old = '    "executable-url",\n'
          assert old in text
          text = text.replace(old, old + '    "executable-markdown-url",\n', 1)
          registry.write_text(text)

          regression = Path("tests/test_pr4_executable_markdown_links.py")
          regression.write_text(r'''"""Regression coverage for executable Markdown destinations on governed surfaces."""

from pathlib import Path
import runpy

import pytest


HERE = Path(__file__).parent
POLICING = runpy.run_path(str(HERE / "test_policing_context_roadmap.py"))
REGISTRY = runpy.run_path(str(HERE / "test_research_reference_registry.py"))


@pytest.mark.parametrize(
    "destination",
    (
        "javascript:document.body.textContent=%27weakened%27",
        "JAVASCRIPT:document.body.textContent=%27weakened%27",
        "javascript&#58;document.body.textContent=%27weakened%27",
        r"javascript\:document.body.textContent=%27weakened%27",
        "vbscript:msgbox%28%27weakened%27%29",
    ),
)
def test_shared_preflight_rejects_executable_inline_markdown_destinations(destination: str) -> None:
    markdown = f"[source-gated research proposal]({destination})"
    violations = POLICING["_governed_surface_html_violations"](markdown)
    assert "executable-markdown-url" in violations


@pytest.mark.parametrize(
    "markdown",
    (
        "`[example](javascript:alert(1))`",
        "<!-- [example](javascript:alert(1)) -->",
        "```markdown\n[example](javascript:alert(1))\n```",
        "![image](javascript:alert(1))",
    ),
)
def test_inert_or_non_anchor_markdown_does_not_trigger_executable_link_policy(markdown: str) -> None:
    violations = POLICING["_governed_surface_html_violations"](markdown)
    assert "executable-markdown-url" not in violations


def test_policing_validator_rejects_executable_markdown_link_on_required_clause() -> None:
    roadmap = POLICING["ROADMAP"].read_text()
    mutated = roadmap.replace(
        "source-gated research proposal",
        "[source-gated research proposal](javascript:document.body.textContent=%27weakened%27)",
        1,
    )
    with pytest.raises(AssertionError, match="executable Markdown link destination"):
        POLICING["_validate_policing_workstream"](mutated)


def test_registry_validator_rejects_executable_markdown_link_on_status_invariant() -> None:
    corpus = REGISTRY["CORPUS"].read_text()
    invariant = REGISTRY["REDISTRIBUTION_INVARIANT"]
    mutated = corpus.replace(
        invariant,
        f"[{invariant}](javascript:document.body.textContent=%27weakened%27)",
        1,
    )
    with pytest.raises(AssertionError):
        REGISTRY["_validate_registry_corpus"](mutated)
