name: PR4 dialog aria ruby repair

on:
  push:
    branches:
      - research-corpus-governed-expansion
    paths:
      - .github/workflows/pr4-dialog-aria-ruby-repair.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply parser hardening
        run: python .github/pr4_dialog_aria_ruby_repair.py

      - name: Exact fresh regressions
        run: pytest -q tests/test_pr4_native_machine_dialog_regressions.py

      - name: Focused governance regression suite
        run: |
          pytest -q \
            tests/test_policing_context_roadmap.py \
            tests/test_research_reference_registry.py \
            tests/test_pr4_native_machine_dialog_regressions.py

      - name: Validate datasets
        run: |
          python -m australian_for_ais.cli validate data/starter/examples.jsonl
          python -m australian_for_ais.cli validate-pilot data/pilot/items.jsonl

      - name: Full test suite
        run: pytest -q --disable-warnings --maxfail=1

      - name: Whitespace check
        run: git diff --check

      - name: Commit verified repair and self-clean
        run: |
          git config user.name "EmergentMonk"
          git config user.email "73952179+EmergentMonk@users.noreply.github.com"
          git add tests/test_policing_context_roadmap.py tests/test_pr4_native_machine_dialog_regressions.py
          git rm .github/pr4_dialog_aria_ruby_repair.py .github/workflows/pr4-dialog-aria-ruby-repair.yml
          git commit -m "Harden parsed dialog and accessibility semantics"
          git push origin HEAD:research-corpus-governed-expansion
