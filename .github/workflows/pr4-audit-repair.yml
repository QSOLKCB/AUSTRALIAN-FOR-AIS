name: PR4 clean-head audit repair

on:
  push:
    branches:
      - research-corpus-governed-expansion

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify repair parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "8056c7a483e6ddad50550d44149233ca71dcd8ff"

      - name: Patch validators and add regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def splice(path: Path, start_marker: str, end_marker: str, replacement: str) -> None:
              text = path.read_text(encoding="utf-8")
              if text.count(start_marker) != 1:
                  raise SystemExit(f"{path}: start marker count for {start_marker!r} is {text.count(start_marker)}")
              start = text.index(start_marker)
              end = text.find(end_marker, start + len(start_marker))
              if end < 0:
                  raise SystemExit(f"{path}: missing end marker {end_marker!r}")
              path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one patch target, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          policing = Path("tests/test_policing_context_roadmap.py")
          splice(
              policing,
              "        # HTMLParser has already tokenized the complete start tag, including\n",
              "        # contenteditable changes committed governance prose into an\n",
              "".join([
                  "        # An open dialog is a top-layer block container. Preserve the\n",
                  "        # explicitly supported whole-surface wrapper only when the opener is\n",
                  "        # the first substantive content in the governed surface. Checking\n",
                  "        # merely the opener line lets a clean-line dialog extract a clause\n",
                  "        # fragment from surrounding prose while flattened text stays intact.\n",
                  "        if tag == \"dialog\" and \"open\" in attribute_names and self._source:\n",
                  "            start = self._source_offset()\n",
                  "            if self._source[:start].strip():\n",
                  "                self.violations.add(\"dialog-inline-block\")\n",
              ]),
          )
          splice(
              policing,
              "        if tag == \"dialog\":\n            dialog_was_open = self._dialog_open_stack.pop() if self._dialog_open_stack else False\n",
              "        if tag == \"a\":\n",
              "".join([
                  "        if tag == \"dialog\":\n",
                  "            dialog_was_open = self._dialog_open_stack.pop() if self._dialog_open_stack else False\n",
                  "            if dialog_was_open and self._source:\n",
                  "                start = self._source_offset()\n",
                  "                close = self._source.find(\">\", start)\n",
                  "                if close >= 0 and self._source[close + 1:].strip():\n",
                  "                    self.violations.add(\"dialog-inline-block\")\n",
              ]),
          )
          replace_once(
              policing,
              "        if tag == \"nobr\":\n            self._nobr_open = False\n\n    def handle_startendtag(\n",
              "".join([
                  "        if tag == \"nobr\":\n",
                  "            self._nobr_open = False\n",
                  "\n",
                  "    def close(self) -> None:\n",
                  "        super().close()\n",
                  "        # A missing closing tag cannot establish the complete wrapper\n",
                  "        # boundary required for the whole-surface dialog exception.\n",
                  "        if any(self._dialog_open_stack):\n",
                  "            self.violations.add(\"dialog-inline-block\")\n",
                  "\n",
                  "    def handle_startendtag(\n",
              ]),
          )

          registry = Path("tests/test_research_reference_registry.py")
          splice(
              registry,
              "BARE_HTTPS_LINE_PATTERN = re.compile(\n",
              "AUTOLINK_PATTERN = re.compile(",
              "".join([
                  "BARE_HTTPS_PATTERN = re.compile(\n",
                  "    r\"(?<![A-Za-z0-9])(?P<url>https?://[^\\s<>]+)\"\n",
                  ")\n",
              ]),
          )
          splice(
              registry,
              "    without_links = AUTOLINK_PATTERN.sub(\"\", without_reference_links)\n",
              "    return tuple(bindings)\n",
              "".join([
                  "    without_links = AUTOLINK_PATTERN.sub(\"\", without_reference_links)\n",
                  "    # Bare provenance URLs are equivalent whether they begin a list line\n",
                  "    # or follow a metadata label. Mask non-rendering reference definitions\n",
                  "    # so their destinations are not promoted to reader-visible bare links.\n",
                  "    bare_source = _mask_link_reference_definitions_for_visibility(without_links)\n",
                  "    for match in BARE_HTTPS_PATTERN.finditer(bare_source):\n",
                  "        candidate = match.group(\"url\")\n",
                  "        record(candidate, candidate, strip_prose=True)\n",
              ]),
          )

          text = registry.read_text(encoding="utf-8")
          fixture_start_marker = "ENTRY_WIDE_LINK_BINDINGS:"
          fixture_end_marker = "def _mapping_record_hashes"
          if text.count(fixture_start_marker) != 1:
              raise SystemExit("unexpected ENTRY_WIDE_LINK_BINDINGS fixture count")
          fixture_start = text.index(fixture_start_marker)
          fixture_end = text.index(fixture_end_marker, fixture_start)
          helper = "".join([
              "def _expected_entry_link_bindings(\n",
              "    contract: dict[str, object],\n",
              ") -> tuple[tuple[str, str], ...]:\n",
              "    \"\"\"Derive whole-entry link expectations from the sealed entry contract.\"\"\"\n",
              "    source_bindings = contract[\"source_bindings\"]\n",
              "    assert isinstance(source_bindings, tuple)\n",
              "    bindings = [\n",
              "        (_visible_inline_text(label), destination)\n",
              "        for label, destination in source_bindings\n",
              "    ]\n",
              "    if DOI_FIELD in contract:\n",
              "        doi = str(contract[DOI_FIELD])\n",
              "        bindings.append((_visible_inline_text(doi), doi))\n",
              "    return tuple(bindings)\n",
              "\n\n\n",
          ])
          registry.write_text(text[:fixture_start] + helper + text[fixture_end:], encoding="utf-8")

          replace_once(
              registry,
              "".join([
                  "    whole_entry_bindings = tuple(\n",
                  "        _usable_https_source_bindings(section, reference_scope=reference_scope)\n",
                  "    )\n",
                  "    expected_entry_bindings = ENTRY_WIDE_LINK_BINDINGS[entry]\n",
                  "    assert whole_entry_bindings == expected_entry_bindings, (\n",
                  "        f\"{entry} contains ungoverned or misbound hyperlinks outside its pinned \"\n",
                  "        f\"entry contract: expected {expected_entry_bindings!r}, \"\n",
                  "        f\"got {whole_entry_bindings!r}\"\n",
                  "    )\n",
              ]),
              "".join([
                  "    whole_entry_bindings = tuple(\n",
                  "        _usable_https_source_bindings(section, reference_scope=reference_scope)\n",
                  "    )\n",
                  "    expected_entry_bindings = _expected_entry_link_bindings(contract)\n",
                  "    # Discovery order depends on Markdown syntax (inline links are found\n",
                  "    # before bare URLs), so compare multisets. Counter preserves duplicate\n",
                  "    # detection while still rejecting extra or misbound links.\n",
                  "    assert Counter(whole_entry_bindings) == Counter(expected_entry_bindings), (\n",
                  "        f\"{entry} contains ungoverned or misbound hyperlinks outside its pinned \"\n",
                  "        f\"entry contract: expected {expected_entry_bindings!r}, \"\n",
                  "        f\"got {whole_entry_bindings!r}\"\n",
                  "    )\n",
              ]),
          )

          regression = Path("tests/test_pr4_clean_head_audit_regressions.py")
          lines = [
              '"""Regressions for the PR #4 clean-head audit blockers."""',
              "",
              "from collections import Counter",
              "from pathlib import Path",
              "import runpy",
              "",
              "import pytest",
              "",
              'ROOT = Path(__file__).resolve().parents[1]',
              'POLICING = runpy.run_path(str(ROOT / "tests/test_policing_context_roadmap.py"))',
              'REGISTRY = runpy.run_path(str(ROOT / "tests/test_research_reference_registry.py"))',
              'CORPUS = ROOT / "docs/RESEARCH-REFERENCE-CORPUS.md"',
              "",
              "",
              "def test_clean_line_dialog_clause_fragment_is_rejected() -> None:",
              "    fragment = (",
              '        "Availability through ABC iview is\\n"',
              '        "<dialog open>\\n"',
              '        "not\\n"',
              '        "</dialog>\\n"',
              '        "permission to redistribute content."',
              "    )",
              '    assert "dialog-inline-block" in POLICING["_governed_surface_html_violations"](fragment)',
              '    corpus = CORPUS.read_text(encoding="utf-8")',
              '    original = "Availability through ABC iview is not permission to redistribute content."',
              '    assert original in corpus',
              '    mutated = corpus.replace(original, fragment, 1)',
              '    with pytest.raises(AssertionError, match="dialog block-container HTML"):',
              '        REGISTRY["_validate_registry_corpus"](mutated)',
              "",
              "",
              "def test_whole_surface_open_dialog_wrapper_remains_supported() -> None:",
              '    fragment = "  \\n<dialog open>\\nCanonical governed prose.\\n</dialog>\\n  "',
              '    assert "dialog-inline-block" not in POLICING["_governed_surface_html_violations"](fragment)',
              "",
              "",
              "def test_unclosed_open_dialog_is_not_a_complete_wrapper() -> None:",
              '    fragment = "<dialog open>\\nCanonical governed prose.\\n"',
              '    assert "dialog-inline-block" in POLICING["_governed_surface_html_violations"](fragment)',
              "",
              "",
              "def test_single_source_accepts_equivalent_inline_link() -> None:",
              '    corpus = CORPUS.read_text(encoding="utf-8")',
              '    url = "https://iview.abc.net.au/show/black-comedy"',
              '    original = f"**Registered source:** {url}"',
              '    replacement = f"**Registered source:** [{url}]({url})"',
              '    assert original in corpus',
              '    REGISTRY["_validate_registry_corpus"](corpus.replace(original, replacement, 1))',
              "",
              "",
              "def test_single_source_whole_entry_binding_is_format_invariant() -> None:",
              '    corpus = CORPUS.read_text(encoding="utf-8")',
              '    url = "https://iview.abc.net.au/show/black-comedy"',
              '    entry = "### *Black Comedy* (ABC, 2014-2020)"',
              '    original = f"**Registered source:** {url}"',
              '    replacement = f"**Registered source:** [{url}]({url})"',
              '    sections = REGISTRY["_registered_sections"](corpus)',
              '    original_bindings = REGISTRY["_usable_https_source_bindings"](',
              '        sections[entry], reference_scope=corpus',
              '    )',
              '    mutated = corpus.replace(original, replacement, 1)',
              '    mutated_sections = REGISTRY["_registered_sections"](mutated)',
              '    linked_bindings = REGISTRY["_usable_https_source_bindings"](',
              '        mutated_sections[entry], reference_scope=mutated',
              '    )',
              '    expected = Counter({(url, url): 1})',
              '    assert Counter(original_bindings) == Counter(linked_bindings) == expected',
              "",
          ]
          regression.write_text("\n".join(lines), encoding="utf-8")
          PY

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run focused clean-head regressions
        run: |
          pytest -q \
            tests/test_pr4_clean_head_audit_regressions.py \
            tests/test_pr4_native_machine_dialog_regressions.py \
            tests/test_pr4_source_binding_regressions.py \
            tests/test_research_reference_registry.py \
            tests/test_policing_context_roadmap.py

      - name: Run full suite
        run: pytest -q --disable-warnings --maxfail=1

      - name: Commit verified repair and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr4-audit-repair.yml
          git add tests/test_policing_context_roadmap.py \
                  tests/test_research_reference_registry.py \
                  tests/test_pr4_clean_head_audit_regressions.py
          git diff --cached --check
          git commit -m "Fix PR4 clean-head audit blockers"
          git push origin HEAD:research-corpus-governed-expansion
