name: PR4 multiline dialog repair

on:
  push:
    branches:
      - research-corpus-governed-expansion

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Apply multiline dialog repair
        run: python scripts/pr4_multiline_dialog_repair.py

      - name: Run exact dialog regressions
        run: pytest -q tests/test_pr4_native_machine_dialog_regressions.py

      - name: Run focused governance suite
        run: >-
          pytest -q
          tests/test_research_reference_registry.py
          tests/test_policing_context_roadmap.py
          tests/test_workstream_g_integrity.py
          tests/test_workstream_h_methodology.py
          tests/test_policing_contract_receipt.py
          tests/test_ascft_methodology_integrity.py
          tests/test_phase2_review_followup.py

      - name: Validate datasets
        run: |
          python -m australian_for_ais.cli validate data/starter/examples.jsonl
          python -m australian_for_ais.cli validate-pilot data/pilot/items.jsonl

      - name: Run full suite
        run: pytest -q --disable-warnings --maxfail=1

      - name: Check whitespace
        run: git diff --check

      - name: Commit verified repair and remove temporary runner
        run: |
          rm scripts/pr4_multiline_dialog_repair.py
          rm .github/workflows/pr4-multiline-dialog-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Detect multiline open dialog tags'
          git push origin HEAD:research-corpus-governed-expansion
