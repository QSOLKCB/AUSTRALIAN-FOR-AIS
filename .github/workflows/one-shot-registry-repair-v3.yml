name: Corrected one-shot registry parser repair

on:
  push:
    branches: ["research-corpus-governed-expansion"]
    paths: [".github/workflows/one-shot-registry-repair-v3.yml"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0

      - name: Execute corrected staged repair
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path(".github/workflows/one-shot-registry-repair.yml").read_text(encoding="utf-8")
          staged = workflow.split("python - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          script = textwrap.dedent(staged)
          script = script.replace(
              'rf"(?m)^{{0,3}}{re.escape(field)}',
              'rf"(?m)^ {{0,3}}{re.escape(field)}',
          )
          exec(compile(script, "staged-registry-repair", "exec"), {"__name__": "__main__"})
          PY

      - name: Validate focused repair
        run: |
          python -m py_compile tests/test_research_reference_registry.py
          python -m pip install -e ".[dev]"
          pytest -q tests/test_research_reference_registry.py --disable-warnings --maxfail=1

      - name: Commit repair and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_research_reference_registry.py
          git rm .github/workflows/one-shot-registry-repair.yml
          git rm .github/workflows/one-shot-registry-repair-v3.yml
          git commit -m "Harden registry rendered Markdown semantics"
          git push origin HEAD:research-corpus-governed-expansion
