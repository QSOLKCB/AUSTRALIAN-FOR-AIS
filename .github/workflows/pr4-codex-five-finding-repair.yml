name: PR4 Codex five-finding repair

on:
  push:
    branches:
      - research-corpus-governed-expansion

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: research-corpus-governed-expansion
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Apply repair
        run: python .github/pr4_codex_repair.py
      - name: Refine Trans-Tasman structure receipt
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re
          import runpy

          path = Path('tests/test_workstream_h_methodology.py')
          text = path.read_text(encoding='utf-8')
          h_ns = runpy.run_path(str(path))
          policing = runpy.run_path('tests/test_policing_context_roadmap.py')
          methodology = Path('docs/METHODOLOGY.md').read_text(encoding='utf-8')
          raw = h_ns['_trans_tasman_raw'](methodology)
          structural = policing['_rendered_structure'](raw)
          source_lines = raw.splitlines()
          structural_lines = structural.splitlines()
          assert len(source_lines) == len(structural_lines)
          value = '\n'.join(
              original.rstrip()
              for original, live in zip(source_lines, structural_lines)
              if live.strip()
          )
          expected = hashlib.sha256(value.encode('utf-8')).hexdigest()
          text, count = re.subn(
              r'TRANS_TASMAN_SOURCE_STRUCTURE_SHA256 = "[0-9a-f]{64}"',
              f'TRANS_TASMAN_SOURCE_STRUCTURE_SHA256 = "{expected}"',
              text,
              count=1,
          )
          assert count == 1
          old = '''    actual_structure_hash = hashlib.sha256(raw_section.encode("utf-8")).hexdigest()
          '''
          new = '''    namespace = runpy.run_path(str(POLICING_TEST))
              structural = namespace["_rendered_structure"](raw_section)
              source_lines = raw_section.splitlines()
              structural_lines = structural.splitlines()
              assert len(source_lines) == len(structural_lines)
              source_structure_value = "\\n".join(
                  original.rstrip()
                  for original, live in zip(source_lines, structural_lines)
                  if live.strip()
              )
              actual_structure_hash = hashlib.sha256(
                  source_structure_value.encode("utf-8")
              ).hexdigest()
          '''
          old = old.replace('          ', '')
          new = new.replace('          ', '')
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Run focused governance tests
        run: >-
          python -m pytest -q
          tests/test_pr4_current_review_regressions.py
          tests/test_workstream_g_integrity.py
          tests/test_workstream_h_methodology.py
          tests/test_research_reference_registry.py
      - name: Run full suite and datasets
        run: |
          python -m pytest -q
          python -m australian_for_ais.cli validate data/starter/examples.jsonl
          python -m australian_for_ais.cli validate-pilot data/pilot/items.jsonl
          git diff --check
      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr4-codex-five-finding-repair.yml .github/pr4_codex_repair.py
          git add tests/test_research_reference_registry.py tests/test_workstream_h_methodology.py tests/test_workstream_g_integrity.py tests/test_pr4_current_review_regressions.py
          git commit -m "Seal remaining governance receipts"
          git push origin HEAD:research-corpus-governed-expansion
