name: PR4 Codex five-finding repair

on:
  push:
    branches:
      - research-corpus-governed-expansion

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: research-corpus-governed-expansion
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Apply repair
        run: python .github/pr4_codex_repair.py
      - name: Run focused governance tests
        run: >-
          python -m pytest -q
          tests/test_pr4_current_review_regressions.py
          tests/test_workstream_g_integrity.py
          tests/test_workstream_h_methodology.py
          tests/test_research_reference_registry.py
      - name: Run full suite and datasets
        run: |
          python -m pytest -q
          python -m australian_for_ais.cli validate data/starter/examples.jsonl
          python -m australian_for_ais.cli validate-pilot data/pilot/items.jsonl
          git diff --check
      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr4-codex-five-finding-repair.yml .github/pr4_codex_repair.py
          git add tests/test_research_reference_registry.py tests/test_workstream_h_methodology.py tests/test_workstream_g_integrity.py tests/test_pr4_current_review_regressions.py
          git commit -m "Seal remaining governance receipts"
          git push origin HEAD:research-corpus-governed-expansion
