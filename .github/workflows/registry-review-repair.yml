name: Focused registry review repair
# Triggered after the workflow exists in the branch history.

on:
  push:
    branches: ["research-corpus-governed-expansion"]
    paths:
      - ".github/workflows/registry-review-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0

      - name: Apply direct Python repair
        run: python scripts/_tmp_registry_review_repair.py

      - name: Validate focused registry suite
        run: |
          python -m py_compile tests/test_research_reference_registry.py
          python -m pip install -e ".[dev]"
          pytest -q tests/test_research_reference_registry.py --disable-warnings --maxfail=1

      - name: Commit green repair and remove temporary machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_research_reference_registry.py
          git rm scripts/_tmp_registry_review_repair.py
          git rm .github/workflows/registry-review-repair.yml
          git commit -m "Harden latest registry review semantics"
          git push origin HEAD:research-corpus-governed-expansion
