name: PR4 four-latest-review guarded repair

on:
  push:
    branches:
      - research-corpus-governed-expansion
    paths:
      - '.github/scripts/pr4-four-latest-review-repair.py'
      - '.github/workflows/pr4-four-latest-review-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Apply four latest review repairs
        run: python .github/scripts/pr4-four-latest-review-repair.py
      - name: Align rendered-boundary and metadata interfaces
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_research_reference_registry.py")
          text = path.read_text(encoding="utf-8")

          old = '''        if not is_code and logical.strip(" \\t") == heading:\n            matches.append((offset, offset + len(line)))\n        offset += len(raw_line)\n'''
          new = '''        if not is_code and logical.strip(" \\t") == heading:\n            matches.append((offset, offset + len(raw_line)))\n        offset += len(raw_line)\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one heading-span anchor, found {text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''    rendered, structure = _markdown_views(section)\n    rendered_lines = rendered.splitlines()\n    structure_lines = structure.splitlines()\n'''
          new = '''    rendered, structure = _markdown_views(section)\n    rendered = _mask_hidden_html_regions(rendered)\n    structure = _mask_hidden_html_regions(structure)\n    rendered_lines = rendered.splitlines()\n    structure_lines = structure.splitlines()\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one rendered-lines anchor, found {text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''    decoded = html.unescape(line)\n    inline_links = _markdown_inline_links(decoded)\n'''
          new = '''    decoded = html.unescape(line)\n    paragraph_wrapper = re.match(r"<p\\b[^>]*>[ \\t]*", decoded, flags=re.IGNORECASE)\n    if paragraph_wrapper:\n        decoded = decoded[paragraph_wrapper.end():]\n    inline_links = _markdown_inline_links(decoded)\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one metadata canonicalizer anchor, found {text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''def _validate_registry_corpus(corpus: str) -> None:\n    rendered, structure = _markdown_views(corpus)\n    contract_start, _ = _visible_markdown_heading_span(structure, CONTRACT_HEADING)\n    contract_end, _ = _visible_markdown_heading_span(structure, BATCH_HEADING)\n'''
          new = '''def _validate_registry_corpus(corpus: str) -> None:\n    rendered, structure = _markdown_views(corpus)\n    try:\n        contract_start, _ = _visible_markdown_heading_span(structure, CONTRACT_HEADING)\n    except AssertionError as exc:\n        raise AssertionError("rendered registration contract is missing") from exc\n    contract_end, _ = _visible_markdown_heading_span(structure, BATCH_HEADING)\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one registry validation anchor, found {text.count(old)}")
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY
      - name: Run focused regressions
        run: pytest -q tests/test_research_reference_registry.py
      - name: Run full suite
        run: pytest -q --disable-warnings --maxfail=1
      - name: Commit verified repairs and remove temporary runner
        run: |
          rm .github/scripts/pr4-four-latest-review-repair.py
          rm .github/workflows/pr4-four-latest-review-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "Close four latest PR4 review gaps"
          git push origin HEAD:research-corpus-governed-expansion
