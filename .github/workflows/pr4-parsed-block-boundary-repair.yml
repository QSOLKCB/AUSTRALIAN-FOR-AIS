name: PR4 parsed block boundary repair

on:
  push:
    branches: [research-corpus-governed-expansion]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10
          ref: research-corpus-governed-expansion

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify guarded ancestry
        run: |
          set -euo pipefail
          base='7666b80b588020d01803eb51ff64a9480a4f5181'
          git merge-base --is-ancestor "$base" HEAD
          unexpected="$(git diff --name-only "$base"..HEAD | grep -Ev '^(.github/workflows/pr4-parsed-block-boundary-repair.yml|scripts/pr4_parsed_block_repair.py)$' || true)"
          test -z "$unexpected"

      - name: Apply repair
        run: python scripts/pr4_parsed_block_repair.py

      - name: Syntax and whitespace checks
        run: |
          python -m py_compile tests/test_policing_context_roadmap.py tests/test_pr4_clean_head_audit_regressions.py
          git diff --check

      - name: Focused governance verification
        run: pytest -q tests/test_pr4_clean_head_audit_regressions.py tests/test_policing_context_roadmap.py tests/test_research_reference_registry.py

      - name: Full suite verification
        run: pytest -q --disable-warnings --maxfail=1

      - name: Commit verified repair and remove temporary runner
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr4-parsed-block-boundary-repair.yml scripts/pr4_parsed_block_repair.py
          git add tests/test_policing_context_roadmap.py tests/test_pr4_clean_head_audit_regressions.py
          git diff --cached --check
          git commit -m 'Fix parsed block-container boundaries'
          git push origin HEAD:research-corpus-governed-expansion
