name: PR4 parsed block boundary repair

on:
  push:
    branches:
      - research-corpus-governed-expansion

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: research-corpus-governed-expansion

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pin repair parent
        shell: bash
        run: |
          set -euo pipefail
          expected='7666b80b588020d01803eb51ff64a9480a4f5181'
          actual="$(git rev-parse HEAD^)"
          test "$actual" = "$expected"

      - name: Apply parsed block repair and regressions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          policing_path = Path('tests/test_policing_context_roadmap.py')
          text = policing_path.read_text(encoding='utf-8')

          old = '    "head", "hr", "html", "iframe", "link", "noframes", "ol", "optgroup",\n'
          new = '    "head", "hr", "html", "iframe", "li", "link", "noframes", "ol", "optgroup",\n'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '        if tag in {"ol", "ul"}:\n            self.violations.add("raw-list")\n'
          new = '        if tag in {"ol", "ul", "li"}:\n            self.violations.add("raw-list")\n'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          marker = '        tag = tag.lower()\n'
          assert text.count(marker) >= 1
          parsed_start_policy = '''        # Generic CommonMark block containers are checked from HTMLParser's\n        # complete parsed start-tag span. This is deliberately source-aware so\n        # multiline attributes cannot evade the ownership boundary by being\n        # split across physical source lines.\n        if tag in GOVERNED_RAW_BLOCK_CONTAINER_TAGS and self._source:\n            start = self._source_offset()\n            raw_tag = self.get_starttag_text() or ""\n            end = start + len(raw_tag)\n            previous = _nearest_substantive_source_line(\n                self._source, start, before=True\n            )\n            if (\n                not raw_tag\n                or not _source_tag_occupies_line(self._source, start, end)\n                or (\n                    previous is not None\n                    and not _is_governed_structural_boundary(previous)\n                )\n            ):\n                self.violations.add("raw-block")\n            else:\n                # CommonMark type-6 blocks consume source through the next\n                # blank line. Do not let a following Markdown list, quote, or\n                # ATX heading be re-invented later by line-based receipts.\n                line_end = self._source.find("\\n", end)\n                if line_end >= 0:\n                    next_end = self._source.find("\\n", line_end + 1)\n                    if next_end < 0:\n                        next_end = len(self._source)\n                    following = self._source[line_end + 1:next_end].lstrip(" \\t")\n                    if (\n                        LIST_MARKER_PATTERN.match(following) is not None\n                        or following.startswith(">")\n                        or re.match(r"#{1,6}(?:[ \\t]+|$)", following) is not None\n                    ):\n                        self.violations.add("raw-block")\n'''
          text = text.replace(marker, marker + parsed_start_policy, 1)

          endtag_marker = '    def handle_endtag(self, tag: str) -> None:\n        tag = tag.lower()\n'
          assert text.count(endtag_marker) == 1
          parsed_end_policy = '''        # Match generic block end tags from the parsed source position rather\n        # than a line-local regex. Closing boundaries must also occupy their\n        # source line and hand control back at a real structural boundary.\n        if tag in GOVERNED_RAW_BLOCK_CONTAINER_TAGS and self._source:\n            start = self._source_offset()\n            match = re.match(\n                rf"</{re.escape(tag)}[ \\t\\r\\n\\f]*>",\n                self._source[start:],\n                flags=re.IGNORECASE,\n            )\n            if match is None:\n                self.violations.add("raw-block")\n            else:\n                end = start + match.end()\n                following = _nearest_substantive_source_line(\n                    self._source, end, before=False\n                )\n                if (\n                    not _source_tag_occupies_line(self._source, start, end)\n                    or (\n                        following is not None\n                        and not _is_governed_structural_boundary(following)\n                    )\n                ):\n                    self.violations.add("raw-block")\n'''
          text = text.replace(endtag_marker, endtag_marker + parsed_end_policy, 1)

          start_marker = '    # Raw block containers may be retained only as complete structural\n'
          end_marker = '    # Markdown links become anchors only after Markdown rendering, so the raw-HTML\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = (
              '    # Generic raw-block ownership is enforced by the parsed HTML start/end\\n'
              '    # tag callbacks above, including multiline tags. Keep this function-level\\n'
              '    # pass focused on Markdown-only semantics that HTMLParser cannot see.\\n\\n'
          ).replace('\\n', '\n')
          text = text[:start] + replacement + text[end:]
          policing_path.write_text(text, encoding='utf-8')

          regression_path = Path('tests/test_pr4_clean_head_audit_regressions.py')
          regressions = regression_path.read_text(encoding='utf-8')
          addition = r'''


def test_multiline_generic_raw_block_opener_cannot_detach_rights_boundary() -> None:
    corpus = CORPUS.read_text(encoding="utf-8")
    original = (
        "Availability through ABC iview is not permission "
        "to redistribute content."
    )
    fragment = (
        "Availability through ABC iview is "
        '<center data-x="a\nb">not permission to redistribute content.'
    )
    assert original in corpus
    violations = POLICING["_governed_surface_html_violations"](fragment)
    assert "raw-block" in violations
    with pytest.raises(AssertionError, match="raw block-container HTML"):
        REGISTRY["_validate_registry_corpus"](
            corpus.replace(original, fragment, 1)
        )


def test_list_item_cannot_wrap_complete_governed_entry() -> None:
    fragment = (
        "## Governed section\n\n"
        "<li>\n\nCanonical governed prose.\n\n</li>\n\n"
        "## Next section\n"
    )
    violations = POLICING["_governed_surface_html_violations"](fragment)
    assert "raw-list" in violations
    assert "li" in POLICING["GOVERNED_BLOCK_TAGS_WITH_DEDICATED_POLICY"]
    assert "li" not in POLICING["GOVERNED_RAW_BLOCK_CONTAINER_TAGS"]

    corpus = CORPUS.read_text(encoding="utf-8")
    start = corpus.index("### *Black Comedy* (ABC, 2014-2020)")
    end = corpus.index("\n### *Kath & Kim*", start)
    entry = corpus[start:end]
    mutated = corpus[:start] + "<li>\n\n" + entry + "\n</li>\n" + corpus[end:]
    with pytest.raises(AssertionError, match="raw list HTML"):
        REGISTRY["_validate_registry_corpus"](mutated)
'''
          assert 'test_multiline_generic_raw_block_opener_cannot_detach_rights_boundary' not in regressions
          regression_path.write_text(regressions.rstrip() + addition + '\n', encoding='utf-8')
          PY

      - name: Syntax and whitespace checks
        run: |
          python -m py_compile tests/test_policing_context_roadmap.py tests/test_pr4_clean_head_audit_regressions.py
          git diff --check

      - name: Focused governance verification
        run: |
          pytest -q \
            tests/test_pr4_clean_head_audit_regressions.py \
            tests/test_policing_context_roadmap.py \
            tests/test_research_reference_registry.py

      - name: Full suite verification
        run: pytest -q --disable-warnings --maxfail=1

      - name: Commit verified repair and self-delete runner
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr4-parsed-block-boundary-repair.yml
          git add tests/test_policing_context_roadmap.py tests/test_pr4_clean_head_audit_regressions.py
          git diff --cached --check
          git commit -m 'Fix parsed block-container boundaries'
          git push origin HEAD:research-corpus-governed-expansion
