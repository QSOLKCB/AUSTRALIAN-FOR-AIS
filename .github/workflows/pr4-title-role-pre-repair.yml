name: PR4 title role pre repair

on:
  push:
    branches:
      - research-corpus-governed-expansion

permissions:
  contents: write

concurrency:
  group: pr4-title-role-pre-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: research-corpus-governed-expansion
          fetch-depth: 0

      - name: Guard reviewed base and temporary movement only
        shell: bash
        run: |
          set -euo pipefail
          reviewed=5d468b10def4160bb57858c7b450fb88313139d3
          git cat-file -e "$reviewed^{commit}"
          mapfile -t changed < <(git diff --name-only "$reviewed"..HEAD | sort)
          expected=(
            ".github/repair-pr4-title-role-pre.py"
            ".github/workflows/pr4-title-role-pre-repair.yml"
          )
          printf '%s\n' "${changed[@]}" > /tmp/changed
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected
          diff -u /tmp/expected /tmp/changed

      - name: Install test environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Apply repair
        shell: bash
        run: |
          set -euo pipefail
          python .github/repair-pr4-title-role-pre.py
          git diff --check

      - name: Run exact current-review regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_pr4_current_review_regressions.py

      - name: Run focused governance suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_policing_context_roadmap.py \
            tests/test_research_reference_registry.py \
            tests/test_workstream_h_methodology.py \
            tests/test_pr4_current_review_regressions.py

      - name: Validate governed datasets
        shell: bash
        run: |
          set -euo pipefail
          python -m australian_for_ais.cli validate data/starter/examples.jsonl
          python -m australian_for_ais.cli validate-pilot data/pilot/items.jsonl

      - name: Run full suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q

      - name: Self-clean and commit tested repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/repair-pr4-title-role-pre.py
          rm .github/workflows/pr4-title-role-pre-repair.yml
          git add \
            tests/test_policing_context_roadmap.py \
            tests/test_research_reference_registry.py \
            tests/test_workstream_h_methodology.py \
            tests/test_pr4_current_review_regressions.py \
            .github/repair-pr4-title-role-pre.py \
            .github/workflows/pr4-title-role-pre-repair.yml
          git diff --cached --check
          mapfile -t staged < <(git diff --cached --name-only | sort)
          expected=(
            ".github/repair-pr4-title-role-pre.py"
            ".github/workflows/pr4-title-role-pre-repair.yml"
            "tests/test_policing_context_roadmap.py"
            "tests/test_pr4_current_review_regressions.py"
            "tests/test_research_reference_registry.py"
            "tests/test_workstream_h_methodology.py"
          )
          printf '%s\n' "${staged[@]}" > /tmp/staged
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected-staged
          diff -u /tmp/expected-staged /tmp/staged
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Seal governed citation and anchor semantics'
          git push origin HEAD:research-corpus-governed-expansion
