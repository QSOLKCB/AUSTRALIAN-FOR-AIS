name: PR4 heading spacing metadata repair

on:
  push:
    branches:
      - research-corpus-governed-expansion
    paths:
      - .github/repair-pr4-heading-spacing-metadata.py
      - .github/workflows/pr4-heading-spacing-metadata-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Guard reviewed head and scaffold
        shell: bash
        run: |
          set -euo pipefail
          reviewed=38ec2c939c846c8be5bc398f4f041c2de091ae1c
          git merge-base --is-ancestor "$reviewed" HEAD
          mapfile -t changed < <(git diff --name-only "$reviewed"..HEAD)
          printf 'scaffold_change=%s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "$path" in
              .github/repair-pr4-heading-spacing-metadata.py|.github/workflows/pr4-heading-spacing-metadata-repair.yml) ;;
              *) echo "unexpected branch movement since reviewed head: $path" >&2; exit 1 ;;
            esac
          done

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Reproduce all reported bypasses before repair
        run: python .github/repair-pr4-heading-spacing-metadata.py reproduce

      - name: Apply guarded repair
        run: python .github/repair-pr4-heading-spacing-metadata.py apply

      - name: Check patch whitespace
        run: git diff --check

      - name: Run exact current-review regressions
        run: pytest -q tests/test_pr4_current_review_regressions.py

      - name: Run focused governance suite
        run: >-
          pytest -q
          tests/test_policing_context_roadmap.py
          tests/test_research_reference_registry.py
          tests/test_workstream_h_methodology.py
          tests/test_policing_contract_receipt.py
          tests/test_phase2_review_followup.py
          tests/test_pr4_current_review_regressions.py

      - name: Validate starter dataset
        run: python -m australian_for_ais.cli validate data/starter/examples.jsonl

      - name: Validate Phase 2 pilot pack
        run: python -m australian_for_ais.cli validate-pilot data/pilot/items.jsonl

      - name: Run full suite
        run: pytest -q --disable-warnings --maxfail=1

      - name: Commit verified repair and self-clean scaffold
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/repair-pr4-heading-spacing-metadata.py
          rm -f .github/workflows/pr4-heading-spacing-metadata-repair.yml
          git add -A -- \
            tests/test_policing_context_roadmap.py \
            tests/test_research_reference_registry.py \
            tests/test_pr4_current_review_regressions.py \
            .github/repair-pr4-heading-spacing-metadata.py \
            .github/workflows/pr4-heading-spacing-metadata-repair.yml
          git diff --cached --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Seal governed heading spacing and metadata semantics"
          git push origin HEAD:research-corpus-governed-expansion
